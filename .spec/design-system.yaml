# opentraces.ai Design System
# Extracted from: tokens.css, globals.css, style.css, viewer components

approach: tailwind-css-variables
component_library: custom
component_count: 43  # viewer React components
dark_mode: data-attribute  # [data-theme="dark"] / [data-theme="light"]

shared_token_package:
  name: "@opentraces/ui"
  path: packages/opentraces-ui/tokens.css
  imports_google_fonts: true
  fonts_loaded:
    - JetBrains Mono
    - Space Grotesk
    - IBM Plex Mono
    - Space Mono

tokens:
  colors:
    light:
      bg: "#E4E2DF"
      bg-alt: "#D8D6D2"
      surface: "#EEEDEB"
      surface-hover: "#E4E2DF"
      surface-elevated: "#F2F1EF"
      text: "#0A0A0A"
      text-secondary: "#2A2A2A"
      text-muted: "#6B6B6B"
      text-dim: "#A0A0A0"
      accent: "#C2410C"
      accent-dim: "#EA580C"
      accent-bg: "rgba(194, 65, 12, 0.07)"
      green: "#15803D"
      green-dim: "#16A34A"
      green-bg: "rgba(21, 128, 61, 0.06)"
      red: "#B91C1C"
      red-bg: "rgba(185, 28, 28, 0.06)"
      yellow: "#92400E"
      yellow-bg: "rgba(146, 64, 14, 0.06)"
      blue: "#1D4ED8"
      blue-bg: "rgba(29, 78, 216, 0.06)"
      cyan: "#0E7490"
      border: "#C5C3BF"
      border-strong: "#9A9895"

    dark:
      bg: "#111111"
      bg-alt: "#0A0A0A"
      surface: "#191919"
      surface-hover: "#222222"
      surface-elevated: "#1E1E1E"
      text: "#E0E0E0"
      text-secondary: "#B0B0B0"
      text-muted: "#666666"
      text-dim: "#444444"
      accent: "#F97316"
      accent-dim: "#9A3412"
      accent-bg: "rgba(249, 115, 22, 0.08)"
      green: "#22C55E"
      green-dim: "#166534"
      green-bg: "rgba(34, 197, 94, 0.08)"
      red: "#EF4444"
      red-bg: "rgba(239, 68, 68, 0.08)"
      yellow: "#EAB308"
      yellow-bg: "rgba(234, 179, 8, 0.08)"
      blue: "#3B82F6"
      blue-bg: "rgba(59, 130, 246, 0.08)"
      cyan: "#22D3EE"
      border: "#2A2A2A"
      border-strong: "#3A3A3A"

    # Flask review web UI uses --ot-* prefix with dark-only palette
    flask_review:
      subagent-border: "#818cf8"
      subagent-bg: "rgba(129, 140, 248, 0.08)"

    # Viewer trace visualization semantic colors
    trace_roles:
      user: "var(--blue)"
      agent: "var(--purple, #A855F7)"  # purple not in tokens, hardcoded fallback
      tool: "var(--text-secondary)"
      system: "var(--text-muted)"
      subagent: "var(--cyan)"

    trace_tools:
      Read: "var(--green)"
      Edit: "var(--yellow, #EAB308)"
      Write: "var(--yellow, #EAB308)"
      Bash: "var(--green)"
      Grep: "var(--green)"
      Glob: "var(--green)"
      WebSearch: "var(--accent)"
      WebFetch: "var(--accent)"
      Agent: "var(--cyan)"
      ToolSearch: "var(--accent)"

    timeline_type_colors:
      user: "var(--blue)"
      agent: "var(--green)"
      tool: "var(--purple, #A855F7)"
      system: "var(--text-dim)"
      subagent: "var(--cyan)"

  typography:
    font-mono: "'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace"
    font-display: "'Space Grotesk', system-ui, sans-serif"
    font-body: "'IBM Plex Mono', 'JetBrains Mono', monospace"
    font-label: "'Space Mono', 'JetBrains Mono', monospace"
    font-code: "'JetBrains Mono', monospace"  # Flask review only

    base_size: 13px
    line_height: 1.65
    heading_weight: 400
    heading_letter_spacing: "-0.03em"
    label_size: 10px
    label_weight: 700
    label_transform: uppercase
    label_tracking: "0.1em"
    hero_size: "clamp(32px, 4.5vw, 52px)"

  spacing:
    # No formal spacing scale, uses Tailwind defaults + CSS values
    container_max_width: 1100px
    container_padding: 24px

  radius:
    global: "0 !important"  # Zero radius everywhere, TUI aesthetic
    note: "Applied via *, *::before, *::after { border-radius: 0 !important; }"

  shadows:
    note: "No box-shadows used. Design relies on borders only."

  borders:
    default: "1px solid var(--border)"
    strong: "1px solid var(--border-strong)"
    accent: "1px solid var(--accent)"
    collapse_pattern: "Adjacent elements use margin-right: -1px; margin-bottom: -1px to collapse borders"

css_methodology:
  framework: tailwind-v4
  config_location: "CSS-only (no tailwind.config.js), PostCSS plugin @tailwindcss/postcss"
  global_styles:
    viewer: "web/viewer/src/globals.css (imports @opentraces/ui/tokens.css)"
    mktg: "web/site/src/app/globals.css (self-contained, duplicates tokens)"
    flask: "src/opentraces/clients/web/static/style.css (standalone, --ot-* prefix)"
  variable_pattern: "Short names (--bg, --text, --accent) via CSS custom properties, referenced in Tailwind as var(--name)"
  utility_merge: none  # No cn(), clsx(), or class-variance-authority used
  tailwind_variable_syntax: "text-[var(--text-muted)], bg-[var(--surface)], border-[var(--border)]"

animation:
  library: "motion (framer-motion v12.38.0, imported as motion/react)"
  icon_system:
    source: "itshover (https://github.com/itshover/itshover)"
    pattern: "forwardRef + useImperativeHandle with startAnimation/stopAnimation"
    trigger: "onMouseEnter/onMouseLeave on wrapper div"
    primitives: "motion.svg, motion.path, motion.circle"
  css_transitions:
    default_duration: "100ms"
    default_property: "colors"
    pattern: "transition-colors duration-100 (Tailwind class, ubiquitous)"
    resize_handles: "transition-colors duration-100"
    context_flow: "transition-all duration-200"
  easing:
    icon_animations: "easeInOut, easeOut"
    css_default: "ease (browser default)"

responsive:
  approach: desktop-first
  viewer: "No responsive breakpoints, fixed desktop layout with resizable panels"
  mktg: "No Tailwind responsive prefixes found in components"
  flask:
    breakpoint: "768px"
    changes:
      - "Filter grid: 3-col to 1-col"
      - "Meta grid: auto-fit to 2-col"
      - "Stats grid: 4-col to 2-col"
      - "Subagent indent: 32px to 12px"
      - "Verdict buttons: row to column, full width"
      - "Session header grid: 2-col to 1-col"
