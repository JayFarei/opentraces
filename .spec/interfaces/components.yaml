# React Components: Props, Hooks, Contexts
# Extracted from viewer/src/

contexts:
  - name: SelectionContext
    source: viewer/src/contexts/SelectionContext.tsx
    provider: SelectionProvider
    hook: useSelection
    state:
      - name: selectedSessionId
        type: "string | null"
      - name: selectedNodeId
        type: "string | null"
      - name: setSelectedSessionId
        type: "(id: string | null) => void"
        note: "Also resets selectedNodeId to null"
      - name: setSelectedNodeId
        type: "(id: string | null) => void"

  - name: ViewPreferencesContext
    source: viewer/src/contexts/ViewPreferencesContext.tsx
    provider: ViewPreferencesProvider
    hook: useViewPreferences
    state:
      - name: showReasoning
        type: boolean
        default: true
      - name: showTimeline
        type: boolean
        default: true
      - name: theme
        type: "'dark' | 'light'"
        default: dark
        persistence: "localStorage('opentraces-theme')"
      - name: toggleReasoning
        type: "() => void"
      - name: toggleTimeline
        type: "() => void"
      - name: toggleTheme
        type: "() => void"

hooks:
  - name: useTraceData
    source: viewer/src/hooks/useTraceData.ts
    params: "(traceId: string | null)"
    returns:
      extends: "UseQueryResult<TraceRecord>"
      additional:
        - name: tree
          type: "TreeNode[]"
          derived_from: "buildTree(query.data.steps)"
    dependencies: ["@tanstack/react-query", "fetchTrace", "buildTree"]

  - name: useSessionList
    source: viewer/src/hooks/useSessionList.ts
    params: "()"
    returns: "UseQueryResult<SessionListItem[]>"
    config:
      refetchInterval: 5000

  - name: useReviewActions
    source: viewer/src/hooks/useReviewActions.ts
    params: "()"
    returns:
      - name: stage
        type: "UseMutationResult<void, Error, string>"
      - name: unstage
        type: "UseMutationResult<void, Error, string>"
      - name: approve
        type: "UseMutationResult<void, Error, string>"
      - name: reject
        type: "UseMutationResult<void, Error, string>"
      - name: redact
        type: "UseMutationResult<void, Error, {traceId: string, stepIndex: number}>"
      - name: commit
        type: "UseMutationResult<{commit_id: string}, Error, {sessionIds: string[], message: string}>"
      - name: push
        type: "UseMutationResult<{hf_commit_sha: string}, Error, string>"
    invalidation_behavior: "All mutations invalidate ['sessions'], redact also invalidates ['trace', traceId]"

  - name: useKeyboardNav
    source: viewer/src/hooks/useKeyboardNav.ts
    params: "()"
    returns:
      - name: focusedPanel
        type: "FocusedPanel"  # "sessions" | "tree" | "detail"
      - name: showHelp
        type: boolean
      - name: setShowHelp
        type: "(v: boolean) => void"
      - name: showCommitDialog
        type: boolean
      - name: setShowCommitDialog
        type: "(v: boolean) => void"
    keyboard_bindings:
      j: "Navigate down in current panel"
      k: "Navigate up in current panel"
      Enter: "Select/expand current item"
      s: "Stage selected session"
      c: "Open commit dialog"
      "?": "Toggle help overlay"
      Escape: "Dismiss overlays"
      Tab: "Move focus between panels (sessions -> tree -> detail)"

components:
  trace:
    - name: TraceTree
      source: viewer/src/components/trace/TraceTree.tsx
      props:
        - name: tree
          type: "TreeNode[]"
        - name: traceStartMs
          type: "number | null"
      features: "Virtualized list via @tanstack/react-virtual"

    - name: StepNode
      source: viewer/src/components/trace/StepNode.tsx
      props:
        - name: node
          type: TreeNode
        - name: traceStartMs
          type: "number | null"

    - name: ContextFlow
      source: viewer/src/components/trace/ContextFlow.tsx
      props:
        - name: tree
          type: "TreeNode[]"
      description: "Context flow visualization grouping nodes by source (user, project, tool, system)"

  detail:
    - name: StepDetail
      source: viewer/src/components/detail/StepDetail.tsx
      props:
        - name: step
          type: Step
        - name: security
          type: "SecurityMetadata | null"

    - name: ToolCallDetail
      source: viewer/src/components/detail/ToolCallDetail.tsx
      props:
        - name: toolCall
          type: ToolCall
        - name: observation
          type: "Observation | null"
        - name: compact
          type: boolean
          optional: true

    - name: SecurityBadge
      source: viewer/src/components/detail/SecurityBadge.tsx
      props:
        - name: security
          type: SecurityMetadata

    - name: ReasoningBlock
      source: viewer/src/components/detail/ReasoningBlock.tsx
      props:
        - name: content
          type: string

    - name: RedactionPreview
      source: viewer/src/components/detail/RedactionPreview.tsx
      props:
        - name: preview
          type: RedactionPreviewType

  sessions:
    - name: SessionRow
      source: viewer/src/components/sessions/SessionRow.tsx
      props:
        - name: session
          type: SessionListItem
        - name: isSelected
          type: boolean
        - name: onSelect
          type: "() => void"

    - name: StageGroup
      source: viewer/src/components/sessions/StageGroup.tsx
      props:
        - name: stage
          type: SessionStage
        - name: sessions
          type: "SessionListItem[]"

  layout:
    - name: KeyboardHelp
      source: viewer/src/components/layout/KeyboardHelp.tsx
      props:
        - name: onDismiss
          type: "() => void"

  review:
    - name: CommitDialog
      source: viewer/src/components/review/CommitDialog.tsx
      props:
        - name: sessions
          type: "SessionListItem[]"
        - name: onClose
          type: "() => void"

    - name: RedactionWand
      source: viewer/src/components/review/RedactionWand.tsx
      props:
        - name: traceId
          type: string
        - name: stepIndex
          type: number
        - name: onRedact
          type: "() => void"
        - name: hasRedaction
          type: boolean

  other:
    - name: Onboarding
      source: viewer/src/components/Onboarding.tsx
      props:
        - name: onLoadSample
          type: "() => void"

  icons:
    barrel: viewer/src/components/icons/index.ts
    description: "Custom icon components for tool types and UI elements"

component_patterns:
  description: >
    React functional components using TypeScript, Tailwind CSS classes, motion (framer-motion)
    for animations, and @tanstack/react-virtual for virtualized lists. Components follow
    PascalCase naming, grouped by concern (trace/, detail/, layout/, sessions/, review/, icons/).
    State management via React contexts (SelectionContext, ViewPreferencesContext).
  frameworks:
    - react (functional components, hooks)
    - tailwindcss (utility classes)
    - motion (framer-motion, animations)
    - "@tanstack/react-query" (data fetching)
    - "@tanstack/react-virtual" (virtualized lists)
    - d3-scale (color/sizing scales)
