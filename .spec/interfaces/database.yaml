# Data Models: Pydantic schemas, TypeScript types, dataclasses
# Extracted from opentraces-schema, opentraces-cli, and viewer

schema_package:
  name: opentraces-schema
  source: packages/opentraces-schema/src/opentraces_schema/
  framework: pydantic-v2
  schema_version_constant: SCHEMA_VERSION  # from version.py
  exports:  # __all__ from __init__.py
    - Agent
    - Attribution
    - AttributionConversation
    - AttributionFile
    - AttributionRange
    - Environment
    - Metrics
    - Observation
    - Outcome
    - SCHEMA_VERSION
    - SecurityMetadata
    - Snippet
    - Step
    - Task
    - TokenUsage
    - ToolCall
    - TraceRecord
    - VCS

pydantic_models:
  - name: Task
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "Structured task metadata for filtering and grouping"
    fields:
      - name: description
        type: "str | None"
        default: null
      - name: source
        type: "str | None"
        default: null
        description: "user_prompt, cli_arg, skill, etc."
      - name: repository
        type: "str | None"
        default: null
        description: "owner/repo format"
      - name: base_commit
        type: "str | None"
        default: null

  - name: Agent
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "Agent identity following provider/model convention"
    fields:
      - name: name
        type: str
        required: true
        description: "Agent identifier: claude-code, cursor, codex, etc."
      - name: version
        type: "str | None"
        default: null
      - name: model
        type: "str | None"
        default: null
        description: "provider/model-name, e.g. anthropic/claude-sonnet-4-20250514"

  - name: VCS
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "Version control metadata"
    fields:
      - name: type
        type: "Literal['git', 'none']"
        default: "none"
      - name: base_commit
        type: "str | None"
        default: null
      - name: branch
        type: "str | None"
        default: null
      - name: diff
        type: "str | None"
        default: null

  - name: Environment
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "Runtime environment metadata"
    fields:
      - name: os
        type: "str | None"
        default: null
      - name: shell
        type: "str | None"
        default: null
      - name: vcs
        type: VCS
        default_factory: VCS
      - name: language_ecosystem
        type: "list[str]"
        default_factory: list

  - name: ToolCall
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "A single tool invocation within a step"
    fields:
      - name: tool_call_id
        type: str
        required: true
      - name: tool_name
        type: str
        required: true
      - name: input
        type: "dict[str, Any]"
        default_factory: dict
      - name: duration_ms
        type: "int | None"
        default: null

  - name: Observation
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "Result of a tool call, linked via source_call_id"
    fields:
      - name: source_call_id
        type: str
        required: true
      - name: content
        type: "str | None"
        default: null
      - name: output_summary
        type: "str | None"
        default: null
      - name: error
        type: "str | None"
        default: null

  - name: Snippet
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "Code block extracted from tool results or agent responses"
    fields:
      - name: file_path
        type: str
        required: true
      - name: start_line
        type: "int | None"
        default: null
      - name: end_line
        type: "int | None"
        default: null
      - name: language
        type: "str | None"
        default: null
      - name: text
        type: "str | None"
        default: null
      - name: source_step
        type: "int | None"
        default: null

  - name: TokenUsage
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "Per-step token usage breakdown"
    fields:
      - name: input_tokens
        type: int
        default: 0
      - name: output_tokens
        type: int
        default: 0
      - name: cache_read_tokens
        type: int
        default: 0
      - name: cache_write_tokens
        type: int
        default: 0
      - name: prefix_reuse_tokens
        type: int
        default: 0

  - name: Step
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "A single LLM API call (TAO loop cycle)"
    fields:
      - name: step_index
        type: int
        required: true
      - name: role
        type: "Literal['system', 'user', 'agent']"
        required: true
      - name: content
        type: "str | None"
        default: null
      - name: reasoning_content
        type: "str | None"
        default: null
        description: "Chain-of-thought / extended thinking"
      - name: model
        type: "str | None"
        default: null
      - name: system_prompt_hash
        type: "str | None"
        default: null
      - name: agent_role
        type: "str | None"
        default: null
        description: "main, explore, plan, etc."
      - name: parent_step
        type: "int | None"
        default: null
      - name: call_type
        type: "Literal['main', 'subagent', 'warmup'] | None"
        default: null
      - name: subagent_trajectory_ref
        type: "str | None"
        default: null
      - name: tools_available
        type: "list[str]"
        default_factory: list
      - name: tool_calls
        type: "list[ToolCall]"
        default_factory: list
      - name: observations
        type: "list[Observation]"
        default_factory: list
      - name: snippets
        type: "list[Snippet]"
        default_factory: list
      - name: token_usage
        type: TokenUsage
        default_factory: TokenUsage
      - name: timestamp
        type: "str | None"
        default: null

  - name: Outcome
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "Session outcome signals for RL/reward modeling"
    fields:
      - name: success
        type: "bool | None"
        default: null
      - name: signal_source
        type: str
        default: "deterministic"
      - name: signal_confidence
        type: "Literal['derived', 'inferred', 'annotated']"
        default: "derived"
      - name: description
        type: "str | None"
        default: null
      - name: patch
        type: "str | None"
        default: null
      - name: committed
        type: bool
        default: false
      - name: commit_sha
        type: "str | None"
        default: null

  - name: AttributionRange
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    fields:
      - name: start_line
        type: int
      - name: end_line
        type: int
      - name: content_hash
        type: "str | None"
        description: "murmur3 hash for cross-refactor tracking"
      - name: confidence
        type: "Literal['high', 'medium', 'low'] | None"

  - name: AttributionConversation
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    fields:
      - name: contributor
        type: "dict[str, str]"
      - name: url
        type: "str | None"
        description: "opentraces://trace_id/step_N"
      - name: ranges
        type: "list[AttributionRange]"

  - name: AttributionFile
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    fields:
      - name: path
        type: str
      - name: conversations
        type: "list[AttributionConversation]"

  - name: Attribution
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "Embedded Agent Trace-compatible attribution block (experimental)"
    fields:
      - name: version
        type: str
        default: SCHEMA_VERSION
      - name: experimental
        type: bool
        default: true
      - name: files
        type: "list[AttributionFile]"

  - name: Metrics
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "Aggregated session-level metrics"
    fields:
      - name: total_steps
        type: int
        default: 0
      - name: total_input_tokens
        type: int
        default: 0
      - name: total_output_tokens
        type: int
        default: 0
      - name: total_duration_s
        type: "float | None"
        default: null
      - name: cache_hit_rate
        type: "float | None"
        default: null
        constraints: "ge=0.0, le=1.0"
      - name: estimated_cost_usd
        type: "float | None"
        default: null

  - name: SecurityMetadata
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "Records security tier and what was flagged/redacted"
    fields:
      - name: tier
        type: "Literal[1, 2, 3]"
        default: 3
      - name: flags_reviewed
        type: int
        default: 0
      - name: redactions_applied
        type: int
        default: 0
      - name: classifier_version
        type: "str | None"
        default: null

  - name: TraceRecord
    source: packages/opentraces-schema/src/opentraces_schema/models.py
    description: "Top-level model for one complete agent session trace (one JSONL line)"
    fields:
      - name: schema_version
        type: str
        default: SCHEMA_VERSION
      - name: trace_id
        type: str
        required: true
      - name: session_id
        type: str
        required: true
      - name: content_hash
        type: "str | None"
        default: null
      - name: timestamp_start
        type: "str | None"
        default: null
      - name: timestamp_end
        type: "str | None"
        default: null
      - name: task
        type: Task
      - name: agent
        type: Agent
        required: true
      - name: environment
        type: Environment
      - name: system_prompts
        type: "dict[str, str]"
        description: "Deduplicated system prompts keyed by hash"
      - name: tool_definitions
        type: "list[dict[str, Any]]"
      - name: steps
        type: "list[Step]"
      - name: outcome
        type: Outcome
      - name: dependencies
        type: "list[str]"
      - name: metrics
        type: Metrics
      - name: security
        type: SecurityMetadata
      - name: attribution
        type: "Attribution | None"
        default: null
      - name: metadata
        type: "dict[str, Any]"
    methods:
      - name: compute_content_hash
        returns: str
        description: "SHA-256 hash excluding content_hash and trace_id"
      - name: to_jsonl_line
        returns: str
        description: "Serialize to a single JSONL line with computed content_hash"

config_models:
  - name: ProjectConfig
    source: src/opentraces/config.py
    description: "Per-project configuration override"
    fields:
      - name: tier
        type: int
        default: 3
      - name: excluded
        type: bool
        default: false
      - name: mode
        type: str
        default: "review"
      - name: remote
        type: "str | None"
        default: null
      - name: visibility
        type: str
        default: "private"

  - name: Config
    source: src/opentraces/config.py
    description: "Root configuration model (~/.opentraces/config.json)"
    fields:
      - name: config_version
        type: str
        default: CONFIG_VERSION
      - name: hf_token
        type: "str | None"
        default: null
      - name: default_tier
        type: int
        default: 3
        constraints: "ge=1, le=3"
      - name: projects
        type: "dict[str, ProjectConfig]"
      - name: excluded_projects
        type: "list[str]"
      - name: custom_redact_strings
        type: "list[str]"
      - name: default_mode
        type: str
        default: "review"
      - name: pricing_file
        type: "str | None"
        default: null
      - name: projects_path
        type: "str | None"
        default: null
      - name: classifier_sensitivity
        type: str
        default: "medium"
        constraints: "pattern=^(low|medium|high)$"
      - name: dataset_visibility
        type: str
        default: "private"
        constraints: "pattern=^(public|private)$"

state_models:
  - name: TraceStatus
    source: src/opentraces/state.py
    type: enum
    values:
      - DISCOVERED
      - PARSED
      - STAGED
      - REVIEWING
      - COMMITTED
      - APPROVED
      - UPLOADING
      - UPLOADED
      - REJECTED
      - FAILED
    lifecycle: "discovered -> parsed -> staged -> reviewing -> approved -> committed -> uploading -> uploaded"

  - name: CommitGroup
    source: src/opentraces/state.py
    type: dataclass
    fields:
      - name: commit_id
        type: str
      - name: trace_ids
        type: "list[str]"
      - name: message
        type: str
      - name: created_at
        type: str

  - name: ProcessedFile
    source: src/opentraces/state.py
    type: dataclass
    fields:
      - name: file_path
        type: str
      - name: inode
        type: int
      - name: mtime
        type: float
      - name: last_byte_offset
        type: int

  - name: TraceStagingEntry
    source: src/opentraces/state.py
    type: dataclass
    fields:
      - name: trace_id
        type: str
      - name: session_id
        type: str
      - name: status
        type: TraceStatus
      - name: file_path
        type: "str | None"
      - name: error
        type: "str | None"
      - name: uploaded_at
        type: "str | None"
      - name: created_at
        type: float

  - name: StateManager
    source: src/opentraces/state.py
    type: class
    description: "Manages persistent state for incremental processing and upload tracking"
    constructor: "(state_path: Path | None = None)"
    methods:
      - name: save
      - name: get_processed_file
        params: "(file_path: str)"
        returns: "ProcessedFile | None"
      - name: mark_file_processed
        params: "(pf: ProcessedFile)"
      - name: should_reprocess
        params: "(file_path: str)"
        returns: "tuple[bool, int]"
      - name: get_trace
        params: "(trace_id: str)"
        returns: "TraceStagingEntry | None"
      - name: set_trace_status
        params: "(trace_id: str, status: TraceStatus, **kwargs)"
      - name: get_traces_by_status
        params: "(status: TraceStatus)"
        returns: "list[TraceStagingEntry]"
      - name: get_pending_upload_traces
        returns: "list[TraceStagingEntry]"
      - name: create_commit_group
        params: "(trace_ids: list[str], message: str)"
        returns: str
      - name: get_committed_traces
        returns: "dict[str, dict]"
      - name: get_commit_group
        params: "(commit_id: str)"
        returns: "CommitGroup | None"
      - name: get_commit_groups
        returns: "list[CommitGroup]"

  - name: StagingLock
    source: src/opentraces/state.py
    type: class
    description: "File lock on staging directory to prevent concurrent uploads"
    methods:
      - name: acquire
        returns: bool
      - name: release
    context_manager: true

security_models:
  - name: SecretMatch
    source: src/opentraces/security/secrets.py
    type: dataclass
    fields:
      - name: pattern_name
        type: str
      - name: matched_text
        type: str
      - name: start
        type: int
      - name: end
        type: int
      - name: severity
        type: "Literal['critical', 'high', 'medium']"

  - name: ScanResult
    source: src/opentraces/security/scanner.py
    type: dataclass
    fields:
      - name: matches
        type: "list[SecretMatch]"
      - name: redaction_count
        type: int
      - name: field_counts
        type: "dict[str, int]"
    methods:
      - name: merge
        params: "(other: ScanResult)"

  - name: FieldType
    source: src/opentraces/security/scanner.py
    type: enum
    values: [TOOL_INPUT, TOOL_RESULT, REASONING, GENERAL]

  - name: ClassifierFlag
    source: src/opentraces/security/classifier.py
    type: dataclass
    fields:
      - name: pattern_name
        type: str
      - name: matched_text
        type: str
      - name: reason
        type: str
      - name: severity
        type: "Literal['critical', 'high', 'medium', 'low']"

  - name: ClassifierResult
    source: src/opentraces/security/classifier.py
    type: dataclass
    fields:
      - name: flags
        type: "list[ClassifierFlag]"
      - name: risk_score
        type: float

quality_models:
  - name: CheckResult
    source: src/opentraces/quality/types.py
    type: dataclass
    fields:
      - name: passed
        type: bool
      - name: score
        type: float
      - name: evidence
        type: str
      - name: note
        type: str

  - name: CheckDef
    source: src/opentraces/quality/types.py
    type: dataclass
    fields:
      - name: name
        type: str
      - name: category
        type: str
      - name: weight
        type: float
      - name: check
        type: "Callable[[TraceRecord, dict], CheckResult]"

  - name: PersonaDef
    source: src/opentraces/quality/types.py
    type: dataclass
    fields:
      - name: name
        type: str
      - name: description
        type: str
      - name: checks
        type: "list[CheckDef]"

  - name: RubricItem
    source: src/opentraces/quality/types.py
    type: dataclass
    fields:
      - name: name
        type: str
      - name: category
        type: str
      - name: weight
        type: float
      - name: passed
        type: bool
      - name: score
        type: float
      - name: evidence
        type: str
      - name: note
        type: str

  - name: RubricReport
    source: src/opentraces/quality/types.py
    type: dataclass
    computed_properties: [total_score, pass_rate, category_scores]
    fields:
      - name: trace_id
        type: str
      - name: session_id
        type: str
      - name: task_description
        type: str
      - name: items
        type: "list[RubricItem]"

  - name: PersonaScore
    source: src/opentraces/quality/engine.py
    type: dataclass
    fields:
      - name: persona_name
        type: str
      - name: total_score
        type: float
      - name: pass_rate
        type: float
      - name: items
        type: "list[RubricItem]"
      - name: category_scores
        type: "dict[str, float]"
      - name: deterministic_score
        type: "float | None"
      - name: judge_score
        type: "float | None"
      - name: judge_result
        type: "JudgeResult | None"

  - name: TraceAssessment
    source: src/opentraces/quality/engine.py
    type: dataclass
    fields:
      - name: trace_id
        type: str
      - name: session_id
        type: str
      - name: task_description
        type: str
      - name: persona_scores
        type: "dict[str, PersonaScore]"
      - name: preservation
        type: "PreservationReport | None"
      - name: overall_utility
        type: float

  - name: BatchAssessment
    source: src/opentraces/quality/engine.py
    type: dataclass
    fields:
      - name: assessments
        type: "list[TraceAssessment]"
      - name: schema_audit
        type: "SchemaAuditReport | None"
      - name: persona_averages
        type: "dict[str, float]"
      - name: preservation_average
        type: "float | None"

  - name: JudgeDimension
    source: src/opentraces/quality/judge.py
    type: dataclass
    fields:
      - name: name
        type: str
      - name: score
        type: float
        description: "1-5 scale"
      - name: rationale
        type: str

  - name: JudgeResult
    source: src/opentraces/quality/judge.py
    type: dataclass
    fields:
      - name: persona_name
        type: str
      - name: dimensions
        type: "list[JudgeDimension]"
      - name: overall_score
        type: float
        description: "0-100 (weighted, scaled from 1-5)"
      - name: model_used
        type: str
      - name: skipped
        type: bool
      - name: skip_reason
        type: str

  - name: PersonaBrief
    source: src/opentraces/quality/judge.py
    type: dataclass
    fields:
      - name: persona
        type: str
      - name: description
        type: str
      - name: dimensions
        type: "list[BriefDimension]"
      - name: prose
        type: str

upload_models:
  - name: UploadResult
    source: src/opentraces/upload/hf_hub.py
    type: dataclass
    fields:
      - name: shard_name
        type: str
      - name: trace_count
        type: int
      - name: repo_url
        type: str
      - name: success
        type: bool
      - name: error
        type: "str | None"

  - name: HFUploader
    source: src/opentraces/upload/hf_hub.py
    type: class
    constructor: "(token: str, repo_id: str)"
    methods:
      - name: ensure_repo_exists
        params: "(private: bool = False)"
        returns: str
      - name: upload_traces
        params: "(traces: list[TraceRecord])"
        returns: UploadResult
      - name: list_opentraces_datasets
        params: "(username: str)"
        returns: "list[dict]"
      - name: publish_dataset
        params: "(repo_id: str)"
      - name: set_gated
        params: "(repo_id: str)"

typescript_types:
  source: viewer/src/types/trace.ts
  description: "TypeScript interfaces mirroring opentraces-schema Pydantic models"
  schema_mirrors:
    - Task
    - Agent
    - VCS
    - Environment
    - ToolCall
    - Observation
    - Snippet
    - TokenUsage
    - Step
    - Outcome
    - AttributionRange
    - AttributionConversation
    - AttributionFile
    - Attribution
    - Metrics
    - SecurityMetadata
    - TraceRecord
  ui_types:
    - name: SecurityFlag
      fields: [step_index, field, reason]
    - name: TreeNode
      fields: [id, type, label, depth, children, step?, toolCall?, observation?, hasFlag, hasRedaction]
      type_literal: "type: 'user' | 'agent' | 'system' | 'tool' | 'subagent'"
    - name: SessionStage
      definition: "'unstaged' | 'staged' | 'committed' | 'pushed' | 'rejected'"
    - name: SessionListItem
      fields: [trace_id, task_description, agent_name, model, step_count, flag_count, stage, timestamp]
    - name: RedactionPreview
      fields: [trace_id, tier, steps, signal_kept]

file_paths:
  config_dir: "~/.opentraces/"
  config_file: "~/.opentraces/config.json"
  credentials_file: "~/.opentraces/credentials"
  global_state: "~/.opentraces/state.json"
  global_staging: "~/.opentraces/staging/"
  global_uploaded: "~/.opentraces/uploaded/"
  project_config: ".opentraces/config.json"
  project_staging: ".opentraces/staging/"
  project_state: ".opentraces/state.json"
