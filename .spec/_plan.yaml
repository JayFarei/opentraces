exemplars:
  - pattern: "Quality persona rubric modules"
    directory: src/opentraces/quality/personas
    total_files: 4
    selected: [training.py, domain.py, analytics.py]
    pattern_description: >
      Each persona module defines a set of check functions (_tN_check_name) that evaluate
      a TraceRecord against persona-specific criteria. Functions return CheckResult with
      passed/score/evidence. Module exports a PersonaDef with name, brief description,
      list of CheckDefs (each wrapping a check function with weight and description).
      Personas: training (SFT pipeline fitness), domain (domain expert), rl (RL/reward modeling),
      analytics (usage analytics).

  - pattern: "Viewer React components"
    directory: viewer/src/components
    total_files: 43
    selected: [trace/TracePanel.tsx, detail/StepDetail.tsx, sessions/SessionPanel.tsx]
    pattern_description: >
      React functional components using TypeScript, Tailwind CSS classes, motion (framer-motion)
      for animations, and @tanstack/react-virtual for virtualized lists. Components follow
      PascalCase naming, grouped by concern (trace/, detail/, layout/, sessions/, review/, icons/).
      State management via React contexts (SelectionContext, ViewPreferencesContext).

  - pattern: "Marketing site page components"
    directory: mktg/site/src/components
    total_files: 18
    selected: [Hero.tsx, SecurityTiers.tsx, SchemaExplorer.tsx]
    pattern_description: >
      Next.js 16 React server/client components with Tailwind v4 styling. Marketing-focused
      with interactive elements (Terminal demo, schema explorer, infrastructure diagram).
      Dark theme with security-oriented visual language.

  - pattern: "Security scanner modules"
    directory: src/opentraces/security
    total_files: 5
    selected: [secrets.py, scanner.py, classifier.py]
    pattern_description: >
      secrets.py defines regex patterns for 19+ secret types with allowlists. scanner.py
      orchestrates multi-pass scanning. classifier.py applies context-aware classification
      (different rules per field type). anonymizer.py handles username hashing and path
      stripping. redactor.py provides a logging filter to prevent credential leaks.

  - pattern: "Enrichment pipeline modules"
    directory: src/opentraces/enrichment
    total_files: 6
    selected: [git_signals.py, attribution.py, metrics.py]
    pattern_description: >
      Each module enriches a TraceRecord with one signal type. git_signals.py extracts
      VCS metadata via subprocess git calls. attribution.py builds Agent Trace-compatible
      attribution blocks from diffs. metrics.py computes aggregated session metrics
      (tokens, cost, cache hit rate). dependencies.py reads manifest files. snippets.py
      extracts code blocks.

