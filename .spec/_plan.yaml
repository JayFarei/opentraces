critical_files:
  - path: packages/opentraces-schema/src/opentraces_schema/models.py
    reason: "Central schema definition consumed by every other module, defines the TraceRecord JSONL format"

  - path: src/opentraces/parsers/base.py
    reason: "Defines SessionParser and FormatImporter protocols, the adapter contract for all parsers"

  - path: src/opentraces/parsers/claude_code.py
    reason: "Primary parser (761 LOC), the core data ingestion path for the entire pipeline"

  - path: src/opentraces/cli.py
    reason: "CLI entry point (1683 LOC), defines all user-facing commands and the pipeline orchestration"

  - path: src/opentraces/security/secrets.py
    reason: "Secret detection patterns (441 LOC), critical for the security guarantee of zero credential leaks"

  - path: src/opentraces/quality/engine.py
    reason: "Quality evaluation engine (862 LOC), orchestrates multi-persona trace quality assessment"

  - path: src/opentraces/upload/hf_hub.py
    reason: "HuggingFace Hub upload integration, the final output stage of the pipeline"

  - path: src/opentraces/config.py
    reason: "Config management, defines security tier defaults and per-project overrides"

  - path: viewer/src/App.tsx
    reason: "React viewer entry point, main application shell for the trace visualization UI"
