# Dependency graph for opentraces monorepo
# Generated by Dependency Cartographer agent

workspace_graph:
  packages:
    - name: opentraces-schema
      path: packages/opentraces-schema
      manifest: packages/opentraces-schema/pyproject.toml
      depends_on: []                      # leaf package, no internal deps
      depended_on_by:
        - opentraces-cli

    - name: opentraces-cli
      path: src/opentraces
      manifest: pyproject.toml
      depends_on:
        - opentraces-schema               # TraceRecord, Step, models used everywhere
      depended_on_by: []

    - name: opentraces-ui
      path: packages/opentraces-ui
      manifest: packages/opentraces-ui/package.json
      depends_on: []                      # CSS-only token package, no code deps
      depended_on_by:
        - viewer

    - name: viewer
      path: web/viewer
      manifest: web/viewer/package.json
      depends_on:
        - opentraces-ui                   # design tokens via CSS import
      depended_on_by: []
      notes: "Served by Flask web review backend at runtime (viewer is the frontend for clients/web/app.py)"

    - name: mktg-site
      path: web/site
      manifest: web/site/package.json
      depends_on: []                      # standalone marketing site
      depended_on_by: []

    - name: tests
      path: tests
      manifest: pyproject.toml            # shares root pyproject.toml
      depends_on:
        - opentraces-schema
        - opentraces-cli
      depended_on_by: []

  edges:
    # Python workspace edges
    - from: opentraces-cli
      to: opentraces-schema
      type: pip-dependency
      version: ">=0.1.0"
      notes: "Declared in pyproject.toml dependencies, used by every sub-module (parsers, security, enrichment, quality, upload, exporters)"

    # JS workspace edges
    - from: viewer
      to: opentraces-ui
      type: file-dependency
      version: "file:../packages/opentraces-ui"
      notes: "CSS design tokens imported in viewer/src/globals.css"

    # Runtime integration edge (not a package dependency)
    - from: viewer
      to: opentraces-cli
      type: runtime
      notes: "Viewer fetches trace data from Flask API served by opentraces review --web"

external_dependencies:
  opentraces-schema:
    runtime:
      - name: pydantic
        version: ">=2.0"
        role: validation
        description: "Pydantic v2 BaseModel for all trace schema models (TraceRecord, Step, ToolCall, etc.)"

    build:
      - name: hatchling
        role: build
        description: "PEP 517 build backend for the schema package"

  opentraces-cli:
    runtime:
      - name: opentraces-schema
        version: ">=0.1.0"
        role: schema
        description: "Internal schema package providing Pydantic models for the JSONL trace format"

      - name: click
        version: ">=8.0"
        role: CLI
        description: "Command-line framework for all user-facing CLI commands (parse, review, upload, etc.)"

      - name: huggingface_hub
        version: ">=0.20.0"
        role: integration
        description: "HuggingFace Hub API client for dataset upload, OAuth login, and dataset card creation"

      - name: pyclack-cli
        version: ">=0.4.0"
        role: CLI
        description: "Pretty CLI prompts and spinners for interactive user flows"

    optional:
      - name: flask
        version: ">=3.0"
        extra: web
        role: framework
        description: "Web review server providing REST API for the viewer React frontend"

      - name: textual
        version: ">=0.50.0"
        extra: tui
        role: framework
        description: "Terminal UI framework for the rich TUI-based trace review interface (lazytraces command)"

    dev:
      - name: pytest
        version: ">=8.0"
        role: testing
        description: "Test runner for the full test suite"

      - name: pytest-cov
        version: "*"
        role: testing
        description: "Coverage reporting for pytest"

      - name: ruff
        version: "*"
        role: linting
        description: "Fast Python linter and formatter"

    build:
      - name: hatchling
        role: build
        description: "PEP 517 build backend for the CLI package"

    implicit:
      - name: requests
        role: integration
        description: "Used for OAuth device code flow during HF login (lazy import, not in pyproject.toml)"

  viewer:
    runtime:
      - name: react
        version: "^19.2.4"
        role: framework
        description: "UI framework for the trace review viewer"

      - name: react-dom
        version: "^19.2.4"
        role: framework
        description: "React DOM renderer"

      - name: "@tanstack/react-query"
        version: "^5.95.2"
        role: data-fetching
        description: "Server state management for fetching sessions and trace data from Flask API"

      - name: "@tanstack/react-virtual"
        version: "^3.13.23"
        role: performance
        description: "Virtualized list rendering for large trace trees"

      - name: d3-scale
        version: "^4.0.2"
        role: visualization
        description: "Scale functions for the timeline strip visualization"

      - name: motion
        version: "^12.38.0"
        role: animation
        description: "Framer Motion animations for step nodes, icons, and UI transitions"

      - name: react-resizable-panels
        version: "^4.8.0"
        role: layout
        description: "Resizable panel layout for the three-panel app shell (sessions, trace, detail)"

      - name: "@opentraces/ui"
        version: "file:../packages/opentraces-ui"
        role: styling
        description: "Shared CSS design tokens (colors, spacing, typography)"

    dev:
      - name: vite
        version: "^8.0.3"
        role: build
        description: "Dev server and bundler"

      - name: typescript
        version: "^6.0.2"
        role: language
        description: "TypeScript compiler"

      - name: tailwindcss
        version: "^4.2.2"
        role: styling
        description: "Utility-first CSS framework via PostCSS plugin"

      - name: "@tailwindcss/postcss"
        version: "^4.2.2"
        role: styling
        description: "Tailwind v4 PostCSS integration"

      - name: vitest
        version: "^4.1.2"
        role: testing
        description: "Vite-native test runner"

      - name: "@testing-library/react"
        version: "^16.3.2"
        role: testing
        description: "React component testing utilities"

      - name: "@vitejs/plugin-react"
        version: "^6.0.1"
        role: build
        description: "Vite plugin for React JSX transform and fast refresh"

      - name: jsdom
        version: "^29.0.1"
        role: testing
        description: "DOM environment for Vitest tests"

  mktg-site:
    runtime:
      - name: next
        version: "16.2.1"
        role: framework
        description: "Next.js 16 React framework for the marketing/docs site"

      - name: react
        version: "19.2.4"
        role: framework
        description: "UI framework"

      - name: react-dom
        version: "19.2.4"
        role: framework
        description: "React DOM renderer"

      - name: react-markdown
        version: "^10.1.0"
        role: content
