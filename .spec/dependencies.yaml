import_graph:
  opentraces-schema:
    # Leaf package, minimal internal structure
    "opentraces_schema/__init__.py":
      imports: [models, version]
    "opentraces_schema/models.py":
      imports: [version]
      external: [pydantic]

  opentraces-cli:
    # CLI entry point (lazy imports throughout)
    "cli.py":
      imports:
        - config
        - parsers.claude_code
        - security.scanner
        - security.anonymizer
        - security.classifier
        - enrichment.git_signals
        - enrichment.attribution
        - enrichment.dependencies
        - enrichment.metrics
        - state
        - upload.hf_hub
        - upload.dataset_card
        - review.web.app
        - review.cli_review
        - quality.engine
      external: [click, huggingface_hub, pyclack_cli]
      notes: "All sub-module imports are lazy (inside command functions) to minimize startup time"

    # Parsers sub-module
    "parsers/base.py":
      imports: []
      external: [opentraces_schema]
    "parsers/claude_code.py":
      imports: [parsers.quality]
      external: [opentraces_schema]
    "parsers/quality.py":
      imports: []
      external: [opentraces_schema]

    # Security sub-module
    "security/__init__.py":
      imports: [security.anonymizer, security.classifier, security.redactor, security.scanner, security.secrets]
    "security/scanner.py":
      imports: [security.secrets]
      external: [opentraces_schema]
    "security/classifier.py":
      imports: []
      external: [opentraces_schema]
    "security/redactor.py":
      imports: [security.secrets]
    "security/anonymizer.py":
      imports: []
    "security/secrets.py":
      imports: []

    # Enrichment sub-module
    "enrichment/__init__.py":
      imports: [enrichment.attribution, enrichment.dependencies, enrichment.git_signals, enrichment.metrics, enrichment.snippets]
    "enrichment/git_signals.py":
      imports: []
      external: [opentraces_schema]
    "enrichment/attribution.py":
      imports: [enrichment.snippets]
      external: [opentraces_schema]
    "enrichment/dependencies.py":
      imports: [enrichment.known_packages]
      external: [opentraces_schema]
    "enrichment/metrics.py":
      imports: []
      external: [opentraces_schema]
    "enrichment/snippets.py":
      imports: []

    # Quality sub-module
    "quality/__init__.py":
      imports: [quality.types, quality.conformance, quality.engine, quality.schema_audit, quality.gates]
    "quality/engine.py":
      imports: [quality.types, quality.schema_audit]
      external: [opentraces_schema]
    "quality/conformance.py":
      imports: [quality.types]
      external: [opentraces_schema]
    "quality/judge.py":
      imports: []
      external: [opentraces_schema]
    "quality/schema_audit.py":
      imports: []
      external: [opentraces_schema]
    "quality/preservation.py":
      imports: [quality.raw_reader]
      external: [opentraces_schema]
    "quality/personas/__init__.py":
      imports: [quality.personas.analytics, quality.personas.domain, quality.personas.rl, quality.personas.training]
    "quality/personas/training.py":
      imports: [quality.types]
      external: [opentraces_schema]
    "quality/personas/domain.py":
      imports: [quality.types]
      external: [opentraces_schema]
    "quality/personas/rl.py":
      imports: [quality.types]
      external: [opentraces_schema]
    "quality/personas/analytics.py":
      imports: [quality.types]
      external: [opentraces_schema]

    # Upload sub-module
    "upload/hf_hub.py":
      imports: []
      external: [opentraces_schema, huggingface_hub]
    "upload/dataset_card.py":
      imports: []
      external: [opentraces_schema]

    # Review sub-module
    "review/web/app.py":
      imports: [config, state]
      external: [flask]
    "review/cli_review.py":
      imports: [config, state]
    "review/tui_review.py":
      imports: [config, state]
      external: [textual]

    # Exporters sub-module
    "exporters/base.py":
      imports: []
      external: [opentraces_schema]
    "exporters/atif.py":
      imports: [exporters.base]
      external: [opentraces_schema]

    # Core modules
    "config.py":
      imports: []
    "state.py":
      imports: [config]

  viewer:
    # Entry point
    "src/main.tsx":
      imports: [App]
      external: [react, react-dom, "@tanstack/react-query"]

    "src/App.tsx":
      imports:
        - contexts/SelectionContext
        - contexts/ViewPreferencesContext
        - components/layout/Header
        - components/layout/AppLayout
        - components/layout/ReviewBar
        - components/layout/KeyboardHelp
        - components/Onboarding
        - hooks/useSessionList
        - hooks/useKeyboardNav

    # Hooks layer
    "src/hooks/useTraceData.ts":
      imports: [lib/api, lib/tree, types/trace]
      external: ["@tanstack/react-query"]
    "src/hooks/useSessionList.ts":
      imports: [lib/api, types/trace]
      external: ["@tanstack/react-query"]
    "src/hooks/useReviewActions.ts":
      imports: []
      external: ["@tanstack/react-query"]
    "src/hooks/useKeyboardNav.ts":
      imports: [contexts/SelectionContext, hooks/useSessionList, hooks/useTraceData, hooks/useReviewActions]

    # Components - trace visualization
    "src/components/trace/TracePanel.tsx":
      imports: [contexts/SelectionContext, hooks/useTraceData, components/trace/TraceTree, components/trace/ContextFlow]
    "src/components/trace/TraceTree.tsx":
      imports: [lib/tree, components/trace/StepNode, types/trace]
      external: ["@tanstack/react-virtual"]
    "src/components/trace/TimelineStrip.tsx":
      imports: [contexts/SelectionContext, hooks/useTraceData, lib/tree, types/trace]
      external: [d3-scale]
    "src/components/trace/StepNode.tsx":
      imports: [contexts/SelectionContext, lib/format, types/trace, components/icons/*]

    # Lib layer
    "src/lib/tree.ts":
      imports: [types/trace, lib/format]
    "src/lib/api.ts":
      imports: [types/trace]

data_flow_paths:
  - name: "Parse pipeline (main data ingestion)"
    description: "CLI parse command ingests agent session files into enriched, security-scanned JSONL traces"
    steps:
      1: "cli.py parse command receives session directory path"
      2: "config.load_project_config() loads project settings and security tier"
      3: "parsers.claude_code.ClaudeCodeParser reads raw JSONL session files"
      4: "Parser constructs TraceRecord with Steps from raw session data"
      5: "security.scanner.two_pass_scan() runs secret detection on all text fields"
      6: "security.anonymizer.anonymize_paths() strips usernames from file paths"
      7: "security.classifier.classify_trace_record() assigns security classification"
      8: "enrichment.git_signals.extract_git_signals() adds VCS metadata via subprocess git"
      9: "enrichment.attribution.build_attribution() builds Agent Trace attribution blocks"
      10: "enrichment.dependencies.extract_dependencies() extracts manifest dependencies"
      11: "enrichment.metrics.compute_metrics() computes token/cost/cache metrics"
      12: "state.StateManager persists processed file status and writes JSONL to staging directory"

  - name: "Web review flow"
    description: "Flask backend serves trace data to React viewer for human review"
    steps:
      1: "cli.py review --web starts Flask server (review.web.app.create_app)"
      2: "Flask app loads JSONL traces from staging directory"
      3: "REST API serves session list and individual trace data as JSON"
      4: "viewer React app fetches sessions via useSessionList -> lib/api.fetchSessions"
      5: "User selects session, useTraceData fetches trace, lib/tree.buildTree builds tree"
      6: "TracePanel/TraceTree/StepNode render the trace visualization"
      7: "useReviewActions sends approve/reject/redact decisions back to Flask API"
      8: "Flask app persists decisions via state.StateManager"

  - name: "Upload to HuggingFace Hub"
    description: "Approved traces are uploaded as sharded JSONL dataset to HF Hub"
    steps:
      1: "cli.py upload command loads project config and credentials"
      2: "state.StateManager reads staging directory for approved traces"
      3: "upload.dataset_card.generate_dataset_card() creates README.md with schema version"
      4: "upload.hf_hub.HFUploader shards JSONL and uploads via huggingface_hub API"
      5: "State is updated to mark traces as uploaded"

  - name: "Quality assessment"
    description: "Multi-persona quality engine evaluates trace fitness for downstream use"
    steps:
      1: "cli.py quality command loads staged traces"
      2: "quality.engine.assess_batch() loads all registered personas"
      3: "quality.conformance.score_trace() runs schema conformance checks"
      4: "quality.personas.*.PERSONA_DEF check functions evaluate per-persona criteria"
      5: "quality.engine computes weighted rubric scores and generates RubricReport"
      6: "quality.schema_audit.audit_schema_completeness() checks field population rates"
      7: "Report is emitted as structured JSON for agent consumption"

  - name: "Config management"
    description: "Hierarchical config with global credentials and per-project settings"
    steps:
      1: "cli.py init creates project config in ~/.opentraces/projects/<name>/"
      2: "config.py manages ~/.opentraces/config.json (global) and project-level config"
      3: "config.py stores HF token in ~/.opentraces/credentials.json (separate from config)"
      4: "Security tier (1-3) set at init time controls scanning strictness and review requirements"
      5: "state.py reads config paths for staging directory and state file locations"
