# PR test lanes.
#
# Fast pre-merge is the unit-ish lane: no integration/e2e, otbox, perf, live
# REPL, user-smoke, or wall-clock budget assertions. Integration/e2e coverage is
# still on PRs, but sharded by file bucket. Timing-sensitive assertions run
# serially to avoid xdist/runner contention false reds. The `otbox-slice` job
# (thin vertical slice + catalogue lint + assertion-registry + jtbd SSoT drift
# gate) is hard-required through the `unit` aggregator.
name: ci-pr

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-premerge:
    name: fast pre-merge shard ${{ matrix.shard-index }} of ${{ matrix.shard-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1, 2, 3]
        shard-total: [4]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the entry6 labeled-regression suite asserts against
          # the repo's own commits (git show <sha>, burst commit lookups) and
          # a shallow clone fails them all.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/opentraces-schema/pyproject.toml
      - name: Install
        run: |
          python -m pip install -q -e packages/opentraces-schema -e ".[dev]"
      - name: Git identity for test repos
        run: |
          git config --global user.email "otbox-ci@opentraces.local"
          git config --global user.name "otbox-ci"
          git config --global init.defaultBranch main
      - name: Fast pre-merge tests (xdist, file bucket)
        run: |
          make test-premerge-shard \
            SHARD_INDEX=${{ matrix.shard-index }} \
            SHARD_TOTAL=${{ matrix.shard-total }}

  timing-sensitive:
    name: timing-sensitive serial
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/opentraces-schema/pyproject.toml
      - name: Install
        run: |
          python -m pip install -q -e packages/opentraces-schema -e ".[dev]"
      - name: Git identity for test repos
        run: |
          git config --global user.email "otbox-ci@opentraces.local"
          git config --global user.name "otbox-ci"
          git config --global init.defaultBranch main
      - name: Wall-clock budget assertions (serial)
        run: make test-premerge-timing

  integration:
    name: integration/e2e shard ${{ matrix.shard-index }} of ${{ matrix.shard-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1, 2, 3]
        shard-total: [4]
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the entry6 labeled-regression suite asserts against
          # the repo's own commits (git show <sha>, burst commit lookups) and
          # a shallow clone fails them all.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/opentraces-schema/pyproject.toml
      - name: Install
        run: |
          python -m pip install -q -e packages/opentraces-schema -e ".[dev]"
      - name: Git identity for test repos
        run: |
          git config --global user.email "otbox-ci@opentraces.local"
          git config --global user.name "otbox-ci"
          git config --global init.defaultBranch main
      - name: Integration/e2e tests (file bucket)
        # Tracked deselections (clean-CI baseline reds of the broad suite,
        # never run on CI before this lane existed; diagnosis owed on
        # issue #25, deadline 2026-09-08 with the quarantine wave):
        #   - two bucket-remote UATs (remote-bucket query exit 2 /
        #     KeyError 'index' on clean runners)
        #   - trace_trails corpus fixture regen mismatch on CI (suspect
        #     TZ/git-version sensitivity)
        #
        # Also deselected: 6 in-process probes (a9, a10, b1-b4) that hit a
        # pre-existing #139 (capture-side anchor over-attribution /
        # survival-recompute) CI red. Permanently non-portable to a fresh
        # CI checkout (they re-observe local bucket/#139-buggy seeded
        # state), out of the seal-family train's scope. Tracked on #139;
        # not scheduled debt, so no deadline.
        run: |
          make test-integration-shard \
            SHARD_INDEX=${{ matrix.shard-index }} \
            SHARD_TOTAL=${{ matrix.shard-total }}

  unit:
    name: unit
    runs-on: ubuntu-latest
    needs:
      - fast-premerge
      - timing-sensitive
      - otbox-slice
    if: always()
    steps:
      - name: Require fast pre-merge lane
        run: |
          if [ "${{ needs['fast-premerge'].result }}" != "success" ]; then
            echo "fast-premerge result: ${{ needs['fast-premerge'].result }}"
            exit 1
          fi
          if [ "${{ needs['timing-sensitive'].result }}" != "success" ]; then
            echo "timing-sensitive result: ${{ needs['timing-sensitive'].result }}"
            exit 1
          fi
          if [ "${{ needs['otbox-slice'].result }}" != "success" ]; then
            echo "otbox-slice result: ${{ needs['otbox-slice'].result }}"
            exit 1
          fi

  otbox-slice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Hard-required: the `unit` aggregator gates on this job's result (the
    # Phase-0 continue-on-error grace ended once the slice + SSoT gate went green).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            packages/opentraces-schema/pyproject.toml
      - name: Install
        run: |
          python -m pip install -q -e packages/opentraces-schema -e ".[dev]"
      - name: Git identity for test repos
        run: |
          git config --global user.email "otbox-ci@opentraces.local"
          git config --global user.name "otbox-ci"
          git config --global init.defaultBranch main
      - name: Catalogue lint + assertion-registry + SSoT drift gate
        run: |
          python -m pytest tests/otbox/test_catalogue_lint.py \
            tests/otbox/test_journey_assertions.py \
            tests/otbox/test_jtbd_ssot.py -q
      # Agent-contract lint (ADR-0007 L1-L6, epic #129). The mechanical gate
      # that keeps the CLI's agent-facing contract (must-terminate,
      # must-not-prompt, valid JSON, remote uniformity, uniform envelope,
      # cross-sibling self-consistency) from regressing. Explicit named step
      # here mirrors the slicer-conformance precedent; the file also runs for
      # free in fast-premerge via the sharder (idempotent).
      - name: Agent-contract lint gate (L1-L6)
        run: python -m pytest tests/cli/test_agent_contract_lint.py -q
      - name: otbox vertical slice
        run: make otbox-slice
      # Trace Slicer Library (issue #141) conformance gate. SENTINEL journey +
      # its 3 mutation kills. Lives here (not nightly-only) because the nightly
      # lane is an unreliable gate; this is fast (~25s, ~4 box builds) and
      # hermetic (OT_LLM_PROVIDER=none in tests/otbox/env.py keeps the slicer's
      # labeler from shelling out to a host `claude`).
      - name: Slicer conformance gate (journey + 3 mutation kills)
        run: |
          python -m pytest \
            "tests/otbox/test_otbox_slice.py::test_tier0_catalogue_journey[slicer-conformance]" \
            tests/otbox/test_mutation_kills.py \
            -k "slicer or coherent" -q
      # CLI v7 core (epic #129) sentinel journeys. One real-execution journey
      # per v7 surface — setup family L2 no-prompt contract, the status safety
      # gate, the trace map/get/waste dive, and the trail lenses. Explicit
      # node-ids here (not nightly-only) mirror the slicer-conformance
      # precedent: SENTINEL_JOURNEYS membership alone does NOT gate per-PR.
      # Hermetic tier-0 boxes (synthetic fake-harness capture chain), ~35s.
      - name: CLI v7 core sentinel journeys (setup / status / trace / trail)
        run: |
          python -m pytest \
            "tests/otbox/test_otbox_slice.py::test_tier0_catalogue_journey[setup-roundtrip]" \
            "tests/otbox/test_otbox_slice.py::test_tier0_catalogue_journey[status-safety-gate]" \
            "tests/otbox/test_otbox_slice.py::test_tier0_catalogue_journey[trace-map-dive]" \
            "tests/otbox/test_otbox_slice.py::test_tier0_catalogue_journey[trail-lenses]" \
            -q
