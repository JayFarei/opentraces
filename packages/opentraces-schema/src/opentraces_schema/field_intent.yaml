trace_id:
  description: Opentraces-canonical random UUIDv4. Opaque, independent of any
    upstream-agent identifier. Must not encode session_id, agent name, or any
    other capture-layer detail.
  good_example: '0dd1e942-e155-489a-858d-b31c82380c0c'
  failure_modes: []
session_id:
  description: Upstream-agent session identifier (e.g. Claude Code session id).
