name = "file_create_then_delete"
description = """
Agent creates two files in turn 1 — one that persists (keep.md) and
one that's deleted in turn 2 (temp.txt). Single commit covers both.
The ephemeral file never reaches HEAD's tree, so it must not appear
in attribution AT ALL; the persistent file must be cleanly credited
to the trace.

Previously this scenario asserted on README.md with an
`allow_empty = true` commit — which could never match because
empty commits produce no diff-tree entries. Now asserts on the
persistent file, which is the intended semantic.
"""

[[steps]]
type = "reset"

[[steps]]
type = "start_watcher"

[[steps]]
type = "claude"
label = "a"
prompts = [
    "Use the Write tool to create keep.md with the single line: kept",
    "Use the Write tool to create temp.txt with the single line: ephemeral",
    "Now use the Bash tool to run: rm temp.txt",
    "done",
]

[[steps]]
type = "wait"
seconds = 2

[[steps]]
type = "stop_watcher"

[[steps]]
type = "commit"
message = "add keep.md; temp.txt created-and-deleted in-session"

# The persistent file attributes cleanly to trace a.
[[assertions]]
file = "keep.md"
trace = "a"
lines = 1

[[assertions]]
file = "keep.md"
total_lines = 1
