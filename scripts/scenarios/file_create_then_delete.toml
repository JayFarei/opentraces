name = "file_create_then_delete"
description = """
Agent creates a file in turn 1, deletes it in turn 2, single commit. The
file never appears in HEAD's tree. Tests that we don't get phantom
attribution for a file that doesn't exist post-commit.
"""

[[steps]]
type = "reset"

[[steps]]
type = "start_watcher"

[[steps]]
type = "claude"
label = "a"
prompts = [
    "Use the Write tool to create temp.txt with the line: ephemeral",
    "Now use the Bash tool to run: rm temp.txt",
    "done",
]

[[steps]]
type = "wait"
seconds = 2

[[steps]]
type = "stop_watcher"

[[steps]]
type = "commit"
message = "create-then-delete (no-op net)"
allow_empty = true

# temp.txt should not appear in attribution because it doesn't exist at HEAD
# We assert by trying to find a file that wasn't included in HEAD's tree.
# Since the commit is empty (or only contains init artifacts), there's no
# strong assertion to make on temp.txt — just ensure no crash.
[[assertions]]
file = "README.md"
trace = "pre-audit"
lines_min = 1
