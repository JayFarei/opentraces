name = "binary_file_added"
description = """
Agent uses Bash to create a binary file (non-UTF-8 bytes). Exercises
attribution behavior when git's blame would operate on binary content.
This is a realistic case — agents often commit small binary artifacts
(images, generated bytecode, test fixtures). We care that attribution:
(a) doesn't crash, and (b) gives a sensible answer (either "attributed
to the creating trace" or "missing_from_audit"). The choice of which is
correct is partly a product decision; we assert the spike's current
behavior so any change is intentional.
"""

[[steps]]
type = "reset"

[[steps]]
type = "start_watcher"

[[steps]]
type = "claude"
label = "a"
prompts = [
    "Use the Bash tool to run: printf '\\x89PNG\\r\\n\\x1a\\nbinary-payload' > asset.bin",
    "done",
]

[[steps]]
type = "wait"
seconds = 2

[[steps]]
type = "stop_watcher"

[[steps]]
type = "commit"
message = "add binary asset"

# Document current behavior: watcher captures the new file, git blame
# reports whatever line count it sees in the bytes. Single line (no
# newline-terminated content boundaries, printf emits one record).
# If the spike later special-cases binary detection, this assertion
# will flag the behavior change and can be updated intentionally.
[[assertions]]
file = "asset.bin"
trace = "a"
lines_min = 1
