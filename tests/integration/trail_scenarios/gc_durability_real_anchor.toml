name = "gc_durability_real_anchor"
description = """
Real Claude/tmux Trace Trails UAT for the canonical-anchor durability invariant.
After a real Claude-authored Trace Patch is anchored in a Git commit, the scratch
repo expires reflogs and runs aggressive Git GC. Trail explain and ot:// resource
resolution must still work from the canonical event log.
"""

[[steps]]
type = "reset"

[[steps]]
type = "init_opentraces"

[[steps]]
type = "trail_preflight"
expected_version = "0.4.0"
setup_claude_code = true
setup_git = true
doctor = true

[[steps]]
type = "claude"
label = "author"
timeout = 300
quiesce = 6
prompts = [
    """Use the Write tool to create src/gc_durability.py with exactly this content and do not edit any other files:
def gc_durability_value():
    return "trail-gc-durability-real-anchor-001"
""",
]

[[steps]]
type = "trail_select_patch"
name = "selected"
trace = "author"
file = "src/gc_durability.py"
contains = "trail-gc-durability-real-anchor-001"
timeout = 45

[[steps]]
type = "commit"
message = "real trace trail gc durability"
files = ["src/gc_durability.py"]

[[steps]]
type = "trail_select_patch"
name = "selected"
trace = "author"
file = "src/gc_durability.py"
contains = "trail-gc-durability-real-anchor-001"
require_anchor = true
timeout = 30

[[steps]]
type = "shell"
command = "git reflog expire --expire=now --expire-unreachable=now --all && git gc --prune=now --aggressive"

[[assertions]]
kind = "trail_trace_step_explain"
selection = "selected"
relation = "anchored_in_git"
patch_status = "patched"
evidence_tier = "exact_range_hash"
requires_containing_segment_id = true
requires_git_anchor = true

[[assertions]]
kind = "trail_commit_explain"
selection = "selected"
ref = "HEAD"
requires_containing_segment_id = true

[[assertions]]
kind = "trail_file_line_explain"
selection = "selected"
requires_containing_segment_id = true

[[assertions]]
kind = "trail_resolve_all_resource_refs"
selection = "selected"
requires_containing_segment_id = true
