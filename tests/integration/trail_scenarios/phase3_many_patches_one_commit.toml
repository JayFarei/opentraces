name = "phase3_many_patches_one_commit"
description = """
Real Claude/tmux Trace Trails UAT for Phase 3's many-Trace-Patches-in-one-commit
case. One Claude session creates two distinct files, one Git commit anchors both
Trace Patches, and the client-facing commit explain view must return both.
"""

[[steps]]
type = "reset"

[[steps]]
type = "init_opentraces"

[[steps]]
type = "trail_preflight"
expected_version = "0.4.0"
setup_claude_code = true
setup_git = true
doctor = true

[[steps]]
type = "claude"
label = "author"
timeout = 300
quiesce = 6
prompts = [
    """Use the Write tool to create src/trail_alpha.py with exactly this content and do not edit any other files:
def alpha_value():
    return "trail-phase3-many-alpha-001"
""",
    """Use the Write tool to create src/trail_beta.py with exactly this content and do not edit any other files:
def beta_value():
    return "trail-phase3-many-beta-001"
""",
]

[[steps]]
type = "trail_select_patch"
name = "alpha"
trace = "author"
file = "src/trail_alpha.py"
contains = "trail-phase3-many-alpha-001"
timeout = 45

[[steps]]
type = "trail_select_patch"
name = "beta"
trace = "author"
file = "src/trail_beta.py"
contains = "trail-phase3-many-beta-001"
timeout = 45

[[steps]]
type = "commit"
message = "real trace trail many patches"
files = ["src/trail_alpha.py", "src/trail_beta.py"]

[[steps]]
type = "trail_select_patch"
name = "alpha"
trace = "author"
file = "src/trail_alpha.py"
contains = "trail-phase3-many-alpha-001"
require_anchor = true
timeout = 30

[[steps]]
type = "trail_select_patch"
name = "beta"
trace = "author"
file = "src/trail_beta.py"
contains = "trail-phase3-many-beta-001"
require_anchor = true
timeout = 30

[[assertions]]
kind = "trail_commit_patch_count"
ref = "HEAD"
min = 2

[[assertions]]
kind = "trail_trace_step_explain"
selection = "alpha"
relation = "anchored_in_git"
patch_status = "patched"
evidence_tier = "exact_range_hash"
requires_containing_segment_id = true
requires_git_anchor = true

[[assertions]]
kind = "trail_trace_step_explain"
selection = "beta"
relation = "anchored_in_git"
patch_status = "patched"
evidence_tier = "exact_range_hash"
requires_containing_segment_id = true
requires_git_anchor = true

[[assertions]]
kind = "trail_commit_explain"
selection = "alpha"
ref = "HEAD"
requires_containing_segment_id = true

[[assertions]]
kind = "trail_commit_explain"
selection = "beta"
ref = "HEAD"
requires_containing_segment_id = true

[[assertions]]
kind = "trail_resolve_all_resource_refs"
selection = "alpha"
requires_containing_segment_id = true

[[assertions]]
kind = "trail_resolve_all_resource_refs"
selection = "beta"
requires_containing_segment_id = true
