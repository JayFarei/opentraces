name = "phase6_real_provenance"
description = """
Real Claude/tmux Trace Trails UAT. A live Claude Code session writes a
distinctive line, Git anchors it through the installed post-commit hook, and
the client-facing trail CLI contract resolves the same patch from trace-step,
commit, file-line, and ot:// resource entry points. A second read-only session
proves explicit no-patch status.
"""

[[steps]]
type = "reset"

[[steps]]
type = "init_opentraces"

[[steps]]
type = "trail_preflight"
expected_version = "0.4.0"
setup_claude_code = true
setup_git = true
doctor = true

[[steps]]
type = "claude"
label = "author"
timeout = 300
quiesce = 6
prompts = [
    """Use the Write tool to create src/provenance_demo.py with exactly this content and do not edit any other files:
def provenance_value():
    return "trail-phase6-real-origin-001"
""",
]

[[steps]]
type = "trail_select_patch"
name = "selected"
trace = "author"
file = "src/provenance_demo.py"
contains = "trail-phase6-real-origin-001"
timeout = 45

[[steps]]
type = "commit"
message = "real trace trail provenance"
files = ["src/provenance_demo.py"]

[[steps]]
type = "trail_select_patch"
name = "selected"
trace = "author"
file = "src/provenance_demo.py"
contains = "trail-phase6-real-origin-001"
require_anchor = true
timeout = 30

[[steps]]
type = "claude"
label = "research"
timeout = 240
quiesce = 6
prompts = [
    "Use the Read tool to read README.md, then reply with one sentence. Do not write, edit, delete, or modify any files.",
]

[[steps]]
type = "trail_select_no_patch_step"
trace = "research"
timeout = 45

[[assertions]]
kind = "trail_trace_step_explain"
selection = "selected"
relation = "anchored_in_git"
patch_status = "patched"
evidence_tier = "exact_range_hash"
requires_containing_segment_id = true
requires_git_anchor = true

[[assertions]]
kind = "trail_commit_explain"
selection = "selected"
ref = "HEAD"
requires_containing_segment_id = true

[[assertions]]
kind = "trail_file_line_explain"
selection = "selected"
requires_containing_segment_id = true

[[assertions]]
kind = "trail_resolve_all_resource_refs"
selection = "selected"
requires_containing_segment_id = true

[[assertions]]
kind = "trail_no_patch_step"
trace = "research"
patch_status = "no_patch"
requires_containing_segment_id = true
