name = "phase3_partial_commit_unknown"
description = """
Real Claude/tmux Trace Trails UAT for orphan honesty. Claude creates two Trace
Patches, but Git commits only one file. The committed patch should receive a
Git Anchor and the uncommitted patch must remain explicit unknown evidence, not
be guessed into the commit.
"""

[[steps]]
type = "reset"

[[steps]]
type = "init_opentraces"

[[steps]]
type = "trail_preflight"
expected_version = "0.4.0"
setup_claude_code = true
setup_git = true
doctor = true

[[steps]]
type = "claude"
label = "author"
timeout = 300
quiesce = 6
prompts = [
    """Use the Write tool to create src/committed_patch.py with exactly this content and do not edit any other files:
def committed_value():
    return "trail-phase3-partial-committed-001"
""",
    """Use the Write tool to create src/uncommitted_patch.py with exactly this content and do not edit any other files:
def uncommitted_value():
    return "trail-phase3-partial-uncommitted-001"
""",
]

[[steps]]
type = "trail_select_patch"
name = "committed"
trace = "author"
file = "src/committed_patch.py"
contains = "trail-phase3-partial-committed-001"
timeout = 45

[[steps]]
type = "trail_select_patch"
name = "uncommitted"
trace = "author"
file = "src/uncommitted_patch.py"
contains = "trail-phase3-partial-uncommitted-001"
timeout = 45

[[steps]]
type = "commit"
message = "real trace trail partial commit"
files = ["src/committed_patch.py"]

[[steps]]
type = "trail_select_patch"
name = "committed"
trace = "author"
file = "src/committed_patch.py"
contains = "trail-phase3-partial-committed-001"
require_anchor = true
timeout = 30

[[assertions]]
kind = "trail_commit_patch_count"
ref = "HEAD"
equals = 1

[[assertions]]
kind = "trail_trace_step_explain"
selection = "committed"
relation = "anchored_in_git"
patch_status = "patched"
evidence_tier = "exact_range_hash"
requires_containing_segment_id = true
requires_git_anchor = true

[[assertions]]
kind = "trail_commit_explain"
selection = "committed"
ref = "HEAD"
requires_containing_segment_id = true

[[assertions]]
kind = "trail_trace_step_explain"
selection = "uncommitted"
relation = "unknown"
patch_status = "patched"
requires_containing_segment_id = true
requires_git_anchor = false
requires_no_git_anchor = true
requires_limitation = "git_anchor_unknown"

[[assertions]]
kind = "trail_commit_excludes_selection"
selection = "uncommitted"
ref = "HEAD"
