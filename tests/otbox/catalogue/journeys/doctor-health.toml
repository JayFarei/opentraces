name = "doctor-health"
description = """
Pipeline health surface: run `doctor` in JSON mode against a seeded
project and confirm the structured health payload parses and reports
the trail capture audit as ok.
"""
lane = "extended"
tier = 0
seed = "smoke"
requires = ["cli"]

[[steps]]
type = "cli"
id = "doctor"
argv = ["--json", "doctor"]

[[assertions]]
kind = "returncode"
step = "doctor"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "doctor"
path = "doctor.trail_capture_audit.state"
equals = "ok"

[[assertions]]
kind = "stdout_json"
step = "doctor"
path = "doctor.trace_index.state"
equals = "ok"
