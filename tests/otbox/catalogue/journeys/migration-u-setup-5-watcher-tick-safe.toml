name = "migration-u-setup-5-watcher-tick-safe"
description = """
Upgrade-UAT U-setup-5 (P0). The new attribution daemon enrolls a migrated
legacy-only project safely: `setup watcher tick` returns rc=0, processes the
repo's existing commit, and crucially reports `jsonl_activity = false`, i.e. it
NEVER misclassifies the read-in-place legacy traces/*.jsonl as fresh agent
sessions to re-ingest. A second tick is idempotent.

Forks from `c-legacy-v033`.
"""
lane = "core"
tier = 0
tier_label = "silver"
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-legacy-v033"]

[preconditions]
legacy_world_restored = true
pre_migration_schema = "0.3.0"

[[steps]]
type = "cli"
id = "tick-1"
argv = ["--json", "setup", "watcher", "tick", "--project", "{project}"]

[[steps]]
type = "cli"
id = "tick-2"
argv = ["--json", "setup", "watcher", "tick", "--project", "{project}"]

[[assertions]]
kind = "returncode"
step = "tick-1"
equals = 0

# The read-in-place legacy JSONL is NOT treated as fresh agent activity.
[[assertions]]
kind = "stdout_json"
step = "tick-1"
path = "0.jsonl_activity"
equals = false

# Second tick is a clean no-op (idempotent), still no JSONL re-ingest.
[[assertions]]
kind = "returncode"
step = "tick-2"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "tick-2"
path = "0.jsonl_activity"
equals = false
