name = "bind-hf-remote"
description = """
Bind HF dataset remote (plan 063 §1: `bind-hf-remote`). `dataset remote
create` provisions a new remote + binds, and also binds an existing remote
idempotently. `dataset remote list` shows bindings; `dataset remote remove`
unbinds. This journey asserts the create / list / remove surfaces against a smoke
seed with no datasets bound.
"""
lane = "core"
tier = 0
seed = "smoke"
trajectories = ["bind-hf-remote"]
persona = "both"
requires = ["cli"]

[[steps]]
type = "cli"
id = "create-help"
argv = ["dataset", "remote", "create", "--help"]

[[steps]]
type = "cli"
id = "list-help"
argv = ["dataset", "remote", "list", "--help"]

[[steps]]
type = "cli"
id = "remove-help"
argv = ["dataset", "remote", "remove", "--help"]

[[assertions]]
kind = "stdout_contains"
step = "create-help"
value = "creating it if it doesn't exist"

[[assertions]]
kind = "stdout_contains"
step = "list-help"
value = "List"

[[assertions]]
kind = "stdout_contains"
step = "remove-help"
value = "Disconnect"
