name = "pi-readonly-recursion-guard"
description = "Plan 091 Pi ot_* readonly tool traces remain searchable without Pi-only attribution paths."
lane = "core"
tier = 0
tier_label = "gold"
persona = "agent"
requires = ["cli", "git"]
status = "synthetic-or-artifact-backed"
from_checkpoints = ["c-captured-pi-readonly-session"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

[[steps]]
type = "cli"
id = "trace-index"
argv = ["trace", "index", "status", "--json"]

[[steps]]
type = "cli"
id = "trace-query"
argv = ["trace", "query", "--facet", "agent.name=pi", "--limit", "3", "--json"]

[[steps]]
type = "shell"
id = "snapshot-repeat-readonly"
argv = ["bash", "-lc", "cd {repo_root} && {py_bin} -c 'from opentraces.core.trace_search_snapshot import default_snapshot_path; import subprocess; p=default_snapshot_path(); before=p.stat().st_size; [subprocess.run([\"{repo_root}/otd\", \"trace\", \"query\", \"--facet\", \"agent.name=pi\", \"--limit\", \"3\", \"--json\"], check=True, stdout=subprocess.DEVNULL) for _ in range(3)]; assert p.stat().st_size == before; assert not p.with_name(p.name + \"-wal\").exists(); assert not p.with_name(p.name + \"-shm\").exists(); print(\"snapshot-immutable\")'"]

[[steps]]
type = "shell"
id = "pi-search-delegation-contract"
argv = ["bash", "-lc", "cd {repo_root} && node packages/opentraces-pi/scripts/test.mjs"]

[[steps]]
type = "cli"
id = "bucket-verify"
argv = ["bucket", "verify", "--full", "--json"]

# The ot_* readonly recursion guard itself is enforced at the Pi extension
# boundary (packages/opentraces-pi/src/index.ts early-returns on tool names
# starting with "ot_", and the bridge sets OPENTRACES_PI_EXTENSION_INTERNAL).
# The synthetic checkpoint carries no ot_* calls, so this journey verifies the
# downstream invariant the guard protects: a captured Pi trace stays searchable
# and leaves no dangling (Pi-only) attribution refs in the shared bucket.
[[assertions]]
kind = "returncode"
step = "trace-index"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "trace-index"
path = "search_snapshot.trace_count"

[[assertions]]
kind = "returncode"
step = "trace-query"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "trace-query"
path = "candidates.0.candidate_kind"
equals = "trace"

[[assertions]]
kind = "stdout_json"
step = "trace-query"
path = "search_diagnostics.used_search_snapshot"
equals = true

[[assertions]]
kind = "stdout_json"
step = "trace-query"
path = "search_diagnostics.raw_trace_scan"
equals = false

[[assertions]]
kind = "stdout_json"
step = "trace-query"
path = "search_diagnostics.wrote_to_index"
equals = false

[[assertions]]
kind = "stdout_json"
step = "trace-query"
path = "search_diagnostics.rebuilt_index"
equals = false

[[assertions]]
kind = "stdout_json"
step = "trace-query"
path = "search_diagnostics.python_full_corpus_sort"
equals = false

[[assertions]]
kind = "returncode"
step = "snapshot-repeat-readonly"
equals = 0

[[assertions]]
kind = "stdout_contains"
step = "snapshot-repeat-readonly"
value = "snapshot-immutable"

[[assertions]]
kind = "returncode"
step = "pi-search-delegation-contract"
equals = 0

[[assertions]]
kind = "stdout_contains"
step = "pi-search-delegation-contract"
value = "opentraces-pi tests ok"

[[assertions]]
kind = "returncode"
step = "bucket-verify"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "bucket-verify"
path = "ok"
equals = true

[[assertions]]
kind = "stdout_json"
step = "bucket-verify"
path = "verify.dangling_count"
equals = 0
