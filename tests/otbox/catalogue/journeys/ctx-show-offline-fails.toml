name = "ctx-show-offline-fails"
description = """
Plan 080 Phase D mechanism journey (GOLD) — `ctx show <node> --remote
--offline` fails fast (rc=4) when a referenced layer blob is not
locally resolvable and no network access is permitted.

The load-bearing claim is that `--offline` is a HARD opt-out:
  - MUST NOT issue any network call (the offline branch short-circuits
    BEFORE the remote backend is ever constructed — checked in code,
    pinned here by passing a dummy repo id that would 401 instantly if
    the wire were touched).
  - MUST exit rc=4 with a structured `blob_missing_offline` envelope.
  - MUST print a hint pointing at `opentraces bucket prefetch`.
  - MUST NOT mutate any bucket state.

Setup (c-bucket-spine-v2-pushed-fake-remote-blob-dropped): one pinned
ContextNode whose four layer ids resolve to no layer events/blobs (the
deterministic "blob not locally resolvable" shape), exposed via
`~/.otbox-bucket-spine/dangling_node_id`, plus the fully-captured main
node at `~/.otbox-bucket-spine/main_node_id`.

Asserts:
  (a) offline call on the dangling node BEFORE warm: rc=4, status ==
      "error", error.kind == "blob_missing_offline", error.hint mentions
      `bucket prefetch`.
  (b) The events head is UNCHANGED across the failed call (no write).
  (c) Issue #57 — dropping --offline and pointing at the fake remote
      makes the fetch SUCCEED (rc=0): the dangling node's blobs live on
      the fake remote, so `--remote file://<fake>/bucket-spine` resolves
      them and warms the local cache.
  (d) Issue #57 — `--offline` AFTER the warm now exits rc=0 (the local
      blob-cache read rung serves the warmed blobs); offline is reachable
      precisely because the cache was warmed, proving the gate is "blob
      missing locally", not "always fail offline".
  (e) The same --offline flags on a locally-complete (main) node exit 0.

Issue #57: the "drop --offline and the fetch succeeds" arm is restored
against the directory-backed fake dispatch (`get_backend('file:///abs/
dir')` -> tokenless offline DirectoryHubBackend) and the now-shipped
`ctx show` local-blob-cache read rung. The rc=4 + error-envelope + hint
assertions are kept verbatim (they now describe the BEFORE-warm state).
`expect_returncode` declares the rc=4 step (the authored
`expected_returncode` key is not a runner field).
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-pushed-fake-remote-blob-dropped"]

[preconditions]
min_captured_traces = 1
context_tree_built = true
local_blobs_dropped = true

# ---------------------------------------------------------------------
# Step 1 — capture the pre-call events head (non-mutation baseline).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "offline-pre-status"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "offline-pre-status"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "offline-pre-status"
path = "bucket.events_v1.last_batch_id"

# ---------------------------------------------------------------------
# Step 2 — `ctx show --remote --offline` fails fast on the missing
# layer. The offline branch short-circuits before any backend exists.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "ctx-show-remote-offline-fails"
argv = ["bash", "-c",
        "exec {project}/.testvenv/bin/opentraces ctx show \"$(cat {home}/.otbox-bucket-spine/dangling_node_id)\" --remote otbox/fake-bucket --offline --json"]
expect_returncode = 4

[[assertions]]
kind = "returncode"
step = "ctx-show-remote-offline-fails"
equals = 4

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-offline-fails"
path = "status"
equals = "error"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-offline-fails"
path = "error.kind"
equals = "blob_missing_offline"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-offline-fails"
path = "error.missing_layer_type"
equals = "system"

# The hint must mention the prefetch verb so users can resolve.
[[assertions]]
kind = "stdout_json_contains"
step = "ctx-show-remote-offline-fails"
path = "error.hint"
value = "bucket prefetch"

# ---------------------------------------------------------------------
# Step 3 — events head unchanged: the failed offline call wrote
# nothing.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "offline-post-status"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "offline-post-status"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "offline-post-status"
path = "bucket.events_v1.last_batch_id"
equals_var = "offline-pre-status:bucket.events_v1.last_batch_id"

# ---------------------------------------------------------------------
# Step 4 — issue #57: drop --offline and point at the fake remote. The
# dangling node's blobs live there, so the fetch SUCCEEDS (rc=0) and the
# local cache is warmed.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "ctx-show-remote-fetch-succeeds"
argv = ["bash", "-c",
        "exec {project}/.testvenv/bin/opentraces ctx show \"$(cat {home}/.otbox-bucket-spine/dangling_node_id)\" --remote file://{fake_remote}/bucket-spine --json"]

[[assertions]]
kind = "returncode"
step = "ctx-show-remote-fetch-succeeds"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-fetch-succeeds"
path = "layers.system.fetched_from"
equals = "remote"

# ---------------------------------------------------------------------
# Step 5 — issue #57: --offline AFTER the warm now exits rc=0; the local
# blob-cache rung serves the warmed blobs. Offline is reachable BECAUSE
# the cache was warmed — the gate is "blob missing locally".
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "ctx-show-offline-after-warm"
argv = ["bash", "-c",
        "exec {project}/.testvenv/bin/opentraces ctx show \"$(cat {home}/.otbox-bucket-spine/dangling_node_id)\" --offline --json"]

[[assertions]]
kind = "returncode"
step = "ctx-show-offline-after-warm"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-show-offline-after-warm"
path = "layers.system.fetched_from"
equals = "cache"

# ---------------------------------------------------------------------
# Step 6 — the same --offline flags on a locally-complete (main) node
# exit 0 — the gate is "blob missing locally", not "always fail offline".
# (The main node's layers resolve from the projection, so the --remote
# value is never reached.)
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "ctx-show-offline-local-complete"
argv = ["bash", "-c",
        "exec {project}/.testvenv/bin/opentraces ctx show \"$(cat {home}/.otbox-bucket-spine/main_node_id)\" --remote file://{fake_remote}/bucket-spine --offline --json"]

[[assertions]]
kind = "returncode"
step = "ctx-show-offline-local-complete"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-show-offline-local-complete"
path = "layers.system.fetched_from"
equals = "local"
