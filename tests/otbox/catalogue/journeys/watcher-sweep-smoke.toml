name = "watcher-sweep-smoke"
description = """
One bounded watcher sweep pass (`setup watcher sweep`, the #65
production entrypoint the launchd/systemd shim execs) runs to
completion against a seeded project and emits its structured report:
ok=true with the projects/errors accounting present. Owning journey
for the verb in the JTBD command map.
"""
lane = "extended"
tier = 0
seed = "smoke"
requires = ["cli"]

[[steps]]
type = "cli"
id = "sweep"
argv = ["--json", "setup", "watcher", "sweep"]

[[assertions]]
kind = "returncode"
step = "sweep"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "sweep"
path = "ok"
equals = true

[[assertions]]
kind = "stdout_json"
step = "sweep"
path = "projects"
