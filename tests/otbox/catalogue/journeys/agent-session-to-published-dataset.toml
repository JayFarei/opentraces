name = "agent-session-to-published-dataset"
description = """
Plan 064 R5: the end-to-end agent → dataset journey.

Today the `cli-publish-happy-path` journey publishes an ad-hoc dataset
seeded with synthetic trace IDs that don't exist on disk. The
substantive thing the journey can't prove is that opentraces takes a
**real captured session** all the way through to a published shard.

This journey closes that gap. It runs from `c-captured-real-session`
(plan 064 R3), which has already driven a real Claude session through
the harness, ingested via `_ingest-session`, fired the post-commit
hook, and matured a Git Anchor. From there:

  1. `trace index` explicitly rebuilds the read-only search snapshot.
     `trace query` resolves the captured trace through that snapshot.
     `trace discover` groups the same retained evidence into cards for
     exploratory orientation. (Real consumer-API entry points.)
  2. `dataset new --rows-file` seeds a row referencing the captured
     `source_trace_id` so the dataset's published shard carries the
     real captured trace's lineage.
  3. `dataset review approve --all` + `dataset remote create` +
     `dataset publish` land the row in the fake HF remote.

The fake HF remote shard's `dataset_infos.json` and at least one data
file under the data/ subtree must exist after the publish step.

The sibling `cli-publish-happy-path` journey still exercises the ad-hoc
publish flow with synthetic IDs; both surfaces matter (each is a valid
consumer path) so neither replaces the other.
"""
lane = "core"
tier = 0
trajectories = ["build-publishable-dataset"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-captured-real-session"]

# --- 1. `trace query` resolves the captured trace by free-text -----------
[[steps]]
type = "cli"
id = "trace-index"
argv = ["trace", "index", "--json"]

[[assertions]]
kind = "returncode"
step = "trace-index"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "trace-index"
path = "search_snapshot.trace_count"

[[steps]]
type = "cli"
id = "trace-query"
argv = ["trace", "query", "farewell", "--limit", "5", "--json"]

[[assertions]]
kind = "returncode"
step = "trace-query"
equals = 0

# The captured trace's UUID must surface in the query stdout — proves
# the Trace Index was populated and is queryable.
[[assertions]]
kind = "stdout_contains"
step = "trace-query"
value = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "trace-query"
path = "search_diagnostics.used_search_snapshot"
equals = true

[[assertions]]
kind = "stdout_json"
step = "trace-query"
path = "search_diagnostics.raw_trace_scan"
equals = false

[[assertions]]
kind = "stdout_json"
step = "trace-query"
path = "search_diagnostics.wrote_to_index"
equals = false

[[assertions]]
kind = "stdout_json"
step = "trace-query"
path = "search_diagnostics.rebuilt_index"
equals = false

[[assertions]]
kind = "stdout_json"
step = "trace-query"
path = "search_diagnostics.python_full_corpus_sort"
equals = false

# `trace discover` should surface the same captured trace in bounded
# card/group form without loading the full transcript.
[[steps]]
type = "cli"
id = "trace-discover"
argv = ["trace", "discover", "farewell", "--json", "--limit", "5"]

[[assertions]]
kind = "returncode"
step = "trace-discover"
equals = 0

[[assertions]]
kind = "stdout_contains"
step = "trace-discover"
value = "{trace_id}"

# --- 2. Seed a row file referencing the captured trace_id ----------------
# The captured trace's real id is resolved from the bucket layout by a
# brace-free helper. (A JSONL `write_file` cannot template `{trace_id}`
# inline: str.format bails on the row's own JSON braces and leaves the
# placeholder literal, which the #194 clearance then reads as an unknown
# trace — the latent bug that gate exposed.)
[[steps]]
type = "write_file"
id = "write-rowsgen"
path = "gen_captured_rows.py"
content = '''
import glob
import json
import os
import sys

otdir = sys.argv[1]
project = sys.argv[2]
troot = os.path.join(otdir, "bucket", "traces", "v1")
tids = []
for tj in sorted(glob.glob(os.path.join(troot, "*", "*", "trace.json"))):
    try:
        rec = json.load(open(tj, encoding="utf-8"))
    except Exception:
        continue
    if rec.get("trace_id"):
        tids.append(rec["trace_id"])
if not tids:
    raise SystemExit("no captured bucket trace to reference")
tid = tids[0]
row = dict(source_trace_id=tid, source_unit_id="tu:" + tid + ":trace", summary="captured: add farewell() helper to src/app.py")
open(os.path.join(project, "captured_rows.jsonl"), "w", encoding="utf-8").write(json.dumps(row) + "\n")
print("wrote captured row for " + tid)
'''

[[steps]]
type = "shell"
id = "gen-rows"
argv = ["{py_bin}", "{project}/gen_captured_rows.py", "{opentraces_dir}", "{project}"]

[[assertions]]
kind = "returncode"
step = "gen-rows"
equals = 0

[[steps]]
type = "write_file"
id = "write-schema"
path = "captured_schema.json"
content = """
{"type": "object", "properties": {"source_trace_id": {"type": "string"}, "source_unit_id": {"type": "string"}, "summary": {"type": "string"}}, "required": ["source_trace_id", "summary"]}
"""

# --- 3. Create the dataset (manual / ad-hoc mode) -------------------------
[[steps]]
type = "cli"
id = "dataset-new"
argv = [
    "dataset", "new", "captured-session",
    "--rows-file", "captured_rows.jsonl",
    "--schema", "captured_schema.json",
]

[[assertions]]
kind = "returncode"
step = "dataset-new"
equals = 0

# --- 4. Bind a (fake) HF remote -------------------------------------------
[[steps]]
type = "cli"
id = "remote-create"
argv = [
    "dataset", "remote", "create",
    "captured-session", "captured/dataset", "--private",
]

[[assertions]]
kind = "returncode"
step = "remote-create"
equals = 0

# --- 5. Approve every row -------------------------------------------------
[[steps]]
type = "cli"
id = "review-approve"
argv = ["dataset", "review", "approve", "captured-session", "--all"]

[[assertions]]
kind = "returncode"
step = "review-approve"
equals = 0

# --- 5b. Clear the source trace for egress (#194) -------------------------
# The captured trace lands in the bucket unscanned, so the #194 egress
# clearance gate would withhold every row sourced from it. A genuine
# publish ships CLEARED data: run the bucket security filter so the
# captured trace is scanned + syncable in the push-time manifest.
[[steps]]
type = "cli"
id = "security-policy"
argv = ["bucket", "security", "policy", "--policy", "basic", "--json"]

[[assertions]]
kind = "returncode"
step = "security-policy"
equals = 0

[[steps]]
type = "cli"
id = "security-run"
argv = ["bucket", "security", "run", "--all", "--json"]

[[assertions]]
kind = "returncode"
step = "security-run"
equals = 0

[[assertions]]
kind = "stdout_json_greater_equal"
step = "security-run"
path = "security_run.filtered"
min = 1

# --- 6. Publish to the fake HF remote -------------------------------------
[[steps]]
type = "cli"
id = "publish"
argv = ["dataset", "publish", "captured-session"]

[[assertions]]
kind = "returncode"
step = "publish"
equals = 0

[[assertions]]
kind = "stdout_contains"
step = "publish"
value = "published: rows=1"

# --- 7. Verify the shard landed on the fake HF remote ---------------------
[[assertions]]
kind = "path_exists"
path = "{fake_remote}/captured/dataset/dataset_infos.json"

[[assertions]]
kind = "file_count_min"
path = "{fake_remote}/captured/dataset/data"
min = 1
