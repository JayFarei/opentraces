name = "bucket-verify-detects-dangling"
description = """
Plan 080 Phase C mechanism journey (GOLD) — `bucket verify` detects
dangling references: a layer_id referenced by the trace's
context.jsonl.gz / events mirror whose backing blob is MISSING from
`bucket/blobs/v1/<project>/context/`.

Setup (c-bucket-spine-v2-dangling-ref-injected): one referenced layer
blob deleted from disk; event log + per-trace envelopes intact and
still referencing it. This is the trust gate: a consumer seeing
dangling refs MUST NOT treat the bucket as ground truth.

Asserts:
  (a) `bucket verify --full --json` exits NON-zero (rc=3, the CLI's
      verify-gate exit code) with a structured envelope.
  (b) `ok == false` and `verify.dangling_count >= 1`.
  (c) `errors[0].kind == "dangling_blob"` and its detail names the
      missing layer_id ("references layer_id ... but no blob exists").
  (d) The events head is UNCHANGED across the verify call (verify is
      strictly read-only).

Re-specced for issue #42 (un-quarantine): the authored keys
`verify.dangling_refs_count` / `verify.dangling_refs[].layer_id/
referenced_by` / `bucket.self_sufficiency.ok` never existed — the
shipped shape is `verify.dangling_count` + `errors[{kind,path,detail}]`
(the referencing surface and the missing layer_id live in detail), and
the gate exit code is 3, not the authored 1 (cli/bucket.py exits 3 on
ok=false). The step rc is declared via `expect_returncode` (the
authored `expected_returncode` key is not a runner field). Out-of-vocab
`bucket_spine_v2_layout` / `dangling_ref_injected` precondition keys
dropped.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-dangling-ref-injected"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — capture pre-verify events head (verify must not mutate it).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "verify-dangling-pre-status"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "verify-dangling-pre-status"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "verify-dangling-pre-status"
path = "bucket.events_v1.last_batch_id"

# ---------------------------------------------------------------------
# Step 2 — verify exits non-zero with a structured dangling-ref
# envelope.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "verify-dangling-call"
argv = ["bucket", "verify", "--full", "--json"]
expect_returncode = 3

[[assertions]]
kind = "returncode"
step = "verify-dangling-call"
equals = 3

[[assertions]]
kind = "stdout_json"
step = "verify-dangling-call"
path = "ok"
equals = false

[[assertions]]
kind = "stdout_json"
step = "verify-dangling-call"
path = "status"
equals = "error"

[[assertions]]
kind = "stdout_json_greater_equal"
step = "verify-dangling-call"
path = "verify.dangling_count"
min = 1

# First error describes the missing blob.
[[assertions]]
kind = "stdout_json"
step = "verify-dangling-call"
path = "errors.0.kind"
equals = "dangling_blob"

# The detail names the referencing trace + the missing layer_id.
[[assertions]]
kind = "stdout_json_contains"
step = "verify-dangling-call"
path = "errors.0.detail"
value = "references layer_id"

[[assertions]]
kind = "stdout_json_contains"
step = "verify-dangling-call"
path = "errors.0.detail"
value = "but no blob exists"

# ---------------------------------------------------------------------
# Step 3 — post-verify events head unchanged (verify is strictly
# read-only).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "verify-dangling-post-status"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "verify-dangling-post-status"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "verify-dangling-post-status"
path = "bucket.events_v1.last_batch_id"
equals_var = "verify-dangling-pre-status:bucket.events_v1.last_batch_id"
