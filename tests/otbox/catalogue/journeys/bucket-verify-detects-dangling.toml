name = "bucket-verify-detects-dangling"
description = """
Plan 080 Phase C mechanism journey (GOLD) — `bucket verify` detects
dangling references: a `layer_id` referenced by an event or a
per-trace manifest whose backing blob is MISSING from
`bucket/blobs/v1/<project>/context/`.

Per Plan 080 §20 Resolution G (`bucket verify` reports dangling refs
but never mutates) + the verify gate enumerated in §10 (Performance
gates) + §13 (Self-sufficiency proof).

The load-bearing claim is that `bucket verify` is the trust gate
between writer-side correctness and consumer-side safety. If a
downstream consumer (cloud worker, dataset puller, viewer) sees
`verify.dangling_refs_count > 0`, they MUST not treat the bucket as
trustworthy ground truth. Today's verify only flags presence; this
journey pins that semantic: dangling = referenced-but-missing.

Setup (provided by the c-bucket-spine-v2-dangling-ref-injected
checkpoint factory):
  1. Capture a session and write the per-trace manifest pointing at
     N layer blobs.
  2. Delete ONE of the layer blobs from disk under
     `bucket/blobs/v1/<project>/context/<hh>/<hash>.json.gz`
     WITHOUT updating the per-trace manifest or the event log.
  3. (Event log + per-trace envelope are intact and reference the
     missing blob. This is the "dangling ref" condition: the bucket
     CLAIMS the blob exists but it doesn't.)

Asserts:
  (a) `bucket verify --full --json` exits NON-zero (gate failure)
      with a structured envelope describing the dangling ref.
  (b) `verify.ok: false`.
  (c) `verify.dangling_refs_count >= 1`.
  (d) `verify.dangling_refs[0].layer_id` is populated (the consumer
      can identify which content is missing).
  (e) `verify.dangling_refs[0].referenced_by` indicates the
      referencing surface (manifest / event / per-trace envelope).
  (f) The event log head (`bucket.events_v1.last_batch_id`) is
      UNCHANGED by the verify call (proves verify is non-mutating).
  (g) `bucket status --json` reports
      `bucket.self_sufficiency.ok: false` because of the dangling
      ref.

Fails today because:
  - `bucket verify --full` dangling-ref detection is Phase C Track C1
    (bucket_store) + Track C3 (this track — emitter touches blob
    sync but verify lives in C1's bucket_store).
  - The dangling-ref injection checkpoint
    `c-bucket-spine-v2-dangling-ref-injected` is a Phase C
    test-fixture follow-up.
  - `bucket.self_sufficiency.ok` flag wiring to verify dangling state
    is Phase C Track C1 (status surface).

Cross-track dependencies:
  - C1: `bucket verify` dangling-ref check walks per-trace manifests
    + event log mirror, builds the referenced-blob set, asserts each
    referenced blob exists on disk; produces `dangling_refs[]` for
    every missing path.
  - B3: `bucket verify --json` CLI plumbing + structured envelope.
  - Phase C otbox: `c-bucket-spine-v2-dangling-ref-injected` factory.
"""
lane = "core"
tier = 1  # PHASE-C: opt-in pending checkpoint c-bucket-spine-v2-dangling-ref-injected.
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-dangling-ref-injected"]

[preconditions]
min_captured_traces = 1
bucket_spine_v2_layout = true
context_tree_built = true
dangling_ref_injected = true

# ---------------------------------------------------------------------
# Step 1 — capture pre-verify event log head (verify must not
# mutate it).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "verify-dangling-pre-status"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "verify-dangling-pre-status"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "verify-dangling-pre-status"
path = "bucket.events_v1.last_batch_id"

# Self-sufficiency flag is FALSE because of the dangling ref.
[[assertions]]
kind = "stdout_json"
step = "verify-dangling-pre-status"
path = "bucket.self_sufficiency.ok"
equals = false

# ---------------------------------------------------------------------
# Step 2 — verify exits non-zero with a structured dangling-ref
# envelope.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "verify-dangling-call"
argv = ["bucket", "verify", "--full", "--json"]
expected_returncode = 1

[[assertions]]
kind = "returncode"
step = "verify-dangling-call"
equals = 1

[[assertions]]
kind = "stdout_json"
step = "verify-dangling-call"
path = "verify.ok"
equals = false

[[assertions]]
kind = "stdout_json"
step = "verify-dangling-call"
path = "verify.dangling_refs_count"

# First dangling ref describes the missing blob.
[[assertions]]
kind = "stdout_json"
step = "verify-dangling-call"
path = "verify.dangling_refs.0.layer_id"

# referenced_by surfaces which manifest / event pointed at the blob.
[[assertions]]
kind = "stdout_json"
step = "verify-dangling-call"
path = "verify.dangling_refs.0.referenced_by"

# ---------------------------------------------------------------------
# Step 3 — post-verify event log head unchanged (verify is
# strictly read-only).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "verify-dangling-post-status"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "verify-dangling-post-status"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "verify-dangling-post-status"
path = "bucket.events_v1.last_batch_id"

# Self-sufficiency flag remains FALSE post-verify.
[[assertions]]
kind = "stdout_json"
step = "verify-dangling-post-status"
path = "bucket.self_sufficiency.ok"
equals = false
