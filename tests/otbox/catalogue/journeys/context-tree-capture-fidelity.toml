name = "context-tree-capture-fidelity"
description = """
Plan 077 substrate-fidelity journey #1 (silver) — every layer the
model saw at each step is in the Context Tree, and the layer
content's identity is content-hashed honestly.

The Context Tree substrate adds a third refs/opentraces/local/events/v1
event taxonomy (alongside Trace and Trail) describing what the LLM
saw at each decision point: assembled system layer, message history,
tool registry, runtime state.

Forks from `c-context-tree-substrate` and asserts, via the CLI
surface (`ctx reads`, `ctx show`, `ctx anchor-for-step`):

  (a) `ctx reads --json` surfaces the per-record read rows
      ({step_index, node_id, uuid, role, content_hash}) and the
      first read's uuid appears inside the messages layer the
      corresponding node references (`ctx show <node> --full`).
  (b) Every tool name the fixture's init record registered
      (Read, Edit, Bash) appears in the tool_registry layer's
      `content.tools` rows for the Edit-step node.
  (c) The project-scope CLAUDE.md observed at capture time appears
      in the system layer's `content.claude_md_set` with scope
      `project` (the substrate checkpoint seeds {project}/CLAUDE.md
      before ingest).
  (d) Honest completeness labels: messages is full /
      transcript_reconstruction; system + tool_registry are
      approximated / transcript_reconstruction.
  (e) `ctx anchor-for-step` exits rc=3 with the honest empty-state
      message on this world — the claude_code JSONL capture path
      never populates trail_anchor_hint (absorbed from the
      temporal-anchor journey's shippable slice; the rc=0 half is
      retargeted to the codex world, see
      context-tree-temporal-anchor-precision).

Issue #42 re-spec deltas from the plan-077 draft: `ctx show`
emits `opentraces.context_tree.v1` (not the draft
`context_node.v1`); `ctx step` has no `--full`, so the layer-content
checks go through `ctx show {target_node_id} --full --json`; read
rows carry `uuid`/`content_hash` (not `result_uuid`/`tool_name`);
the registry rows live at `content.tools` (dicts, asserted via
substring containment); CLAUDE.md entries live at
`content.claude_md_set` with absolute capture-time paths (asserted
via the `/CLAUDE.md` + scope substrings); system + tool_registry
capture_method is `transcript_reconstruction` (the draft's
`hardcoded_template` value does not exist in the shipped vocab).

Covers requirements R3 (cover everything the model saw) and R5
(honest capture completeness labels).
"""
lane = "core"
tier = 0
tier_label = "silver"
trajectories = ["context-tree-capture"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-context-tree-substrate"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — the tree exists and identifies itself by schema_version.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "tree-shape"
argv = ["ctx", "tree", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "tree-shape"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "tree-shape"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "tree-shape"
path = "trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "tree-shape"
path = "active_leaf_id"

# ---------------------------------------------------------------------
# Step 2 — (a) `ctx reads` surfaces the read rows with the shipped
# {step_index, node_id, uuid, role, content_hash} shape.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "reads-surfaced"
argv = ["ctx", "reads", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "reads-surfaced"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "reads-surfaced"
path = "schema_version"
equals = "opentraces.context_reads.v1"

[[assertions]]
kind = "stdout_json"
step = "reads-surfaced"
path = "reads.0.uuid"

[[assertions]]
kind = "stdout_json"
step = "reads-surfaced"
path = "reads.0.node_id"

[[assertions]]
kind = "stdout_json"
step = "reads-surfaced"
path = "reads.0.content_hash"

# The first read row is the fixture's pinned opening prompt record.
[[assertions]]
kind = "stdout_json"
step = "reads-surfaced"
path = "reads.0.uuid"
equals = "user-otbox-ctx-multi-turn-1-prompt"

# ---------------------------------------------------------------------
# Step 3 — `ctx show --full` on the first read's node materializes the
# messages layer; its content must contain the read's uuid
# (substrate-fidelity property (a)).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "show-first-read-node"
argv = ["ctx", "show", "{first_read_node_id}", "--full", "--json"]

[[assertions]]
kind = "returncode"
step = "show-first-read-node"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "show-first-read-node"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "show-first-read-node"
path = "layers.messages.layer_id"

# Layer completeness must be honestly labeled. messages layers built
# from JSONL records are `full` / `transcript_reconstruction`; the
# absence of approximation here is the load-bearing claim.
[[assertions]]
kind = "stdout_json"
step = "show-first-read-node"
path = "layers.messages.completeness"
equals = "full"

[[assertions]]
kind = "stdout_json"
step = "show-first-read-node"
path = "layers.messages.capture_method"
equals = "transcript_reconstruction"

# Property (a) — the surfaced read's uuid is inside the messages layer
# content the node references.
[[assertions]]
kind = "stdout_json_contains"
step = "show-first-read-node"
path = "layers.messages.content.messages"
value = "user-otbox-ctx-multi-turn-1-prompt"

# ---------------------------------------------------------------------
# Step 4 — (b) + (c) on the Edit-step node ({target_node_id}; `ctx
# step` has no --full, so the content checks ride `ctx show`).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "step-tool-registry"
argv = ["ctx", "show", "{target_node_id}", "--full", "--json"]

[[assertions]]
kind = "returncode"
step = "step-tool-registry"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "step-tool-registry"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "step-tool-registry"
path = "layers.tool_registry.layer_id"

# The tool_registry layer's `content.tools` rows must include each
# tool the fixture's init record registered. Rows are dicts, so the
# containment is substring-shaped over the canonical '"name": "X"'
# serialization.
[[assertions]]
kind = "stdout_json_contains"
step = "step-tool-registry"
path = "layers.tool_registry.content.tools"
value = "\"name\": \"Read\""

[[assertions]]
kind = "stdout_json_contains"
step = "step-tool-registry"
path = "layers.tool_registry.content.tools"
value = "\"name\": \"Edit\""

[[assertions]]
kind = "stdout_json_contains"
step = "step-tool-registry"
path = "layers.tool_registry.content.tools"
value = "\"name\": \"Bash\""

# Honest completeness (d): built-in tool schemas are approximated,
# reconstructed from the transcript (shipped vocab: the draft's
# `hardcoded_template` does not exist).
[[assertions]]
kind = "stdout_json"
step = "step-tool-registry"
path = "layers.tool_registry.completeness"
equals = "approximated"

[[assertions]]
kind = "stdout_json"
step = "step-tool-registry"
path = "layers.tool_registry.capture_method"
equals = "transcript_reconstruction"

# (c) — the seeded project-scope CLAUDE.md is in claude_md_set with
# its on-disk content hash captured at session time.
[[assertions]]
kind = "stdout_json"
step = "step-tool-registry"
path = "layers.system.layer_id"

[[assertions]]
kind = "stdout_json_contains"
step = "step-tool-registry"
path = "layers.system.content.claude_md_set"
value = "/CLAUDE.md"

[[assertions]]
kind = "stdout_json_contains"
step = "step-tool-registry"
path = "layers.system.content.claude_md_set"
value = "\"scope\": \"project\""

[[assertions]]
kind = "stdout_json_contains"
step = "step-tool-registry"
path = "layers.system.content.claude_md_set"
value = "content_hash"

# system layer is approximated (static-core-prompt body is never on
# disk — plan 077 §"Honest gaps").
[[assertions]]
kind = "stdout_json"
step = "step-tool-registry"
path = "layers.system.completeness"
equals = "approximated"

[[assertions]]
kind = "stdout_json"
step = "step-tool-registry"
path = "layers.system.capture_method"
equals = "transcript_reconstruction"

# ---------------------------------------------------------------------
# Step 5 — (e) the claude-path anchor empty state is honest: rc=3 with
# a message naming the missing field, never a traceback (absorbed from
# the temporal-anchor journey's claude-world slice).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "anchor-empty-state"
argv = ["ctx", "anchor-for-step", "{trace_id}", "{step_index}"]
expect_returncode = 3

[[assertions]]
kind = "returncode"
step = "anchor-empty-state"
equals = 3

[[assertions]]
kind = "stderr_contains"
step = "anchor-empty-state"
value = "No trail_anchor_hint.commit_id"

[[assertions]]
kind = "stderr_not_contains"
step = "anchor-empty-state"
value = "Traceback"
