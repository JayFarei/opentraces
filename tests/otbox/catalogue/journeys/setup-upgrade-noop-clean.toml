name = "setup-upgrade-noop-clean"
description = """
Issue #78 / PR #81 — the "nothing to repair" case study for
`setup upgrade --integrations-only`. On the smoke seed NO integration glue is
installed (no git hook, no watcher, no hooks), so the integrations-only upgrade
is a clean no-op: it must succeed, repair nothing, and say so plainly.

This exercises the otherwise-uncovered clean branch of
_render_integration_repair_summary (cli/__init__.py): when nothing is installed
the human surface prints "No installed integrations needed re-rendering." and the
agent/JSON surface returns status "ok" with an empty integration_repair.repaired
list (every integration enumerated under skipped, reason "not-installed").

Honest/deterministic: no mutation, no network, no daemons — a single idempotent
upgrade invocation over an empty integration surface.
"""
lane = "extended"
tier = 0
persona = "both"
seed = "smoke"
requires = ["cli"]

# Human surface: clean no-op message.
[[steps]]
type = "cli"
id = "upgrade-noop-human"
argv = ["setup", "upgrade", "--integrations-only"]

[[assertions]]
kind = "returncode"
step = "upgrade-noop-human"
equals = 0

[[assertions]]
kind = "stdout_contains"
step = "upgrade-noop-human"
value = "No installed integrations needed re-rendering"

# Agent surface: status ok, nothing repaired, full stack accounted for as skipped.
[[steps]]
type = "cli"
id = "upgrade-noop-json"
argv = ["--json", "setup", "upgrade", "--integrations-only"]

[[assertions]]
kind = "returncode"
step = "upgrade-noop-json"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "upgrade-noop-json"
path = "status"
equals = "ok"

[[assertions]]
kind = "stdout_json_length_equals"
step = "upgrade-noop-json"
path = "integration_repair.repaired"
equals = 0

[[assertions]]
kind = "stdout_json_contains"
step = "upgrade-noop-json"
path = "integration_repair.skipped"
value = "git"

[[assertions]]
kind = "stdout_json_contains"
step = "upgrade-noop-json"
path = "integration_repair.skipped"
value = "watcher"
