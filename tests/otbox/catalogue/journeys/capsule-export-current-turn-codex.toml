name = "capsule-export-current-turn-codex"
description = """
Issue #98 (Part B, SILVER — CODEX=PARTIAL) — the Codex produces-a-capsule
branch, exercised only when a REAL Codex capture artifact is committed.

`c-captured-codex-real-session` is artifact-preferred / INERT-when-absent (no
synthetic fallback): when `tests/otbox/captures/codex-linear-edit/
snapshot.tar.gz` is absent (the default-CI case) it provides no session and
records an empty audit, so this journey's `[preconditions] min_captured_traces
=1` SKIPs it rather than green-theaters.

`capsule export --from-session {session_id} --from-agent codex --json` → rc=0
+ the v1 schema, when the artifact materializes a real captured Codex session.

The artifact-INDEPENDENT remediation branch (which MUST run in default CI)
lives in the separate tier-0 `capsule-export-current-turn-codex-remediation`
journey. The produces-a-capsule path's red-before-green is owned by the
hermetic Layer-1 `test_from_session_codex`. Tier 1 (opt-in).
"""
lane = "core"
tier = 1
tier_label = "silver"
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-captured-codex-real-session"]

[preconditions]
min_captured_traces = 1

[[steps]]
type = "cli"
id = "codex-from-session-build"
argv = ["capsule", "export", "--from-session", "{session_id}", "--from-agent", "codex", "--json"]

[[assertions]]
kind = "returncode"
step = "codex-from-session-build"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "codex-from-session-build"
path = "schema_version"
equals = "opentraces.capsule.v1"
