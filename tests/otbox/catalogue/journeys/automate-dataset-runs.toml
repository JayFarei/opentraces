name = "automate-dataset-runs"
description = """
Dataset schedule lifecycle (plan 063 §1: `automate-dataset-runs`):
add → list/show → pause/logs → resume/remove. Against a smoke seed
with no schedules registered, `dataset schedule list --json` MUST
return rc=0 with an empty list envelope; every lifecycle command
exposes its help surface.
"""
lane = "core"
tier = 0
seed = "smoke"
trajectories = ["automate-dataset-runs"]
persona = "both"
requires = ["cli"]

[[steps]]
type = "cli"
id = "list-json"
argv = ["dataset", "schedule", "list", "--json"]

[[steps]]
type = "cli"
id = "add-help"
argv = ["dataset", "schedule", "add", "--help"]

[[steps]]
type = "cli"
id = "show-help"
argv = ["dataset", "schedule", "show", "--help"]

[[steps]]
type = "cli"
id = "logs-help"
argv = ["dataset", "schedule", "logs", "--help"]

[[steps]]
type = "cli"
id = "pause-help"
argv = ["dataset", "schedule", "pause", "--help"]

[[steps]]
type = "cli"
id = "resume-help"
argv = ["dataset", "schedule", "resume", "--help"]

[[steps]]
type = "cli"
id = "remove-help"
argv = ["dataset", "schedule", "remove", "--help"]

[[assertions]]
kind = "returncode"
step = "list-json"
equals = 0

[[assertions]]
kind = "stdout_contains"
step = "add-help"
value = "schedule"

[[assertions]]
kind = "stdout_contains"
step = "show-help"
value = "schedule"

[[assertions]]
kind = "stdout_contains"
step = "logs-help"
value = "scheduler"

[[assertions]]
kind = "stdout_contains"
step = "pause-help"
value = "Pause"

[[assertions]]
kind = "stdout_contains"
step = "resume-help"
value = "Resume"

[[assertions]]
kind = "stdout_contains"
step = "remove-help"
value = "Remove"
