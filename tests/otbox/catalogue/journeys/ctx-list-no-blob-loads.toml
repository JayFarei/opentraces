name = "ctx-list-no-blob-loads"
description = """
Plan 080 Phase C performance gate journey (GOLD) — `ctx list --json`
MUST NOT open any layer blob file under
`bucket/blobs/v1/<project>/context/`.

Per Plan 080 §10 (Performance gates: `bench-ctx-list-10k-traces:
<500ms, zero blob file opens`) + §20 Resolution D (ContextLayerRef
lazy strategy: `ctx list` opts into `lazy=True` and resolves layers
through thin handles that only touch disk on `.content` access).

The load-bearing claim is that the list view scales to thousands of
traces because it never reads layer payloads. Manifest summaries +
`trace.json` summaries are sufficient; the per-layer blob content is
strictly demand-paged via `ctx show` / `ctx diff`.

Proxy: `ctx list --json` against the multi-trace fixture completes in
under 500ms wall-time. This is the cheaper otbox-side proxy for the
strict file-open count assertion enforced by the matching pytest
benchmark at `tests/perf/test_bucket_performance_gates.py`.

Asserts:
  (a) `ctx list --json` exits 0 and returns a `context_trees[]` array
      with at least 1 entry.
  (b) Each entry carries `trace_id` + `layer_count` + `digest` summary
      fields (i.e. no `layers[]` payload was eager-loaded).
  (c) Heads include `head.lazy: true` (the projection was built with
      `lazy=True`, per Resolution D).
  (d) Wall-time bound: list completes under 500ms (smoke proxy for the
      strict "zero blob file opens" assertion that the matching
      pytest benchmark enforces against a 10k-trace fixture).

Fails today because:
  - `ctx list` is a new verb (Phase B Track B3).
  - `lazy=True` plumbing on `build_context_tree_projection` is Phase C
    Track C2 (context_tree/refs.py + ContextLayerRef).
  - The matching strict-file-open pytest benchmark
    (`bench-ctx-list-10k-traces`) lives in Phase E (perf gates).

Cross-track dependencies:
  - C2: `ContextLayerRef` thin handle + `build_context_tree_projection
    (lazy=True)` opt-in for `ctx list`.
  - B3: `ctx list --json` envelope shape.
  - Phase E: companion pytest benchmark that counts `open()` calls
    via fixture instrumentation (this otbox journey is the smoke
    proxy; the pytest test is the strict gate).
"""
lane = "core"
tier = 1  # PHASE-C: opt-in pending checkpoint c-bucket-spine-v2-multi-trace-mixed.
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-multi-trace-mixed"]

[preconditions]
min_captured_traces = 2
bucket_spine_v2_layout = true
context_tree_built = true
lazy_projection_enabled = true

# ---------------------------------------------------------------------
# Step 1 — ctx list returns a populated context_trees array.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-list-no-blob-loads-call"
argv = ["ctx", "list", "--json"]
max_duration_ms = 500

[[assertions]]
kind = "returncode"
step = "ctx-list-no-blob-loads-call"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-list-no-blob-loads-call"
path = "context_trees.0.trace_id"

[[assertions]]
kind = "stdout_json"
step = "ctx-list-no-blob-loads-call"
path = "context_trees.1.trace_id"

# Summary-only shape: layer_count and digest, NOT layers[] payload.
[[assertions]]
kind = "stdout_json"
step = "ctx-list-no-blob-loads-call"
path = "context_trees.0.layer_count"

[[assertions]]
kind = "stdout_json"
step = "ctx-list-no-blob-loads-call"
path = "context_trees.0.digest"

# Lazy mode marker on the projection.
[[assertions]]
kind = "stdout_json"
step = "ctx-list-no-blob-loads-call"
path = "context_trees.0.lazy"
equals = true

# trace_count summary surfaces (not a per-layer payload).
[[assertions]]
kind = "stdout_json"
step = "ctx-list-no-blob-loads-call"
path = "trace_count"

# Performance gate: under 500ms wall-time on the multi-trace fixture.
[[assertions]]
kind = "duration_ms_max"
step = "ctx-list-no-blob-loads-call"
max_ms = 500

# ---------------------------------------------------------------------
# Step 2 — bucket status reports the blob namespace is non-empty,
# proving step 1 walked over loadable blobs and DIDN'T open them.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-list-blob-namespace-populated"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-list-blob-namespace-populated"
equals = 0

# Blob namespace populated — i.e. ctx list COULD have loaded blobs.
[[assertions]]
kind = "stdout_json"
step = "ctx-list-blob-namespace-populated"
path = "bucket.blobs_v1.context.unique_blob_count"
