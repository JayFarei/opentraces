name = "ctx-list-no-blob-loads"
description = """
Plan 080 Phase C performance gate journey (GOLD) — `ctx list --json`
MUST NOT open any layer blob file under
`bucket/blobs/v1/<project>/context/`.

Per Plan 080 §10 + §20 Resolution D: the list view scales because it
never reads layer payloads — `ctx list` reads `bucket/manifest.json`
ONLY. This otbox journey is the smoke proxy; the strict file-open-count
gate lives in the pytest perf suite.

Asserts:
  (a) `ctx list --json` exits 0 with both checkpoint traces and
      summary-only rows (counters + lifecycle; no layers[] payload).
  (b) Wall-time bound: the call completes within the smoke budget.
  (c) `bucket status` confirms the blob namespace is populated — i.e.
      step (a) COULD have loaded blobs and didn't need to.

Re-specced for issue #42 (un-quarantine): rows live under `traces[]`
(not `context_trees[]`) and carry no `lazy`/`digest` keys — the lazy
plumbing is core-level (ContextLayerRef), not an envelope field; the
"no layers[] payload" claim is pinned via stdout_json_path_absent. The
wall-time budget was widened 500ms -> 2500ms because the otbox runner
measures the full CLI process (python interpreter start dominates); the
strict 500ms/zero-open budget belongs to the in-process pytest bench.
Out-of-vocab `bucket_spine_v2_layout` / `lazy_projection_enabled`
precondition keys dropped.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-multi-trace-mixed"]

[preconditions]
min_captured_traces = 2
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — ctx list returns a populated, summary-only traces array.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-list-no-blob-loads-call"
argv = ["ctx", "list", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-list-no-blob-loads-call"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-list-no-blob-loads-call"
path = "traces.0.trace_id"

[[assertions]]
kind = "stdout_json"
step = "ctx-list-no-blob-loads-call"
path = "traces.1.trace_id"

# Summary-only shape: counters, NOT a layers[] payload.
[[assertions]]
kind = "stdout_json"
step = "ctx-list-no-blob-loads-call"
path = "traces.0.summary.node_count"

[[assertions]]
kind = "stdout_json_path_absent"
step = "ctx-list-no-blob-loads-call"
path = "traces.0.layers"

# Performance smoke budget (full CLI process; see description).
[[assertions]]
kind = "duration_ms_max"
step = "ctx-list-no-blob-loads-call"
max = 2500

# ---------------------------------------------------------------------
# Step 2 — bucket status reports the blob namespace is non-empty,
# proving step 1 walked over loadable blobs and DIDN'T open them.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-list-blob-namespace-populated"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-list-blob-namespace-populated"
equals = 0

[[assertions]]
kind = "stdout_json_greater_equal"
step = "ctx-list-blob-namespace-populated"
path = "bucket.context_trees.unique_layer_blob_count"
min = 1
