name = "codex-parity-bash-debugging"
description = """
Plan 083 C2/C12: Codex shell-heavy debugging parity. The journey is
pinned to an artifact-preferred bash-debugging checkpoint. It SKIPs
when tests/otbox/captures/codex-bash-debugging is absent, and proves
failure observation, recovery, trace/trail/context, and bucket shape
when the artifact is present.
"""
lane = "core"
tier = 0
tier_label = "gold"
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-captured-codex-bash-session"]
plan_083_matrix_ids = ["C2", "C12"]
status = "artifact-backed"

[preconditions]
min_captured_traces = 1
context_tree_built = true

[[steps]]
type = "cli"
id = "bucket-status"
argv = ["bucket", "status", "--json"]

[[steps]]
type = "cli"
id = "bucket-verify"
argv = ["bucket", "verify", "--sample", "1", "--json"]

[[steps]]
type = "cli"
id = "trace-query-codex"
argv = ["trace", "query", "--facet", "agent.name=codex-cli", "--json"]

[[steps]]
type = "cli"
id = "trace-get"
argv = ["trace", "get", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "trace-map"
argv = ["trace", "map", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "trail-graph"
argv = ["trail", "graph", "--trace", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "ctx-tree"
argv = ["ctx", "tree", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-status"
equals = 0

[[assertions]]
kind = "returncode"
step = "bucket-verify"
equals = 0

[[assertions]]
kind = "returncode"
step = "trace-query-codex"
equals = 0

[[assertions]]
kind = "returncode"
step = "trace-get"
equals = 0

[[assertions]]
kind = "returncode"
step = "trace-map"
equals = 0

[[assertions]]
kind = "returncode"
step = "trail-graph"
equals = 0

[[assertions]]
kind = "returncode"
step = "ctx-tree"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "bucket-status"
path = "bucket.trail.stale_count"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "trace-query-codex"
path = "candidates.0.trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "trace-get"
path = "trace.agent.name"
equals = "codex-cli"

[[assertions]]
kind = "stdout_contains"
step = "trace-get"
value = "AssertionError"

[[assertions]]
kind = "stdout_contains"
step = "trace-get"
value = "check_app passed"

[[assertions]]
kind = "stdout_json"
step = "trace-map"
path = "trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "trail-graph"
path = "pivot_trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "trail-graph"
path = "commits.0.sha"
equals = "{commit_sha}"

[[assertions]]
kind = "stdout_json"
step = "ctx-tree"
path = "root_node_id"
