name = "bucket-rebuild-context-tree-substrate"
description = """
Plan 080 mechanism journey (GOLD) — `bucket rebuild --substrate
context-tree` is idempotent and non-destructive against the new
spine layout.

Renamed in-place from Plan 079's `context-tree-bucket-rebuild.toml`
per Plan 080 §20 Resolution A; assertions are rewired to the new
`ctx list --json` + `bucket rebuild --substrate context-tree --json`
verbs replacing the removed `bucket context-tree {list, status}`
subgroup.

The load-bearing claim is that the canonical event log
(refs/opentraces/local/events/v1) is the source of truth and the
bucket per-trace envelope under `bucket/traces/v1/<project>/<trace>/`
plus the blob store under `bucket/blobs/v1/<project>/context/` are
rebuildable byte-identically.

Asserts:
  (a) Initial `ctx list --json` reports a non-zero trace_count for
      context-tree-bearing traces.
  (b) After clearing the projection (via the rebuild verb's
      `--clear-projection` test-only flag), `ctx list --json` reports
      `trace_count: 0`.
  (c) `bucket rebuild --substrate context-tree --json` exits 0 and
      reports the count of traces projected + blobs written.
  (d) Post-rebuild `ctx list --json` returns the same trace_count and
      `digest` as the initial state (byte-identical re-projection).
  (e) Re-running the rebuild is idempotent (rebuild.idempotent_noop
      is true on the second run).
  (f) The Git ref refs/opentraces/local/events/v1 head is unchanged
      across all three states (event log is non-destructive).

Fails today because:
  - `bucket rebuild --substrate context-tree` verb signature is being
    extended in Phase B Track B3 (CLI).
  - `ctx list` is a new verb (Phase B Track B3 / Plan 080 §7).
  - The per-trace envelope writer is Phase B Track B1 (bucket_store).

Cross-track dependencies:
  - B1 (bucket_store.py): `bucket/traces/v1/<project>/<trace>/`
    layout + `project_per_trace_exports()` projection function.
  - B3 (cli/bucket.py + cli/ctx.py): `bucket rebuild --substrate`
    flag plumbing + `ctx list --json` envelope shape.
"""
lane = "core"
tier = 1  # PHASE-B: opt-in pending checkpoint c-bucket-spine-v2-multi-trace-mixed.
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-bucket-spine-v2-multi-trace-mixed"]

[preconditions]
min_captured_traces = 1
context_tree_built = true
bucket_spine_v2_layout = true

# ---------------------------------------------------------------------
# Step 1 — initial ctx list; capture trace_count baseline.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-baseline-ctx-list"
argv = ["ctx", "list", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-baseline-ctx-list"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "rebuild-baseline-ctx-list"
path = "context_trees.0.trace_id"

[[assertions]]
kind = "stdout_json"
step = "rebuild-baseline-ctx-list"
path = "context_trees.0.digest"

# ---------------------------------------------------------------------
# Step 2 — capture the canonical event log head BEFORE clearing.
# `bucket status --json` exposes the head; later we re-assert it.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-event-log-head-before"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-event-log-head-before"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "rebuild-event-log-head-before"
path = "bucket.events_v1.last_batch_id"

# ---------------------------------------------------------------------
# Step 3 — clear the projection (rebuild verb with --clear-projection
# test-only flag) and confirm ctx list returns trace_count=0.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-clear-projection"
argv = ["bucket", "rebuild", "--substrate", "context-tree", "--clear-projection", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-clear-projection"
equals = 0

[[steps]]
type = "cli"
id = "rebuild-post-clear-ctx-list"
argv = ["ctx", "list", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-post-clear-ctx-list"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "rebuild-post-clear-ctx-list"
path = "trace_count"
equals = 0

# ---------------------------------------------------------------------
# Step 4 — rerun the rebuild; project the substrate from canonical state.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-substrate-context-tree"
argv = ["bucket", "rebuild", "--substrate", "context-tree", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-substrate-context-tree"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "rebuild-substrate-context-tree"
path = "rebuild.substrate"
equals = "context-tree"

[[assertions]]
kind = "stdout_json"
step = "rebuild-substrate-context-tree"
path = "rebuild.traces_projected"

[[assertions]]
kind = "stdout_json"
step = "rebuild-substrate-context-tree"
path = "rebuild.blobs_written"

# ---------------------------------------------------------------------
# Step 5 — post-rebuild ctx list matches the baseline state.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-post-rebuild-ctx-list"
argv = ["ctx", "list", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-post-rebuild-ctx-list"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "rebuild-post-rebuild-ctx-list"
path = "context_trees.0.digest"

# ---------------------------------------------------------------------
# Step 6 — event log head unchanged (canonical source untouched).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-event-log-head-after"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-event-log-head-after"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "rebuild-event-log-head-after"
path = "bucket.events_v1.last_batch_id"

# ---------------------------------------------------------------------
# Step 7 — second rebuild is idempotent.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-idempotent-second-run"
argv = ["bucket", "rebuild", "--substrate", "context-tree", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-idempotent-second-run"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "rebuild-idempotent-second-run"
path = "rebuild.idempotent_noop"
equals = true
