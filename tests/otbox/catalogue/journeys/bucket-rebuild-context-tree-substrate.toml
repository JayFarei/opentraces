name = "bucket-rebuild-context-tree-substrate"
description = """
Plan 080 mechanism journey (GOLD) — `bucket rebuild --substrate
context-tree` is idempotent and non-destructive against the spine
layout: the canonical event log is the source of truth and the context
blob namespace is rebuildable byte-identically after deletion.

Asserts:
  (a) Baseline `bucket manifest` digest + events_v1 head captured.
  (b) After deleting the whole context blob namespace
      (`bucket/blobs/v1/*/context`), `bucket rebuild --substrate
      context-tree --json` exits 0 and reports traces_projected >= 1 and
      blobs_written >= 1 (the deleted blobs were re-emitted from the
      canonical event log).
  (c) Post-rebuild `bucket manifest` digest is byte-identical to the
      baseline (byte-identical re-projection, Resolution H).
  (d) The events_v1 head is unchanged (the canonical source was strictly
      read-only input).
  (e) A second rebuild reports idempotent_noop == true with
      blobs_written == 0.
  (f) `bucket verify --full` is clean post-rebuild (no dangling refs).

Re-specced for issue #42 (un-quarantine): the authored `--clear-projection`
test-only flag does not exist on `bucket rebuild` — the journey clears
the projection surgically via a shell rm of the context blob namespace
instead, which is the same W-crash recovery shape Resolution G names.
`ctx list` assertions moved to the real `traces[]` envelope key.
PINNED TO THE SINGLE-TRACE ANCHORED WORLD rather than multi-trace-mixed:
`build_context_tree_projection` has a variable-shadowing defect (the
context_tree_reconciled branch rebinds the `trace_id` parameter, so an
unscoped projection silently drops every trace after the first
reconciled one) which makes an unscoped rebuild lossy on multi-trace
worlds — reported as a product defect; this journey pins the correct
single-trace behavior. Out-of-vocab `bucket_spine_v2_layout`
precondition dropped.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-bucket-spine-v2-one-trace-anchored"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — baseline: ctx list sees the trace; manifest digest captured.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-baseline-ctx-list"
argv = ["ctx", "list", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-baseline-ctx-list"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "rebuild-baseline-ctx-list"
path = "traces.0.trace_id"
equals = "{trace_id}"

[[steps]]
type = "cli"
id = "rebuild-baseline-manifest"
argv = ["bucket", "manifest", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-baseline-manifest"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "rebuild-baseline-manifest"
path = "manifest.bucket_digest"

# ---------------------------------------------------------------------
# Step 2 — capture the canonical event log head BEFORE clearing.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-event-log-head-before"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-event-log-head-before"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "rebuild-event-log-head-before"
path = "bucket.events_v1.last_batch_id"

# ---------------------------------------------------------------------
# Step 3 — clear the derived context blob namespace.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "rebuild-clear-projection"
argv = ["bash", "-c", "rm -rf {opentraces_dir}/bucket/blobs/v1/*/context"]

[[assertions]]
kind = "returncode"
step = "rebuild-clear-projection"
equals = 0

# ---------------------------------------------------------------------
# Step 4 — rebuild the substrate from canonical state.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-substrate-context-tree"
argv = ["bucket", "rebuild", "--substrate", "context-tree", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-substrate-context-tree"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "rebuild-substrate-context-tree"
path = "status"
equals = "ok"

[[assertions]]
kind = "stdout_json"
step = "rebuild-substrate-context-tree"
path = "rebuild.substrate"
equals = "context-tree"

[[assertions]]
kind = "stdout_json_greater_equal"
step = "rebuild-substrate-context-tree"
path = "rebuild.traces_projected"
min = 1

# The deleted blobs were re-emitted from the canonical event log.
[[assertions]]
kind = "stdout_json_greater_equal"
step = "rebuild-substrate-context-tree"
path = "rebuild.blobs_written"
min = 1

# ---------------------------------------------------------------------
# Step 5 — post-rebuild manifest digest matches the baseline
# (byte-identical re-projection).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-post-rebuild-manifest"
argv = ["bucket", "manifest", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-post-rebuild-manifest"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "rebuild-post-rebuild-manifest"
path = "manifest.bucket_digest"
equals_var = "rebuild-baseline-manifest:manifest.bucket_digest"

# ---------------------------------------------------------------------
# Step 6 — event log head unchanged (canonical source untouched).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-event-log-head-after"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-event-log-head-after"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "rebuild-event-log-head-after"
path = "bucket.events_v1.last_batch_id"
equals_var = "rebuild-event-log-head-before:bucket.events_v1.last_batch_id"

# ---------------------------------------------------------------------
# Step 7 — second rebuild is idempotent.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-idempotent-second-run"
argv = ["bucket", "rebuild", "--substrate", "context-tree", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-idempotent-second-run"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "rebuild-idempotent-second-run"
path = "rebuild.idempotent_noop"
equals = true

[[assertions]]
kind = "stdout_json"
step = "rebuild-idempotent-second-run"
path = "rebuild.blobs_written"
equals = 0

# ---------------------------------------------------------------------
# Step 8 — verify is clean after the destroy/rebuild cycle.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "rebuild-verify-clean"
argv = ["bucket", "verify", "--full", "--json"]

[[assertions]]
kind = "returncode"
step = "rebuild-verify-clean"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "rebuild-verify-clean"
path = "verify.ok"
equals = true

[[assertions]]
kind = "stdout_json"
step = "rebuild-verify-clean"
path = "verify.dangling_count"
equals = 0
