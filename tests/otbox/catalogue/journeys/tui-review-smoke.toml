name = "tui-review-smoke"
description = """
Legacy TUI startup journey. The raw-trace TUI product surface is
decommissioned until the next dataset-scoped review UI lands, so this
journey is deliberately capability-gated out of the default matrix.

Requires tmux. The tmux step pins the box's isolated HOME explicitly so
a running tmux server cannot leak the developer's real data into the
captured pane.
"""
lane = "extended"
tier = 0
seed = "smoke"
requires = ["cli", "tmux", "decommissioned_ui"]

[[steps]]
type = "tmux"
id = "tui"
kind = "shell"
argv = [
    "{py_bin}",
    "-c",
    "from opentraces.clients.tui import main; main()",
]
settle = 6

[[assertions]]
kind = "stdout_contains"
step = "tui"
value = "Inbox"
