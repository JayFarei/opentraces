name = "build-dataset-lineage-search-empty-state-contract"
description = """
Strategic ★ trajectory (plan 063 §9): the hidden `trail search` command
is the consumer-API for structured lineage lookup — `--trace X`,
`--commit Y`, `--path Z`, or `--survival reverted` all return Patch
Trails. Downstream apps (dashboards, RL data prep, CI gates) pivot off
this projection.

Against a smoke seed with no TrailEvent log yet, the contract MUST be:
rc=0 with a structured JSON envelope describing the limitation
``trail_event_log_unavailable`` and the recommended action — never an
opaque traceback or rc!=0. Downstream consumers parse the limitations
vocabulary and decide whether to retry, surface a warning, or fall
through to a different evidence source.
"""
lane = "core"
tier = 0
seed = "smoke"
trajectories = ["build-dataset-from-lineage"]
persona = "agent"
requires = ["cli", "git"]

[[steps]]
type = "cli"
id = "search-by-trace"
argv = ["trail", "search", "--trace", "otbox000000000000", "--json"]

[[assertions]]
kind = "returncode"
step = "search-by-trace"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "search-by-trace"
path = "event_log_ref"
equals = "refs/opentraces/local/events/v1"

[[assertions]]
kind = "stdout_contains"
step = "search-by-trace"
value = "trail_event_log_unavailable"

[[assertions]]
kind = "stdout_contains"
step = "search-by-trace"
value = "recommended_action"
