name = "context-tree-ctx-show-bounded-default"
description = """
Plan 077 CLI-specific journey — default `ctx show` text output never
dumps layer content into the terminal; `--full` opts into the
unbounded variant.

This is the human-ergonomics gate: a session with a large messages
layer (the compacted corpus's layer is >8KB by construction) must
not destroy the operator's scrollback by default (R12).

Issue #42 re-spec deltas from the plan-077 draft: the SHIPPED
default `ctx show` is STRICTLY STRONGER than the draft's
truncate-with-marker design — it never prints layer content at all
(content rendering is exclusively behind `--full`), so the draft's
"truncated" / "end of node" marker asserts have no referent. The
re-specced properties:

  (a) Default text renders the four-layer summary (the `messages`
      header line) but NOT the layer content — asserted via a
      pinned fixture needle (`user-otbox-ctx-compacted-pre-1-a-prompt`,
      a uuid that exists only inside the messages layer content)
      being ABSENT from default output.
  (b) The JSON envelope is unaffected by the text budget: the
      messages layer reports its full `byte_count` (>= 8192).
  (c) `--full` renders the content: the same needle IS present.

Precondition note: the draft's 65536-byte floor served the
abandoned truncation-marker property; 8192 still proves the layer
content is far beyond the 4096-byte text budget while matching
what the deterministic compacted corpus actually produces (~9.4KB).

Forks from `c-compacted-session` (issue #42).
"""
lane = "core"
tier = 0
tier_label = "silver"
trajectories = ["context-tree-cli"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-compacted-session"]

[preconditions]
min_captured_traces = 1
context_tree_built = true
requires_messages_layer_bytes_min = 8192

# ---------------------------------------------------------------------
# Step 1 — default text output. The four-layer summary renders; the
# layer CONTENT does not (the load-bearing bounded-by-default claim).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "show-default"
argv = ["ctx", "show", "{large_messages_node_id}"]

[[assertions]]
kind = "returncode"
step = "show-default"
equals = 0

# The four-layer summary table is present.
[[assertions]]
kind = "stdout_contains"
step = "show-default"
value = "messages"

[[assertions]]
kind = "stdout_contains"
step = "show-default"
value = "Layers:"

# Contract (a) — a uuid that exists ONLY inside the messages layer
# content must not leak into default text output.
[[assertions]]
kind = "stdout_not_contains"
step = "show-default"
value = "user-otbox-ctx-compacted-pre-1-a-prompt"

# ---------------------------------------------------------------------
# Step 2 — JSON envelope is always full. The text budget is strictly
# a text-mode concern; consumers reading JSON get the real layer
# metadata regardless, including the full byte_count.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "show-json"
argv = ["ctx", "show", "{large_messages_node_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "show-json"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "show-json"
path = "schema_version"
equals = "opentraces.context_tree.v1"

# (Issue #42 reconciliation: the shipped envelope carries layer ids
# under `layers.<type>.layer_id`, not on the `node` object.)
[[assertions]]
kind = "stdout_json"
step = "show-json"
path = "layers.messages.layer_id"

# Contract (b) — the messages layer really is large (>= the 8192
# precondition floor), so contract (a) above proved bounding, not
# small content.
[[assertions]]
kind = "stdout_json_greater_equal"
step = "show-json"
path = "layers.messages.byte_count"
min = 8192

# ---------------------------------------------------------------------
# Step 3 — `--full` opts into the unbounded text variant: the layer
# content (including the pinned needle uuid) renders.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "show-full"
argv = ["ctx", "show", "{large_messages_node_id}", "--full"]

[[assertions]]
kind = "returncode"
step = "show-full"
equals = 0

# Contract (c) — the needle absent from default output is present
# under --full.
[[assertions]]
kind = "stdout_contains"
step = "show-full"
value = "user-otbox-ctx-compacted-pre-1-a-prompt"
