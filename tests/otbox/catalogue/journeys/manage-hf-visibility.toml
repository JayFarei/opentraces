name = "manage-hf-visibility"
description = """
Flip HF dataset visibility (plan 063 §1: `manage-hf-visibility`).
`dataset remote visibility` toggles private↔public after internal
review. This journey asserts the help surface documents the expected
flags.
"""
lane = "core"
tier = 0
seed = "smoke"
trajectories = ["manage-hf-visibility"]
