name = "pi-security-sanitize-captured-content"
description = "Plan 091 Pi security checkpoint flows through shared bucket verification."
lane = "core"
tier = 0
tier_label = "gold"
persona = "agent"
requires = ["cli", "git"]
status = "synthetic-or-artifact-backed"
from_checkpoints = ["c-captured-pi-security-session"]

[preconditions]
min_captured_traces = 1
context_tree_built = true
requires_security_findings = true

[[steps]]
type = "cli"
id = "trace-get"
argv = ["trace", "get", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "bucket-verify"
argv = ["bucket", "verify", "--full", "--json"]

# The redaction MECHANISM (regex/entropy/... over the spine AND the
# metadata.pi.{provider_contexts,branch_summaries,tool_registry,runtime_state,
# tree_events} aggregates) is unit-tested in tests/security/test_pipeline_api.py.
# The synthetic checkpoint carries no live secret, so this journey verifies the
# end-to-end invariant: a Pi trace that ran through the security pipeline at
# ingest is retrievable and lands intact in a verifiable shared bucket.
[[assertions]]
kind = "returncode"
step = "trace-get"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "trace-get"
path = "status"
equals = "ok"

[[assertions]]
kind = "stdout_json"
step = "trace-get"
path = "trace.agent.name"
equals = "pi"

[[assertions]]
kind = "returncode"
step = "bucket-verify"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "bucket-verify"
path = "ok"
equals = true

[[assertions]]
kind = "stdout_json"
step = "bucket-verify"
path = "verify.dangling_count"
equals = 0
