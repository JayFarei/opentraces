name = "attribution-backfill"
description = """
Attribution backfill (plan 063 §1: `attribution-backfill`): `backfill`
re-attributes commits to traces and writes the per-line attribution
cache; `git-backfill` retro-correlates inbox traces to past commits
the post-commit hook missed. Against a world-seeded project with two
commits + the post-commit hook installed, both commands must succeed.
"""
lane = "core"
tier = 0
seed = "world"
trajectories = ["attribution-backfill"]
persona = "agent"
requires = ["cli", "git"]

[[steps]]
type = "cli"
id = "backfill"
argv = ["backfill"]

[[steps]]
type = "cli"
id = "git-backfill"
argv = ["git-backfill", "--help"]

[[assertions]]
kind = "returncode"
step = "backfill"
equals = 0

[[assertions]]
kind = "stdout_contains"
step = "git-backfill"
value = "Retroactively"
