name = "bucket-self-sufficient-everything"
description = """
Plan 080 LOAD-BEARING cross-cutting journey (GOLD) — every read verb
works against a bucket-only fixture, with no Git ref access.

Per Plan 080 §13 (Bucket self-sufficiency proof). This is the
conviction artifact for the self-sufficiency principle: the proof we
can hand to cloud workers and dataset consumers — "yes, the bucket
has everything."

Setup (provided by the checkpoint c-bucket-spine-v2-bucket-only):
  1. Capture a session on machine A => produces:
     - bucket/traces/v1/<project>/<trace>/...
     - bucket/blobs/v1/<project>/...
     - bucket/events/v1/batches/...
     - bucket/manifest.json
     - refs/opentraces/local/events/v1 (Git ref)
  2. Snapshot the bucket directory ONLY (drop the Git ref / repo).
  3. Restore on the box-B persona (bucket-only, no
     .git/refs/opentraces). Checkpoint identity:
     `c-bucket-spine-v2-bucket-only`.

Asserts (every one of these passes against bucket-only fixture):
  - opentraces trace get <trace> --json => identical TraceRecord.
  - opentraces trace query <keyword> => finds the trace.
  - opentraces ctx tree <trace> --json => identical projection.
  - opentraces ctx list --json => trace appears.
  - opentraces ctx info <trace> --json => identical summary.
  - opentraces ctx reads <trace> --json => identical I/O history.
  - opentraces ctx writes <trace> --json => identical I/O history.
  - opentraces ctx anchor-for-step <trace>:<step> --json => identical
    anchor lookup.
  - opentraces trail blame commit <sha> --bucket-only --json => finds
    the patches.
  - opentraces trail graph --json => identical graph.
  - opentraces trail track <patch> --json => identical survival state
    (from patch_survival_cached events in trail.jsonl.gz).
  - opentraces trail timeline <trace> --json => identical timeline.
  - opentraces bucket status --json => reports bucket as
    self-sufficient (bucket.self_sufficiency.ok == true).
  - opentraces bucket verify --json => no dangling refs, no
    integrity errors.
  - opentraces bucket replay --repo <fresh-repo> --json => reconstructs
    Git ref byte-identically from events/v1/batches/.

Test PASSES if all 15+ commands return ok against bucket-only fixture
vs the full local environment.

Fails today because:
  - The bucket-only checkpoint `c-bucket-spine-v2-bucket-only` is
    Phase B Track B4 follow-up.
  - Self-sufficiency markers in `bucket status --json`
    (`bucket.self_sufficiency.ok`) are Phase B Track B3 wiring.
  - `bucket verify` is a new verb (Phase B Track B3).
  - `bucket replay --repo` over the events/v1 mirror is Phase B
    Track B1 (sync_events_mirror rewrite).

Cross-track dependencies:
  - B1: full Plan-080 layout with events/v1/batches/ mirror.
  - B2: pull contract preserving the bucket's self-sufficiency.
  - B3: read-verb wiring against bucket-only sources; bucket status
    surfacing self-sufficiency check.
"""
lane = "core"
tier = 1  # PHASE-B: opt-in pending checkpoint c-bucket-spine-v2-bucket-only.
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-bucket-only"]

[preconditions]
min_captured_traces = 1
bucket_spine_v2_layout = true
bucket_only_no_git_ref = true

# ---------------------------------------------------------------------
# Step 1 — bucket status reports self-sufficiency.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "bucket-status-self-sufficient"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-status-self-sufficient"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "bucket-status-self-sufficient"
path = "bucket.self_sufficiency.ok"
equals = true

[[assertions]]
kind = "stdout_json"
step = "bucket-status-self-sufficient"
path = "bucket.self_sufficiency.git_ref_present"
equals = false

# ---------------------------------------------------------------------
# Step 2 — trace get works without Git ref.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "trace-get-no-git"
argv = ["trace", "get", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "trace-get-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "trace-get-no-git"
path = "trace_id"
equals = "{trace_id}"

# ---------------------------------------------------------------------
# Step 3 — trace query works (index built from bucket/traces/v1/).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "trace-query-no-git"
argv = ["trace", "query", "{query_keyword}", "--json"]

[[assertions]]
kind = "returncode"
step = "trace-query-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "trace-query-no-git"
path = "candidates.0.trace_id"

# ---------------------------------------------------------------------
# Step 4 — ctx list works (reads manifest.json only; no blob loads).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-list-no-git"
argv = ["ctx", "list", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-list-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-list-no-git"
path = "context_trees.0.trace_id"

# ---------------------------------------------------------------------
# Step 5 — ctx info works (reads trace.json + context.jsonl.gz).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-info-no-git"
argv = ["ctx", "info", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-info-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-info-no-git"
path = "head.trace_id"
equals = "{trace_id}"

# ---------------------------------------------------------------------
# Step 6 — ctx tree (projection over context.jsonl.gz).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-tree-no-git"
argv = ["ctx", "tree", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-tree-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-tree-no-git"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "ctx-tree-no-git"
path = "nodes.0.node_id"

# ---------------------------------------------------------------------
# Step 7 — ctx reads (read I/O history from trail.jsonl.gz).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-reads-no-git"
argv = ["ctx", "reads", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-reads-no-git"
equals = 0

# ---------------------------------------------------------------------
# Step 8 — ctx writes (write I/O history from trail.jsonl.gz).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-writes-no-git"
argv = ["ctx", "writes", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-writes-no-git"
equals = 0

# ---------------------------------------------------------------------
# Step 9 — trail blame commit works against trail.jsonl.gz.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "trail-blame-commit-no-git"
argv = ["trail", "blame", "commit", "{commit_sha}", "--bucket-only", "--json"]

[[assertions]]
kind = "returncode"
step = "trail-blame-commit-no-git"
equals = 0

# ---------------------------------------------------------------------
# Step 10 — trail track uses patch_survival_cached events.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "trail-track-no-git"
argv = ["trail", "track", "{patch_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "trail-track-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "trail-track-no-git"
path = "survival_state"

# ---------------------------------------------------------------------
# Step 11 — bucket verify reports clean.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "bucket-verify-no-git"
argv = ["bucket", "verify", "--sample", "10", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-verify-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "bucket-verify-no-git"
path = "verify.ok"
equals = true

[[assertions]]
kind = "stdout_json"
step = "bucket-verify-no-git"
path = "verify.dangling_refs_count"
equals = 0

# ---------------------------------------------------------------------
# Step 12 — bucket replay reconstructs the Git ref byte-identically
# from bucket/events/v1/batches/.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "bucket-replay-from-events-mirror"
argv = ["bucket", "replay", "--repo", "/tmp/otbox-replay-target-{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-replay-from-events-mirror"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "bucket-replay-from-events-mirror"
path = "replay.status"
equals = "ok"

[[assertions]]
kind = "stdout_json"
step = "bucket-replay-from-events-mirror"
path = "replay.bytes_identical"
equals = true
