name = "bucket-self-sufficient-everything"
description = """
Plan 080 LOAD-BEARING cross-cutting journey (GOLD) — the bucket read
surface works against a world whose project Git repo (and with it the
canonical `refs/opentraces/local/events/v1` ref) is GONE.

Per Plan 080 §13 (Bucket self-sufficiency proof): the conviction
artifact for cloud workers and dataset consumers — "yes, the bucket has
everything."

Setup (c-bucket-spine-v2-bucket-only): the anchored world with the
project's `.git` removed entirely.

Asserts (each against the no-Git world):
  - the project .git is really gone (path_not_exists).
  - `bucket status --json`: summary v2 (count, not enumeration; #97).
  - `bucket manifest --json`: the full per-trace listing is enumerated here.
  - `trace get <trace> --json`: the TraceRecord spine resolves.
  - `trace query farewell --json`: discovery still works.
  - `ctx list --json` + `ctx info <trace> --json`: context summaries
    resolve from the manifest with no Git access.
  - `bucket verify --full`: no dangling refs, no integrity errors.
  - `bucket replay --repo <fresh-repo>`: reconstructs the canonical
    Git ref from `bucket/events/v1/batches/` alone (state imported),
    a second replay confirms content identity (state current), and
    `ctx tree --project <fresh-repo>` projects the Context Tree from
    the reconstructed ref.

Re-specced for issue #42 (un-quarantine): `bucket.self_sufficiency.*`
and `trail blame commit --bucket-only` were never implemented;
`trail track {patch_id}` had no template-var producer; `ctx tree/reads/
writes` against the LIVE project are event-log readers and cannot
answer without `.git` (the bucket-backed arm is proven through the
replay + `ctx tree --project <replayed-repo>` chain instead — which is
the §13 claim stated operationally). `{query_keyword}` had no producer
and is pinned to the corpus's deterministic "farewell" token.
Out-of-vocab `bucket_spine_v2_layout` / `bucket_only_no_git_ref`
precondition keys dropped.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-bucket-spine-v2-bucket-only"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 0 — the Git side is really gone.
# ---------------------------------------------------------------------
[[assertions]]
kind = "path_not_exists"
path = "{project}/.git"

# ---------------------------------------------------------------------
# Step 1 — bucket status: summary v2 (count, not enumeration), no Git.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "bucket-status-no-git"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-status-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "bucket-status-no-git"
path = "bucket.schema_version"
equals = "opentraces.bucket.manifest.v2"

# Issue #97 — status is summary-only; assert the count, not the enumeration.
[[assertions]]
kind = "stdout_json_greater_equal"
step = "bucket-status-no-git"
path = "bucket.trace_count"
min = 1

# ---------------------------------------------------------------------
# Step 1b — bucket manifest: the FULL per-trace listing lives here (#97).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "bucket-manifest-no-git"
argv = ["bucket", "manifest", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-manifest-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "bucket-manifest-no-git"
path = "manifest.traces.0.trace_id"
equals = "{trace_id}"

# ---------------------------------------------------------------------
# Step 2 — trace get works without the Git ref.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "trace-get-no-git"
argv = ["trace", "get", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "trace-get-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "trace-get-no-git"
path = "trace.trace_id"
equals = "{trace_id}"

# ---------------------------------------------------------------------
# Step 3 — discovery works (the corpus's deterministic keyword).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "trace-query-no-git"
argv = ["trace", "query", "farewell", "--json"]

[[assertions]]
kind = "returncode"
step = "trace-query-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "trace-query-no-git"
path = "candidates.0.trace_id"
equals = "{trace_id}"

# ---------------------------------------------------------------------
# Step 4 — ctx list + ctx info (manifest-driven, no Git).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-list-no-git"
argv = ["ctx", "list", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-list-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-list-no-git"
path = "traces.0.trace_id"
equals = "{trace_id}"

[[steps]]
type = "cli"
id = "ctx-info-no-git"
argv = ["ctx", "info", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-info-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-info-no-git"
path = "info.trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "ctx-info-no-git"
path = "info.files.has_context"
equals = true

# ---------------------------------------------------------------------
# Step 5 — bucket verify reports clean.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "bucket-verify-no-git"
argv = ["bucket", "verify", "--full", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-verify-no-git"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "bucket-verify-no-git"
path = "verify.ok"
equals = true

[[assertions]]
kind = "stdout_json"
step = "bucket-verify-no-git"
path = "verify.dangling_count"
equals = 0

# ---------------------------------------------------------------------
# Step 6 — bucket replay reconstructs the canonical Git ref from
# bucket/events/v1/batches/ with no access to the writer's .git.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "prepare-replay-target"
argv = ["bash", "-c", "mkdir -p {home}/replay-target && git -C {home}/replay-target init -q"]

[[assertions]]
kind = "returncode"
step = "prepare-replay-target"
equals = 0

[[steps]]
type = "cli"
id = "bucket-replay-from-events-mirror"
argv = ["bucket", "replay", "--repo", "{home}/replay-target", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-replay-from-events-mirror"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "bucket-replay-from-events-mirror"
path = "status"
equals = "ok"

[[assertions]]
kind = "stdout_json"
step = "bucket-replay-from-events-mirror"
path = "replay.state"
equals = "imported"

[[assertions]]
kind = "stdout_json_greater_equal"
step = "bucket-replay-from-events-mirror"
path = "replay.events_imported"
min = 1

# Content identity: a second replay finds the exact event-id stream.
[[steps]]
type = "cli"
id = "bucket-replay-idempotent"
argv = ["bucket", "replay", "--repo", "{home}/replay-target", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-replay-idempotent"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "bucket-replay-idempotent"
path = "replay.state"
equals = "current"

[[assertions]]
kind = "stdout_json"
step = "bucket-replay-idempotent"
path = "replay.events_imported"
equals = 0

# ---------------------------------------------------------------------
# Step 7 — the reconstructed ref answers Context Tree reads: the
# bucket really did carry everything.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-tree-from-replayed-ref"
argv = ["ctx", "tree", "{trace_id}", "--project", "{home}/replay-target", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-tree-from-replayed-ref"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-tree-from-replayed-ref"
path = "trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "ctx-tree-from-replayed-ref"
path = "nodes.0.node_id"
