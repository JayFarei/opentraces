name = "bucket-write-order-discipline-local"
description = """
Plan 080 Phase C mechanism journey (GOLD) — local writer respects
the write order discipline; crash-injection between blob write and
event-log append leaves a recoverable state, NOT a corrupt one.

Per Plan 080 §20 Resolution G (Crash recovery matrix, row W1):
  > W1 between blob written and event appended:
  >   Blob on disk; no event references it.
  > Recovery:
  >   `bucket prune` reachability sweep walks event log, builds
  >   reachable-layer-id set, deletes blobs not in set.

The load-bearing claim is that the bucket writer is atomic at the
event boundary: a blob without an event reference is an orphan and
gets cleaned by `bucket prune`, but the canonical event log + the
per-trace envelope are never left in a corrupt or partially-consistent
state.

Setup (provided by the checkpoint c-bucket-spine-v2-crash-injected-w1):
  1. Capture a session that lands N blobs + N corresponding events.
  2. Inject one extra orphan blob: write a synthetic
     `bucket/blobs/v1/<project>/context/<hh>/<orphan-hash>.json.gz`
     containing a deterministic payload whose `layer_id` matches the
     filename hash, but DON'T append any event referencing it.
  3. (No corruption of the canonical event log; the orphan is purely
     extra disk content.)

Asserts:
  (a) Pre-prune `bucket status --json` reports the blob namespace
      contains the orphan (unique_blob_count includes it).
  (b) `bucket verify --json` reports `verify.orphan_blob_count: 1`
      (verify never mutates; it just reports).
  (c) `bucket prune --json` exits 0 and reports
      `prune.orphan_blobs_deleted >= 1`.
  (d) Post-prune `bucket verify --json` reports
      `verify.orphan_blob_count: 0`.
  (e) The canonical event log head (`bucket.events_v1.last_batch_id`)
      is UNCHANGED across the prune; only orphan blob FILES are
      removed.
  (f) The per-trace envelope (`trace.json` digest) is UNCHANGED across
      the prune.

Fails today because:
  - `bucket prune` reachability sweep is Phase C Track C1 (bucket_store).
  - `bucket verify --json` is a new verb (Phase B Track B3).
  - The crash-injection checkpoint `c-bucket-spine-v2-crash-injected-w1`
    is a Phase C test-fixture follow-up (otbox checkpoints/).

Cross-track dependencies:
  - C1: `bucket_store.prune_orphan_blobs()` walks `bucket/events/v1/`
    + per-trace envelopes to compute the reachable set; deletes
    everything else under `bucket/blobs/v1/<project>/context/`.
  - B3: `bucket prune` + `bucket verify` CLI plumbing.
  - Phase C otbox: `c-bucket-spine-v2-crash-injected-w1` checkpoint
    factory.
"""
lane = "core"
tier = 1  # PHASE-C: opt-in pending checkpoint c-bucket-spine-v2-crash-injected-w1.
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-crash-injected-w1"]

[preconditions]
min_captured_traces = 1
bucket_spine_v2_layout = true
context_tree_built = true
orphan_blob_injected = true

# ---------------------------------------------------------------------
# Step 1 — capture pre-prune state: event log head, blob namespace
# size, and orphan count from verify.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "write-order-pre-prune-status"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "write-order-pre-prune-status"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "write-order-pre-prune-status"
path = "bucket.events_v1.last_batch_id"

[[assertions]]
kind = "stdout_json"
step = "write-order-pre-prune-status"
path = "bucket.blobs_v1.context.unique_blob_count"

# ---------------------------------------------------------------------
# Step 2 — verify reports the orphan WITHOUT mutating.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "write-order-pre-prune-verify"
argv = ["bucket", "verify", "--full", "--json"]

[[assertions]]
kind = "returncode"
step = "write-order-pre-prune-verify"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "write-order-pre-prune-verify"
path = "verify.orphan_blob_count"

# Verify is non-mutating: orphan COUNT is reported, NOT zero.
[[assertions]]
kind = "stdout_json"
step = "write-order-pre-prune-verify"
path = "verify.dangling_refs_count"
equals = 0

# ---------------------------------------------------------------------
# Step 3 — `bucket prune` deletes the orphan blob.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "write-order-prune-orphan"
argv = ["bucket", "prune", "--json"]

[[assertions]]
kind = "returncode"
step = "write-order-prune-orphan"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "write-order-prune-orphan"
path = "prune.orphan_blobs_deleted"

# ---------------------------------------------------------------------
# Step 4 — post-prune verify reports 0 orphans.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "write-order-post-prune-verify"
argv = ["bucket", "verify", "--full", "--json"]

[[assertions]]
kind = "returncode"
step = "write-order-post-prune-verify"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "write-order-post-prune-verify"
path = "verify.orphan_blob_count"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "write-order-post-prune-verify"
path = "verify.ok"
equals = true

# ---------------------------------------------------------------------
# Step 5 — event log head + per-trace envelope unchanged (prune only
# touched orphan blob files).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "write-order-post-prune-status"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "write-order-post-prune-status"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "write-order-post-prune-status"
path = "bucket.events_v1.last_batch_id"

# Per-trace envelope digest unchanged.
[[steps]]
type = "cli"
id = "write-order-trace-digest-unchanged"
argv = ["trace", "get", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "write-order-trace-digest-unchanged"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "write-order-trace-digest-unchanged"
path = "trace_id"
equals = "{trace_id}"
