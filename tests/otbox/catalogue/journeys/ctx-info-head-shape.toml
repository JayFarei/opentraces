name = "ctx-info-head-shape"
description = """
Plan 080 mechanism journey (GOLD) — the per-trace `ctx info <trace>
--json` envelope shape (replacing Plan 079's
`bucket context-tree show <trace> --json`).

Per Plan 080 §7 (CLI consumption — ctx group): `ctx info <trace> --json`
reads `bucket/manifest.json` (no blob loads) and surfaces the per-trace
summary slice relevant to the Context Tree substrate.

Asserts:
  (a) The envelope is schema-stamped `opentraces.ctx.info.v2` and the
      `info` block carries project_slug, trace_id, lifecycle, trace_path,
      the summary counters (step/patch/anchored/node counts), the files
      flags, and the per-trace digest.
  (b) The privacy default is preserved: `info.remote_sync_eligible ==
      false` (Plan 079 R8 through Plan 080).
  (c) `info.files.has_context == true` (the context companion exists).
  (d) `info.digest` is byte-stable across calls (deterministic
      projection, equals_var).

Re-specced for issue #42 (un-quarantine): the journey was authored
against an aspirational `head.*` envelope (layer_refs, blob_scope,
event_log_head, remote_sync.blocked_reasons, ...) that the shipped
`ctx info` verb does not emit — the real envelope is
`{schema_version: "opentraces.ctx.info.v2", info: {...}}` and
`remote_sync_eligible` is a flat boolean. Assertions were rewired to the
shipped shape; blob_scope / layer_refs / event_log_head surfacing is a
product follow-up, not a journey concern. Out-of-vocab
`bucket_spine_v2_layout` precondition dropped.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-bucket-spine-v2-one-trace-provisional"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — ctx info for the canonical checkpoint trace.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-info-head-shape"
argv = ["ctx", "info", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-info-head-shape"
equals = 0

# Envelope schema stamp.
[[assertions]]
kind = "stdout_json"
step = "ctx-info-head-shape"
path = "schema_version"
equals = "opentraces.ctx.info.v2"

[[assertions]]
kind = "stdout_json"
step = "ctx-info-head-shape"
path = "info.project_slug"

[[assertions]]
kind = "stdout_json"
step = "ctx-info-head-shape"
path = "info.trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "ctx-info-head-shape"
path = "info.lifecycle"

[[assertions]]
kind = "stdout_json"
step = "ctx-info-head-shape"
path = "info.trace_path"

[[assertions]]
kind = "stdout_json"
step = "ctx-info-head-shape"
path = "info.summary.step_count"

[[assertions]]
kind = "stdout_json"
step = "ctx-info-head-shape"
path = "info.summary.patch_count"

[[assertions]]
kind = "stdout_json"
step = "ctx-info-head-shape"
path = "info.summary.anchored_count"

[[assertions]]
kind = "stdout_json"
step = "ctx-info-head-shape"
path = "info.summary.node_count"

# Key presence (capture_methods may be empty on the JSONL path).
[[assertions]]
kind = "stdout_json"
step = "ctx-info-head-shape"
path = "info.summary.capture_methods"

# Context companion present.
[[assertions]]
kind = "stdout_json"
step = "ctx-info-head-shape"
path = "info.files.has_context"
equals = true

# Privacy default is gate-closed.
[[assertions]]
kind = "stdout_json"
step = "ctx-info-head-shape"
path = "info.remote_sync_eligible"
equals = false

[[assertions]]
kind = "stdout_json"
step = "ctx-info-head-shape"
path = "info.digest"

# ---------------------------------------------------------------------
# Step 2 — re-running ctx info is byte-stable (deterministic digest).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-info-stable"
argv = ["ctx", "info", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-info-stable"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-info-stable"
path = "info.digest"
equals_var = "ctx-info-head-shape:info.digest"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-info-stable"
path = "info"
equals_var = "ctx-info-head-shape:info"
