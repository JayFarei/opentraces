name = "bucket-compression-integrity-roundtrip"
description = """
Plan 080 Phase C mechanism journey (GOLD) — gzip compression on layer
blobs + per-trace JSONL is content-preserving and deterministic.

Per Plan 080 §5 (Selective gzip) + §20 Resolution H (deterministic
projection contract: `gzip.compress(data, mtime=0, compresslevel=6)`).

Asserts:
  (a) `ctx step <trace> 0 --json` resolves the trace's root ContextNode
      with all four layer ids populated (the content-addressed refs the
      blob namespace is keyed by).
  (b) `bucket verify --full --json` decompresses EVERY context blob and
      re-asserts the payload's layer_id echoes the path-encoded hash:
      ok=true, blobs_checked >= 1, dangling_count == 0 (a corrupt gzip
      envelope or hash drift would surface as blob_content errors).
  (c) Re-reading the same node returns byte-identical layer ids across
      calls (no rewrite churn; equals_var).

Re-specced for issue #42 (un-quarantine): the journey was authored
against a `verify.compression_check.{ok,hash_mismatches,
decompression_errors}` sub-envelope and per-layer `blob_path` keys that
were never implemented — the shipped verify primitive reports the same
round-trip through `{ok, blobs_checked, errors[], dangling_count}` (a
decompression failure or hash mismatch lands in errors[] with kind
"blob_content" and flips ok/rc). The `{first_context_node_id}` template
var had no producer; the node is addressed via `ctx step <trace> 0`.
Out-of-vocab `bucket_spine_v2_layout` precondition dropped.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-one-trace-anchored"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — ctx step resolves the root node + its four layer refs.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-step-blob-roundtrip-baseline"
argv = ["ctx", "step", "{trace_id}", "0", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-step-blob-roundtrip-baseline"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-step-blob-roundtrip-baseline"
path = "node_id"

[[assertions]]
kind = "stdout_json"
step = "ctx-step-blob-roundtrip-baseline"
path = "layers.system.layer_id"

[[assertions]]
kind = "stdout_json"
step = "ctx-step-blob-roundtrip-baseline"
path = "layers.messages.layer_id"

[[assertions]]
kind = "stdout_json"
step = "ctx-step-blob-roundtrip-baseline"
path = "layers.tool_registry.layer_id"

[[assertions]]
kind = "stdout_json"
step = "ctx-step-blob-roundtrip-baseline"
path = "layers.runtime_state.layer_id"

# ---------------------------------------------------------------------
# Step 2 — bucket verify runs the gzip round-trip against every
# reachable blob and reports clean.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "bucket-verify-compression-roundtrip"
argv = ["bucket", "verify", "--full", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-verify-compression-roundtrip"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "bucket-verify-compression-roundtrip"
path = "verify.ok"
equals = true

[[assertions]]
kind = "stdout_json"
step = "bucket-verify-compression-roundtrip"
path = "verify.full"
equals = true

# Verify path enumerated a non-zero blob count (the round-trip ran).
[[assertions]]
kind = "stdout_json_greater_equal"
step = "bucket-verify-compression-roundtrip"
path = "verify.blobs_checked"
min = 1

# Zero referenced-but-missing blobs.
[[assertions]]
kind = "stdout_json"
step = "bucket-verify-compression-roundtrip"
path = "verify.dangling_count"
equals = 0

# Zero errors of any kind (blob_content / dangling / manifest).
[[assertions]]
kind = "stdout_json_length_equals"
step = "bucket-verify-compression-roundtrip"
path = "verify.errors"
equals = 0

# ---------------------------------------------------------------------
# Step 3 — re-running ctx step returns the same layer ids
# (proves the read path is stable; no rewrite churn).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-step-blob-roundtrip-stable"
argv = ["ctx", "step", "{trace_id}", "0", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-step-blob-roundtrip-stable"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-step-blob-roundtrip-stable"
path = "layers.system.layer_id"
equals_var = "ctx-step-blob-roundtrip-baseline:layers.system.layer_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-step-blob-roundtrip-stable"
path = "layers.messages.layer_id"
equals_var = "ctx-step-blob-roundtrip-baseline:layers.messages.layer_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-step-blob-roundtrip-stable"
path = "layers.tool_registry.layer_id"
equals_var = "ctx-step-blob-roundtrip-baseline:layers.tool_registry.layer_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-step-blob-roundtrip-stable"
path = "layers.runtime_state.layer_id"
equals_var = "ctx-step-blob-roundtrip-baseline:layers.runtime_state.layer_id"
