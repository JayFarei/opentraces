name = "context-tree-branching-fidelity"
description = """
Plan 077 substrate-fidelity journey #4 (gold) — the JSONL's
parentUuid tree (rewinds, sub-agents) is captured directly and
projected as orphan + child subtrees alongside the active path.

The Context Tree substrate models the JSONL branching directly
(R4): linear chain by default, sibling branch on Esc Esc rewind,
child fork on subagent spawn. Active-path computation, orphan-
branch tracking, and subagent linkage are the new mechanics this
substrate introduces (none of them exist in Trail).

Forks from `c-rewound-session` (issue #42: the substrate world
with the journey-facing {trace_id} re-pinned to the REWOUND trace,
whose corpus has exactly ONE Esc-Esc orphan branch and ZERO
subagents) and asserts two property families:

  Rewound branch (on {trace_id}, the rewound trace):
    (a) exactly 1 orphan branch root, and walking `--leaf` from
        the orphan LEAF returns a path of >= 2 nodes (root + the
        rewind continuation — an orphan with only its root
        captured would mean we missed the rewind's continuation).
    (b) the orphan leaf's `branch_type` is `rewind_branch` with
        all four layer references populated (full hashes, not
        stubs).

  Subagent linkage (on {subagent_trace_id}, the sibling subagent
  corpus — issue #42 re-spec: the plan-077 draft asserted
  subagent properties against the rewound trace, but the rewound
  fixture's meta.json pins expected_subagent_session_count = 0;
  the linkage lives on the subagent trace):
    (c) the subagent trace's `subagent_session_ids` includes the
        spawned child session (`{subagent_session_ids_expected}`
        from the checkpoint audit).
    (d) the `subagent_fork` node resolves via `ctx show` with the
        child session id and full layer hashes.

Issue #42 re-spec deltas from the plan-077 draft: `ctx show`
emits `opentraces.context_tree.v1` (not the draft
`context_node.v1`); layer ids live under `layers.<type>.layer_id`
(not on the `node` object); the orphan walk addresses the orphan
LEAF (walking `--leaf <orphan_root>` would just re-walk the main
line); the draft's `active_path` payload key is `nodes`.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["context-tree-branching"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-rewound-session"]

[preconditions]
min_captured_traces = 1
context_tree_built = true
requires_branch_types = ["rewind_branch"]

# ---------------------------------------------------------------------
# Step 1 — tree shape with --show-orphans surfaces orphan_branch_roots
# next to active_leaf_id.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "tree-with-orphans"
argv = ["ctx", "tree", "{trace_id}", "--show-orphans", "--json"]

[[assertions]]
kind = "returncode"
step = "tree-with-orphans"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "tree-with-orphans"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "tree-with-orphans"
path = "trace_id"
equals = "{trace_id}"

# Exactly one orphan branch root (the Esc Esc rewind's pre-rewind
# tip). The fixture pins exactly one orphan branch.
[[assertions]]
kind = "stdout_json_length_equals"
step = "tree-with-orphans"
path = "orphan_branch_roots"
equals = 1

[[assertions]]
kind = "stdout_json"
step = "tree-with-orphans"
path = "orphan_branch_roots.0"
equals = "{orphan_root_node_id}"

# Active path is non-empty.
[[assertions]]
kind = "stdout_json"
step = "tree-with-orphans"
path = "active_leaf_id"

# Zero subagents on the REWOUND trace (the corpus's meta.json pins
# expected_subagent_session_count = 0 — honest negative space).
[[assertions]]
kind = "stdout_json_length_equals"
step = "tree-with-orphans"
path = "subagent_session_ids"
equals = 0

# ---------------------------------------------------------------------
# Step 2 — walk the orphan subtree from its LEAF. The `--leaf` flag
# walks leaf -> parents -> root; property (a): the path includes
# both orphan nodes (>= 2 entries, the second being non-root).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "orphan-subtree"
argv = ["ctx", "tree", "{trace_id}", "--leaf", "{orphan_leaf_node_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "orphan-subtree"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "orphan-subtree"
path = "schema_version"
equals = "opentraces.context_tree.v1"

# Property (a) — the walk reaches the orphan leaf through >= 2 nodes.
[[assertions]]
kind = "stdout_json"
step = "orphan-subtree"
path = "nodes.1.node_id"

[[assertions]]
kind = "stdout_json"
step = "orphan-subtree"
path = "active_leaf_id"
equals = "{orphan_leaf_node_id}"

# ---------------------------------------------------------------------
# Step 3 — the orphan leaf's branch_type is `rewind_branch`
# (property (b)). `ctx show` returns the node + its layer summaries.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "show-orphan-leaf"
argv = ["ctx", "show", "{orphan_leaf_node_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "show-orphan-leaf"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "show-orphan-leaf"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "show-orphan-leaf"
path = "node.branch_type"
equals = "rewind_branch"

# Property (b) — every layer reference is a full hash, not a stub.
[[assertions]]
kind = "stdout_json"
step = "show-orphan-leaf"
path = "layers.system.layer_id"

[[assertions]]
kind = "stdout_json"
step = "show-orphan-leaf"
path = "layers.messages.layer_id"

[[assertions]]
kind = "stdout_json"
step = "show-orphan-leaf"
path = "layers.tool_registry.layer_id"

[[assertions]]
kind = "stdout_json"
step = "show-orphan-leaf"
path = "layers.runtime_state.layer_id"

# ---------------------------------------------------------------------
# Step 4 — subagent linkage on the SUBAGENT trace (property (c)).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "subagent-tree"
argv = ["ctx", "tree", "{subagent_trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "subagent-tree"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "subagent-tree"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json_set_contains"
step = "subagent-tree"
path = "subagent_session_ids"
equals_var = "subagent_session_ids_expected"

# ---------------------------------------------------------------------
# Step 5 — the subagent_fork node resolves with the child session id
# and full layer hashes (property (d)). {subagent_fork_node_id} is
# resolved from the live event log at expansion time.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "show-subagent-fork"
argv = ["ctx", "show", "{subagent_fork_node_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "show-subagent-fork"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "show-subagent-fork"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "show-subagent-fork"
path = "node.node_id"

[[assertions]]
kind = "stdout_json"
step = "show-subagent-fork"
path = "node.branch_type"
equals = "subagent_fork"

[[assertions]]
kind = "stdout_json"
step = "show-subagent-fork"
path = "node.subagent_session_id"
equals = "{subagent_child_session_id}"

[[assertions]]
kind = "stdout_json"
step = "show-subagent-fork"
path = "layers.system.layer_id"
