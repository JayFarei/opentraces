name = "context-tree-ctx-prune-no-clobber"
description = """
Plan 077 CLI-specific journey — `ctx prune --write --to-session foo`
succeeds the first time, exits rc=4 with a structured error envelope
the second time, and never overwrites the existing JSONL.

Pruner safety (plan 077 §"Open Questions" → "Pruner safety"): the
pruner writes a new JSONL next to the source transcript. A silent
overwrite would destroy a session the operator might be
mid-conversation in via `claude --resume`. The contract is
check-before-write — error rather than overwrite.

This journey asserts:

  (a) First `--write` succeeds with rc=0, the verbatim stem, and a
      stable JSONL path.
  (b) The on-disk JSONL exists at the reported path (sha256
      captured).
  (c) Second `--write` (same stem) exits rc=4 with the canonical
      collision envelope: `error = "destination_exists"` plus a
      `message` naming the existing path and the remediation hint.
  (d) The on-disk JSONL is byte-identical across the two runs
      (sha256 equality — no overwrite happened on the collision).

Issue #42 re-spec deltas from the plan-077 draft: `ctx prune`
REQUIRES `--source-jsonl`; the shipped collision envelope is flat
(`error` string + `message` + `limitations`), not the draft's
`error.code/existing_path/hint` object; the rc=4 branch became
REACHABLE via the verbatim-stem product fix (the old uuid4-suffix
behavior never collided). Properties (b)/(d) upgraded from the
draft's directory-exists check to real sha256 equality.
"""
lane = "core"
tier = 0
tier_label = "silver"
trajectories = ["context-tree-cli"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-context-tree-substrate"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — first --write. Succeeds; verbatim stem.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "prune-write-first"
argv = [
    "ctx", "prune", "{target_node_id}",
    "--source-jsonl", "{transcript_path}",
    "--to-session", "no-clobber-fixture",
    "--write", "--json",
]

[[assertions]]
kind = "returncode"
step = "prune-write-first"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "prune-write-first"
path = "schema_version"
equals = "opentraces.context_resume.v1"

[[assertions]]
kind = "stdout_json"
step = "prune-write-first"
path = "new_session_id"
equals = "no-clobber-fixture"

[[assertions]]
kind = "stdout_json_contains"
step = "prune-write-first"
path = "jsonl_path"
value = "no-clobber-fixture.jsonl"

[[assertions]]
kind = "stdout_json"
step = "prune-write-first"
path = "record_count"

# ---------------------------------------------------------------------
# Step 2 — capture the on-disk sha256 after the first write.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "hash-after-first-write"
argv = [".testvenv/bin/python", "-c", "import hashlib, json, os, sys; p = os.path.join(os.path.dirname(sys.argv[1]), 'no-clobber-fixture.jsonl'); print(json.dumps({'sha256': hashlib.sha256(open(p, 'rb').read()).hexdigest()}))", "{transcript_path}"]

[[assertions]]
kind = "returncode"
step = "hash-after-first-write"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "hash-after-first-write"
path = "sha256"

# ---------------------------------------------------------------------
# Step 3 — second --write to the same stem. Must fail loudly with the
# canonical rc=4 collision envelope, not silently overwrite.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "prune-write-collision"
argv = [
    "ctx", "prune", "{target_node_id}",
    "--source-jsonl", "{transcript_path}",
    "--to-session", "no-clobber-fixture",
    "--write", "--json",
]
expect_returncode = 4

[[assertions]]
kind = "returncode"
step = "prune-write-collision"
equals = 4

# Structured collision envelope — same schema_version as the success
# envelope (consumer-stable), flat error string + message.
[[assertions]]
kind = "stdout_json"
step = "prune-write-collision"
path = "schema_version"
equals = "opentraces.context_resume.v1"

[[assertions]]
kind = "stdout_json"
step = "prune-write-collision"
path = "error"
equals = "destination_exists"

# The message names the existing path and the remediation hint.
[[assertions]]
kind = "stdout_json_contains"
step = "prune-write-collision"
path = "message"
value = "no-clobber-fixture.jsonl"

[[assertions]]
kind = "stdout_json_contains"
step = "prune-write-collision"
path = "message"
value = "--to-session"

# ---------------------------------------------------------------------
# Step 4 — the on-disk JSONL is byte-identical to the first write
# (property (d): the collision attempt mutated nothing).
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "hash-after-collision"
argv = [".testvenv/bin/python", "-c", "import hashlib, json, os, sys; p = os.path.join(os.path.dirname(sys.argv[1]), 'no-clobber-fixture.jsonl'); print(json.dumps({'sha256': hashlib.sha256(open(p, 'rb').read()).hexdigest()}))", "{transcript_path}"]

[[assertions]]
kind = "returncode"
step = "hash-after-collision"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "hash-after-collision"
path = "sha256"
equals_var = "hash-after-first-write:sha256"
