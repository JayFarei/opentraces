name = "context-tree-otel-vs-jsonl-equivalence"
description = """
Plan 078 mechanism journey (GOLD) — JSONL and OTel capture
sources agree on overlapping content and OTel adds the gaps.

This is the load-bearing cross-source consistency proof. Per
plan 078 R7 (cross-source dedup at the substrate) — when both
JSONL and OTLP capture the same session, the messages-layer
content for any given step must be byte-identical (content-hash
keyed) between the two derived ContextNodes. OTel-derived nodes
must additionally have a `system` layer with `completeness=full`
and a `tool_registry` layer with `input_schema` populated — both
of which JSONL fundamentally cannot capture.

This is the gold-tier proof that OTel is additive, not
replacement: pre-existing JSONL pipeline keeps working, and OTel
closes the honest gaps without violating the substrate's content
addressing.

Fixture: `context-tree-otel-linear` — the linear fixture captured
via BOTH the JSONL parser (plan 077 path) AND the OTLP receiver
(plan 078 path). The checkpoint audit exposes paired node ids:
`{first_jsonl_node_id}` (transcript_reconstruction) and
`{first_otel_node_id}` (otel) for the same active-path step.

Asserts (per plan 078 §"Mechanism journeys" row 8):
  (a) Both nodes exist and reference the same step_index.
  (b) The two nodes' messages_layer content hashes are equal
      (cross-source content addressing collapses overlapping
      layers).
  (c) The OTel node has `layers.system.completeness=full` AND
      `layers.tool_registry.content.tools_with_input_schema` populated;
      the JSONL node has `system.completeness=approximated` AND
      `tool_registry.tools_with_input_schema` empty (the gaps
      plan 077 honestly labeled).

Fails today because:
  - The OTLP receiver does not exist.
  - The `c-context-tree-otel-linear` checkpoint does not exist
    and does not yet expose paired-node template variables.

NEW template variables needed:
  - `{first_jsonl_node_id}` — JSONL-derived ContextNode id for
    step N.
  - `{first_otel_node_id}` — OTel-derived ContextNode id for the
    same step N.

GAP DOCUMENTED FOR COORDINATOR:
  - Asserting "two arbitrary content hashes are equal" requires
    either a templating variable for one side or a new
    `stdout_json_field_equals_other_step_field` assertion kind.
    This journey takes the templating approach by relying on the
    checkpoint to expose `{first_jsonl_messages_content_hash}`
    that we compare against the OTel node's messages content hash
    via `stdout_json` `equals` with the template variable. If the
    checkpoint cannot expose that hash, the assertion is moved
    to a Python-side test (out of otbox scope).
"""
lane = "core"
tier = 1  # PHASE-4: bump back to 0 once OTLP receiver ships
tier_label = "gold"
trajectories = ["context-tree-otel-capture"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-context-tree-otel-linear"]

[preconditions]
min_captured_traces = 1
context_tree_built = true
otlp_receiver_running = true
otel_settings_patched = true

# ---------------------------------------------------------------------
# Step 1 — show the JSONL-derived node. plan 077 honest gaps:
# system.completeness=approximated, tool_registry.input_schemas
# missing.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "show-jsonl-node"
argv = ["ctx", "show", "{first_jsonl_node_id}", "--full", "--json"]

[[assertions]]
kind = "returncode"
step = "show-jsonl-node"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "show-jsonl-node"
path = "layers.system.capture_method"
equals = "transcript_reconstruction"

# Plan 077 honest gap labels: JSONL can't see the assembled prompt.
[[assertions]]
kind = "stdout_json"
step = "show-jsonl-node"
path = "layers.system.completeness"
equals = "approximated"

[[assertions]]
kind = "stdout_json"
step = "show-jsonl-node"
path = "layers.tool_registry.completeness"
equals = "approximated"

# JSONL tool_registry has tool NAMES but no input_schemas.
[[assertions]]
kind = "stdout_json"
step = "show-jsonl-node"
path = "layers.messages.layer_id"

# ---------------------------------------------------------------------
# Step 2 — show the OTel-derived node for the same step. plan 078
# closes the gaps: system.completeness=full, tool_registry has
# input_schema for the built-in tools.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "show-otel-node"
argv = ["ctx", "show", "{first_otel_node_id}", "--full", "--json"]

[[assertions]]
kind = "returncode"
step = "show-otel-node"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "show-otel-node"
path = "layers.system.capture_method"
equals = "otel"

# Same step_index as the JSONL-derived node — proves the two
# capture sources attribute to the same logical decision point.
# Plan 078 closes the static-core gap.
[[assertions]]
kind = "stdout_json"
step = "show-otel-node"
path = "layers.system.completeness"
equals = "full"

# Plan 078 closes the schema gap. Built-in tools must have schemas.
# ---------------------------------------------------------------------
# Step 3 — the projection's layer_diff helper must explicitly
# recognize the paired layers as cross-source overlap (per
# plan 078 R7 + R13).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "diff-paired-nodes"
argv = ["ctx", "diff", "{first_jsonl_node_id}", "{first_otel_node_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "diff-paired-nodes"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "diff-paired-nodes"
path = "schema_version"
equals = "opentraces.context_tree.v1"

# Messages layers MUST be equivalent (no diff on the content).
# System layer MUST diff: OTel adds content the JSONL side
# couldn't see.
# tool_registry MUST diff for the same reason.

[[assertions]]
kind = "stdout_json"
step = "diff-paired-nodes"
path = "diff.changed.0.layer_type"
