name = "context-tree-temporal-anchor-precision"
description = """
Plan 077 substrate-fidelity journey #5 (silver) — the per-node
`trail_anchor_hint` resolves an Edit step to the specific git commit
that landed it (R10, the ContextNode -> Trail one-hop join).

DISPOSITION (issue #42, operator decision 2026-06-12: RETARGET to
documented functionality, never delete). The plan-077 draft could
not pass on the claude substrate world: (a) the claude_code JSONL
capture path never sets `trail_anchor_hint` (only codex/pi do), so
`ctx anchor-for-step` always exits rc=3 there (that honest empty
state is asserted by context-tree-capture-fidelity); (b) the
drafted `--json` + `context_resolve.v1` envelope is draft fiction —
the shipped verb is scalar-only; (c) the substrate world lands all
3 edits in one commit. So this journey is RE-SPECCED against
`c-captured-codex-real-session`, the world whose capture path
populates anchor hints, asserting the SHIPPED scalar contract:
rc=0 with the scalar output equal to the codex world's landed
commit (`{codex_anchor_commit}`, world-derived from the checkpoint
audit), cross-checked against `ctx writes --with-trail-anchor`.

QUARANTINED (baseline-red), evidence from the 2026-06-12 pre-step
peek of the restored codex world's event log: all 9 ContextNodes
carry a populated `trail_anchor_hint`, but the codex emitter's hint
shape is `{source: parsed_trace_record, session_id, step_index}` —
NO `commit_id` — so the scalar verb still exits rc=3 ("No
trail_anchor_hint.commit_id"). Blocked on codex-world regen / the
v1.1 anchor-hint commit_id wiring (claude path included). Do NOT
weaken the assertions to make this green; the journey IS the
contract that wiring must satisfy.
"""
lane = "core"
tier = 1  # quarantined: blocked on codex-world regen / v1.1 anchor commit_id wiring
tier_label = "silver"
trajectories = ["context-tree-temporal-anchor"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-captured-codex-real-session"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — the SHIPPED scalar contract: `ctx anchor-for-step` prints
# the anchoring commit id (rc=0). {codex_anchor_step_index} is the
# first anchor-hinted node's step, resolved from the live event log
# at expansion time; {codex_anchor_commit} is the world's landed
# commit sha from the checkpoint audit.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "anchor-for-edit-step"
argv = ["ctx", "anchor-for-step", "{trace_id}", "{codex_anchor_step_index}"]

[[assertions]]
kind = "returncode"
step = "anchor-for-edit-step"
equals = 0

# The load-bearing scalar: this Edit's landing commit, not an empty
# string and not a different sha.
[[assertions]]
kind = "stdout_contains"
step = "anchor-for-edit-step"
value = "{codex_anchor_commit}"

# ---------------------------------------------------------------------
# Step 2 — bulk cross-check via `ctx writes --with-trail-anchor`:
# the write rows' joined hint carries the same commit_id as the
# scalar verb (guards against divergence between the two surfaces).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "writes-with-anchors"
argv = ["ctx", "writes", "{trace_id}", "--with-trail-anchor", "--json"]

[[assertions]]
kind = "returncode"
step = "writes-with-anchors"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "writes-with-anchors"
path = "schema_version"
equals = "opentraces.context_writes.v1"

[[assertions]]
kind = "stdout_json"
step = "writes-with-anchors"
path = "writes.0.trail_anchor_hint.commit_id"
equals = "{codex_anchor_commit}"
