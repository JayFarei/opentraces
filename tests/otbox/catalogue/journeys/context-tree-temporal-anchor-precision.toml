name = "context-tree-temporal-anchor-precision"
description = """
Plan 077 substrate-fidelity journey #5 (silver) — for each Edit
step N, the Context Tree's per-node `trail_anchor_hint` resolves to
the specific git commit that contains that Edit's blob (not the
session's last commit, not the previous Edit's commit).

Cross-substrate join (R10): every ContextNode carries a
`trail_anchor_hint` pointer (commit_id + working_tree_hash) so
"what context did the model see when it edited file F" joins
ContextNode to Trail in one hop. The downgrade from gold to silver
(plan 077 §"What we cut from v1") happens because the helper
`ctx anchor-for-step` becomes a thin scalar check — the broader
`ctx writes --with-trail-anchor` surface gives the same evidence.

This journey forks from `c-context-tree-substrate` with the
`multi-turn` fixture which pins **3 Edit steps committed across 3
separate git commits**. For each Edit step, `ctx anchor-for-step`
must return the commit containing that specific Edit's blob; an
off-by-one (commit N-1 or N+1) fails.

Fails today because neither the `trail_anchor_hint` payload field
on ContextNode (Phase 2) nor the `ctx anchor-for-step` verb
(Phase 3) exist yet.
"""
lane = "core"
tier = 1  # PHASE-4: bump back to 0 once substrate ships
tier_label = "silver"
trajectories = ["context-tree-temporal-anchor"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-context-tree-substrate"]

[preconditions]
min_captured_traces = 1
context_tree_built = true
requires_edit_commits_min = 3

# ---------------------------------------------------------------------
# Step 1 — first Edit step's anchor. The runner expands
# {edit_step_0_index} + {edit_step_0_commit} from the multi-turn
# fixture's audit (Phase 1 will pin these values).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "anchor-for-step-0"
argv = ["ctx", "anchor-for-step", "{trace_id}", "{edit_step_0_index}", "--json"]

[[assertions]]
kind = "returncode"
step = "anchor-for-step-0"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "anchor-for-step-0"
path = "schema_version"
equals = "opentraces.context_resolve.v1"

[[assertions]]
kind = "stdout_json"
step = "anchor-for-step-0"
path = "trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "anchor-for-step-0"
path = "step_index"
equals_var = "edit_step_0_index"

# The load-bearing scalar: this Edit's commit, not the session's
# last commit. Off-by-one fails because edit_step_1_commit /
# edit_step_2_commit are distinct shas in the fixture.
[[assertions]]
kind = "stdout_json"
step = "anchor-for-step-0"
path = "trail_anchor_hint.commit_id"
equals_var = "edit_step_0_commit"

# Blob id is the second half of the (commit_id, blob_id) pair that
# pins the working-tree state at the Edit point.
[[assertions]]
kind = "stdout_json"
step = "anchor-for-step-0"
path = "trail_anchor_hint.blob_id"

# ---------------------------------------------------------------------
# Step 2 — second Edit step's anchor. Distinct commit_id.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "anchor-for-step-1"
argv = ["ctx", "anchor-for-step", "{trace_id}", "{edit_step_1_index}", "--json"]

[[assertions]]
kind = "returncode"
step = "anchor-for-step-1"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "anchor-for-step-1"
path = "schema_version"
equals = "opentraces.context_resolve.v1"

[[assertions]]
kind = "stdout_json"
step = "anchor-for-step-1"
path = "step_index"
equals_var = "edit_step_1_index"

[[assertions]]
kind = "stdout_json"
step = "anchor-for-step-1"
path = "trail_anchor_hint.commit_id"
equals_var = "edit_step_1_commit"

# ---------------------------------------------------------------------
# Step 3 — third Edit step's anchor. Distinct again.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "anchor-for-step-2"
argv = ["ctx", "anchor-for-step", "{trace_id}", "{edit_step_2_index}", "--json"]

[[assertions]]
kind = "returncode"
step = "anchor-for-step-2"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "anchor-for-step-2"
path = "step_index"
equals_var = "edit_step_2_index"

[[assertions]]
kind = "stdout_json"
step = "anchor-for-step-2"
path = "trail_anchor_hint.commit_id"
equals_var = "edit_step_2_commit"

# ---------------------------------------------------------------------
# Step 4 — bulk cross-check via `ctx writes --with-trail-anchor`.
# Each write row carries the same trail_anchor_hint as its
# corresponding `anchor-for-step` scalar; this guards against
# divergence between the two CLI surfaces.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "writes-with-anchors"
argv = ["ctx", "writes", "{trace_id}", "--with-trail-anchor", "--json"]

[[assertions]]
kind = "returncode"
step = "writes-with-anchors"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "writes-with-anchors"
path = "schema_version"
equals = "opentraces.context_writes.v1"

# Exactly 3 Edit/Write rows for the 3 commits.
[[assertions]]
kind = "stdout_json_length_equals"
step = "writes-with-anchors"
path = "writes"
equals = 3

# Ordered list of commit_ids across the writes must equal the
# fixture's pinned [edit_step_0_commit, edit_step_1_commit,
# edit_step_2_commit]. `stdout_json_array_equals` is order-sensitive,
# which is exactly what we want — the Edits land in step order.
[[assertions]]
kind = "stdout_json_array_equals"
step = "writes-with-anchors"
path = "writes_commit_ids"
equals_var = "edit_commit_ids_ordered"
