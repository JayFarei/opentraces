name = "ctx-show-layer-blob-dedup-per-project"
description = """
Plan 080 mechanism journey (GOLD) — layer blob dedup within a project,
per-project namespace scoping (the default), under the
`bucket/blobs/v1/<project>/context/<hh>/<hash>.json.gz` layout.

The c-bucket-spine-v2-multi-trace-mixed checkpoint provides two
captured sessions in the SAME project (same box, same model, same
claude_code_version), so the system layers content-hash identically and
the blob namespace contains FEWER unique blobs than the sum of layer
references across both traces. That's dedup proof.

Asserts:
  (a) Both traces appear in `ctx list --json` with node counts.
  (b) `bucket status --json` reports the dedup tally over the context
      substrate: trace_count == 2, sum_layer_refs_count == 8 (4 per
      trace), dedup_hits >= 1 (at least one cross-trace content hit),
      and global_shared_blob_count == 0.
  (c) No `_shared/` namespace exists under `bucket/blobs/v1/` (the
      per-project default; global scope is opt-in).
  (d) `ctx step <trace> 0` resolves the first trace's layers through the
      per-project namespace.

Re-specced for issue #42 (un-quarantine): the dedup tally lives at
`bucket.context_trees.{trace_count,sum_layer_refs_count,
unique_layer_blob_count,dedup_hits,global_shared_blob_count}` (not the
authored `bucket.blobs_v1.context.*` block, which was never
implemented); `ctx list` rows live under `traces[]` and carry no
blob_scope key (per-project is the only shipped default and is asserted
via the path_not_exists on `_shared/`); `{first_context_node_id}` had no
producer so the node is addressed via `ctx step <trace> 0`. Out-of-vocab
`bucket_spine_v2_layout` precondition dropped.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-bucket-spine-v2-multi-trace-mixed"]

[preconditions]
min_captured_traces = 2
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — list all context-bearing traces; confirm both are present.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "list-context-trees-dedup"
argv = ["ctx", "list", "--json"]

[[assertions]]
kind = "returncode"
step = "list-context-trees-dedup"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "list-context-trees-dedup"
path = "schema_version"
equals = "opentraces.ctx.list.v2"

[[assertions]]
kind = "stdout_json"
step = "list-context-trees-dedup"
path = "traces.0.trace_id"

[[assertions]]
kind = "stdout_json"
step = "list-context-trees-dedup"
path = "traces.1.trace_id"

[[assertions]]
kind = "stdout_json"
step = "list-context-trees-dedup"
path = "traces.0.summary.node_count"

[[assertions]]
kind = "stdout_json"
step = "list-context-trees-dedup"
path = "traces.1.summary.node_count"

# ---------------------------------------------------------------------
# Step 2 — bucket status surfaces the dedup tally over the context
# substrate namespace.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "status-dedup-tally"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "status-dedup-tally"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "status-dedup-tally"
path = "bucket.context_trees.trace_count"
equals = 2

# Sum of layer refs across both heads (4 per session-level trace).
[[assertions]]
kind = "stdout_json"
step = "status-dedup-tally"
path = "bucket.context_trees.sum_layer_refs_count"
equals = 8

# Distinct content-addressed blobs across both traces.
[[assertions]]
kind = "stdout_json"
step = "status-dedup-tally"
path = "bucket.context_trees.unique_layer_blob_count"

# Dedup hits >= 1 (sum_layer_refs - unique_blob_count).
[[assertions]]
kind = "stdout_json_greater_equal"
step = "status-dedup-tally"
path = "bucket.context_trees.dedup_hits"
min = 1

# Per-project default — _shared/ namespace is empty.
[[assertions]]
kind = "stdout_json"
step = "status-dedup-tally"
path = "bucket.context_trees.global_shared_blob_count"
equals = 0

# The global opt-in path is NOT taken by default.
[[assertions]]
kind = "path_not_exists"
path = "{opentraces_dir}/bucket/blobs/v1/_shared"

# ---------------------------------------------------------------------
# Step 3 — `ctx step <trace> 0` resolves the layers through the
# per-project blob namespace.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-step-layer-blob-resolution"
argv = ["ctx", "step", "{trace_id}", "0", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-step-layer-blob-resolution"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-step-layer-blob-resolution"
path = "layers.system.layer_id"

[[assertions]]
kind = "stdout_json"
step = "ctx-step-layer-blob-resolution"
path = "layers.messages.layer_id"
