name = "setup-bucket-fake-provider-offline"
description = """
Setup-bucket offline path (plan 092 R1 / Scope: no live HF, Track 1): the fake
provider configures a private bucket remote against a local filesystem root with
no authentication and no network, so the setup flow stays default-CI-safe.
`setup bucket --provider fake --fake-root <dir> --no-security-prompt --json`
returns rc=0 with a remote-backed bucket pointing at the fake provider.
"""
lane = "core"
tier = 0
seed = "smoke"
persona = "both"
requires = ["cli"]

[[steps]]
type = "cli"
id = "setup-fake"
argv = ["setup", "bucket", "--provider", "fake", "--fake-root", "{home}/fake-bucket-remote", "--no-security-prompt", "--json"]

[[assertions]]
kind = "returncode"
step = "setup-fake"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "setup-fake"
path = "status"
equals = "ok"

[[assertions]]
kind = "stdout_json"
step = "setup-fake"
path = "bucket.storage"
equals = "remote"

[[assertions]]
kind = "stdout_json"
step = "setup-fake"
path = "bucket.remote.provider"
equals = "fake"

[[assertions]]
kind = "stdout_json"
step = "setup-fake"
path = "bucket.remote.enabled"
equals = true
