name = "bucket-remote-status-filtered-eligible"
description = """
Issue #94 — once the bucket security filter is configured and applied, and a
remote is configured, `bucket remote status` reports the bucket as eligible:
`security_gate.eligible == true`, zero unfiltered/stale blockers, no remediation.

Flow: enable the `basic` policy, push to a fake root (rc=0 — the push syncs the
seeded records AND filters them under the now-configured tools), then re-apply
the filter explicitly (`bucket security run --all`, idempotent — proves the
records exist and are already filtered). The remote is exercised through the
explicit fake-root branch (`--root`, modelled on bucket-symmetric-local-remote
.toml:219-222 — the configured-remote axis, codex finding #3).
"""
lane = "core"
tier = 0
seed = "smoke"
requires = ["cli"]

# 1. Configure the bucket security filter (regex + entropy).
[[steps]]
type = "cli"
id = "policy-basic"
argv = ["bucket", "security", "policy", "--policy", "basic", "--json"]

[[assertions]]
kind = "returncode"
step = "policy-basic"
equals = 0

# 2. Push to the fake root: syncs the seeded records into the bucket and filters
#    them under the configured tools, so the push succeeds (rc=0).
[[steps]]
type = "cli"
id = "push"
argv = ["bucket", "remote", "push", "--root", "{fake_remote}/bucket-94", "--json"]

[[assertions]]
kind = "returncode"
step = "push"
equals = 0

# 3. Re-apply the filter explicitly — idempotent, every record already filtered.
[[steps]]
type = "cli"
id = "security-run"
argv = ["bucket", "security", "run", "--all", "--json"]

[[assertions]]
kind = "returncode"
step = "security-run"
equals = 0

[[assertions]]
kind = "stdout_json_greater_equal"
step = "security-run"
path = "security_run.total"
min = 1

# 4. Posture is fully filtered (non-trivial: real records, zero unfiltered).
[[steps]]
type = "cli"
id = "sec-status"
argv = ["bucket", "security", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "sec-status"
equals = 0

[[assertions]]
kind = "stdout_json_greater_equal"
step = "sec-status"
path = "security.filtered"
min = 1

[[assertions]]
kind = "stdout_json"
step = "sec-status"
path = "security.unfiltered"
equals = 0

# 5. Persist the manifest the gate reads its counts from.
[[steps]]
type = "cli"
id = "heal"
argv = ["bucket", "manifest", "--heal"]

[[assertions]]
kind = "returncode"
step = "heal"
equals = 0

# 6. Remote configured (fake root) + filter applied -> eligible.
[[steps]]
type = "cli"
id = "remote-status"
argv = ["bucket", "remote", "status", "--root", "{fake_remote}/bucket-94", "--json"]

[[assertions]]
kind = "returncode"
step = "remote-status"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "remote-status"
path = "remote.security_gate.state"
equals = "ok"

[[assertions]]
kind = "stdout_json"
step = "remote-status"
path = "remote.security_gate.eligible"
equals = true

[[assertions]]
kind = "stdout_json"
step = "remote-status"
path = "remote.security_gate.unfiltered_count"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "remote-status"
path = "remote.security_gate.security_stale_count"
equals = 0

[[assertions]]
kind = "stdout_json_length_equals"
step = "remote-status"
path = "remote.security_gate.blocking_reasons"
equals = 0

[[assertions]]
kind = "stdout_json_path_absent"
step = "remote-status"
path = "remote.security_gate.remediation.command"
