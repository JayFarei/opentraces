name = "configure-bucket"
description = """
Configure bucket sync target (plan 063 §1: `configure-bucket`):
`setup bucket` toggles local-only vs HF-synced. The journey asserts
the help surface documents the contract.
"""
lane = "core"
tier = 0
seed = "smoke"
trajectories = ["configure-bucket"]
persona = "both"
requires = ["cli"]

[[steps]]
type = "cli"
id = "bucket-help"
argv = ["setup", "bucket", "--help"]

[[assertions]]
kind = "stdout_contains"
step = "bucket-help"
value = "bucket"
