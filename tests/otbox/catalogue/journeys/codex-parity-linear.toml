name = "codex-parity-linear"
description = """
Plan 083 C1 scaffold: Codex linear edit plus core trace/trail/context/
bucket shape. Default CI safe: this journey is pinned to the artifact-
preferred Codex checkpoint. It runs when tests/otbox/captures/codex-
linear-edit is present locally, and otherwise SKIPs with a precondition
conflict rather than requiring live Codex.
"""
lane = "core"
tier = 0
tier_label = "gold"
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-captured-codex-real-session"]
plan_083_matrix_ids = ["C1"]
status = "artifact-backed"

[preconditions]
min_captured_traces = 1
context_tree_built = true

[[steps]]
type = "cli"
id = "bucket-status"
argv = ["bucket", "status", "--json"]

[[steps]]
type = "cli"
id = "bucket-verify"
argv = ["bucket", "verify", "--sample", "1", "--json"]

[[steps]]
type = "cli"
id = "trace-query-codex"
argv = ["trace", "query", "--facet", "agent.name=codex-cli", "--json"]

[[steps]]
type = "cli"
id = "trace-get"
argv = ["trace", "get", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "trace-map"
argv = ["trace", "map", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "trace-slice"
argv = ["trace", "slice", "--around-step", "3", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "trail-graph"
argv = ["trail", "graph", "--trace", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "ctx-tree"
argv = ["ctx", "tree", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "ctx-step"
argv = ["ctx", "step", "{trace_id}", "3", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-status"
equals = 0

[[assertions]]
kind = "returncode"
step = "bucket-verify"
equals = 0

[[assertions]]
kind = "returncode"
step = "trace-query-codex"
equals = 0

[[assertions]]
kind = "returncode"
step = "trace-get"
equals = 0

[[assertions]]
kind = "returncode"
step = "trace-map"
equals = 0

[[assertions]]
kind = "returncode"
step = "trace-slice"
equals = 0

[[assertions]]
kind = "returncode"
step = "trail-graph"
equals = 0

[[assertions]]
kind = "returncode"
step = "ctx-tree"
equals = 0

[[assertions]]
kind = "returncode"
step = "ctx-step"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "trace-query-codex"
path = "candidates.0.trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "trace-get"
path = "trace.agent.name"
equals = "codex-cli"

[[assertions]]
kind = "stdout_json"
step = "trace-map"
path = "trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "trace-slice"
path = "slices.0.trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "trail-graph"
path = "pivot_trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "trail-graph"
path = "commits.0.sha"
equals = "{commit_sha}"

[[assertions]]
kind = "stdout_json"
step = "bucket-status"
path = "bucket.trail.stale_count"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-tree"
path = "root_node_id"

[[assertions]]
kind = "stdout_json"
step = "ctx-step"
path = "node.trace_id"
equals = "{trace_id}"
