name = "bucket-prune-orphan-only"
description = """
Plan 080 Phase C mechanism journey (GOLD) — `bucket prune` deletes
ONLY unreachable blobs; the event log and per-trace envelope are
strictly read-only inputs (Plan 080 §20 Resolution G).

Setup (c-bucket-spine-v2-crash-injected-w1): one planted W1 orphan blob
(valid content-addressed payload, zero event references) on top of a
fully consistent anchored world.

Asserts:
  (a) Pre-prune events head + per-trace digest captured.
  (b) `bucket prune --dry-run` REPORTS the orphan (would_delete >= 1,
      deleted == 0) — the report-only surface.
  (c) `bucket prune` exits 0 with orphans_removed >= 1.
  (d) Post-prune events head is byte-identical (event log untouched).
  (e) Post-prune `trace get` returns the same spine (envelopes
      untouched).
  (f) Idempotent: a second prune reports would_delete == 0 and
      deleted == 0.
  (g) `bucket verify --full` is clean after the sweep.

Re-specced for issue #42 (un-quarantine): the authored keys
`prune.ok/orphan_blobs_deleted/events_modified/traces_modified/
idempotent_noop` never existed — the shipped envelope is `{status,
would_delete, deleted, prune: {orphans_removed, tempfiles_removed,
blobs[], ...}}`; non-mutation of events/envelopes is pinned via
equals_var on the events head + trace digest rather than counter keys,
and idempotency via the second run's zero counters. Out-of-vocab
`bucket_spine_v2_layout` / `orphan_blob_injected` precondition keys
dropped.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-crash-injected-w1"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — pre-prune snapshot: events head + trace spine.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "prune-orphan-pre-status"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "prune-orphan-pre-status"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "prune-orphan-pre-status"
path = "bucket.events_v1.last_batch_id"

[[steps]]
type = "cli"
id = "prune-orphan-pre-trace-get"
argv = ["trace", "get", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "prune-orphan-pre-trace-get"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "prune-orphan-pre-trace-get"
path = "trace.trace_id"
equals = "{trace_id}"

# ---------------------------------------------------------------------
# Step 2 — dry-run reports the orphan without deleting.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "prune-orphan-dry-run"
argv = ["bucket", "prune", "--dry-run", "--json"]

[[assertions]]
kind = "returncode"
step = "prune-orphan-dry-run"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "prune-orphan-dry-run"
path = "status"
equals = "ok"

[[assertions]]
kind = "stdout_json_greater_equal"
step = "prune-orphan-dry-run"
path = "would_delete"
min = 1

[[assertions]]
kind = "stdout_json"
step = "prune-orphan-dry-run"
path = "deleted"
equals = 0

# ---------------------------------------------------------------------
# Step 3 — prune deletes the orphan blob.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "prune-orphan-action"
argv = ["bucket", "prune", "--json"]

[[assertions]]
kind = "returncode"
step = "prune-orphan-action"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "prune-orphan-action"
path = "status"
equals = "ok"

[[assertions]]
kind = "stdout_json_greater_equal"
step = "prune-orphan-action"
path = "prune.orphans_removed"
min = 1

[[assertions]]
kind = "stdout_json_greater_equal"
step = "prune-orphan-action"
path = "deleted"
min = 1

# ---------------------------------------------------------------------
# Step 4 — events head + per-trace spine unchanged across the sweep.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "prune-orphan-post-status"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "prune-orphan-post-status"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "prune-orphan-post-status"
path = "bucket.events_v1.last_batch_id"
equals_var = "prune-orphan-pre-status:bucket.events_v1.last_batch_id"

[[steps]]
type = "cli"
id = "prune-orphan-post-trace-get"
argv = ["trace", "get", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "prune-orphan-post-trace-get"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "prune-orphan-post-trace-get"
path = "trace.patches"
equals_var = "prune-orphan-pre-trace-get:trace.patches"

# ---------------------------------------------------------------------
# Step 5 — second prune is a no-op (idempotent).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "prune-orphan-idempotent"
argv = ["bucket", "prune", "--json"]

[[assertions]]
kind = "returncode"
step = "prune-orphan-idempotent"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "prune-orphan-idempotent"
path = "would_delete"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "prune-orphan-idempotent"
path = "deleted"
equals = 0

# ---------------------------------------------------------------------
# Step 6 — verify is clean after the sweep.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "prune-orphan-verify-clean"
argv = ["bucket", "verify", "--full", "--json"]

[[assertions]]
kind = "returncode"
step = "prune-orphan-verify-clean"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "prune-orphan-verify-clean"
path = "verify.ok"
equals = true

[[assertions]]
kind = "stdout_json"
step = "prune-orphan-verify-clean"
path = "verify.dangling_count"
equals = 0
