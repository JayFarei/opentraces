name = "bucket-remote-sync-scope-per-trace"
description = """
Plan 080 mechanism journey (GOLD) — `bucket remote push` is
substrate-aware over the spine layout and exits 0 when context_tree
heads are ineligible to publish.

Per Plan 079 R8 (privacy default) + Plan 080 §6: the push succeeds,
reports the skipped substrate, and the gated `contexts/v1` projection
class never lands on the remote.

Asserts:
  (a) `bucket remote push --json` exits 0 even though context-tree-
      bearing traces exist locally with remote_sync_eligible == false.
  (b) The envelope reports `remote.skipped_substrates == ["context_tree"]`
      and a pushed state.
  (c) The remote root has the per-trace spine
      (`traces/v1/**/trace.json` + `trail.jsonl.gz`) but NO
      `contexts/v1/` directory (the gated projection class was skipped).
  (d) Post-push `bucket remote diff` reports different == false (the
      sync state settled to current).
  (e) Post-push local `bucket verify` still returns no dangling
      references (the substrate-aware skip never mutates local state).

Re-specced for issue #42 (un-quarantine): the fake (filesystem)
provider's substrate-aware skip is DIRECTORY-scoped — it moves
`contexts/v1/<slug>` aside during the tree copy — so the per-trace
companion `context.jsonl.gz` IS mirrored by the fake provider (the
per-FILE skip via `_ordered_bucket_upload_passes` is the HF wire path,
exercised by the live-hf lane). The remote-tree assertions pin the fake
provider's real behavior: spine present, contexts/v1 absent. The
remote is configured by the checkpoint (`setup bucket --provider fake`)
at {fake_remote}/bucket-spine, replacing the authored `config set`
step. `verify.dangling_refs_count` re-keyed to the shipped
`verify.dangling_count`. Out-of-vocab `bucket_spine_v2_layout`
precondition dropped.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-bucket-spine-v2-pushed-fake-remote"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — push to the fake remote. Must exit 0 even with
# context_tree-bearing traces ineligible.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "remote-push-skip-context-tree"
argv = ["bucket", "remote", "push", "--root", "{fake_remote}/bucket-spine", "--json"]

[[assertions]]
kind = "returncode"
step = "remote-push-skip-context-tree"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "remote-push-skip-context-tree"
path = "status"
equals = "ok"

[[assertions]]
kind = "stdout_json"
step = "remote-push-skip-context-tree"
path = "remote.state"
equals = "pushed"

# skipped_substrates surfaces context_tree (and only context_tree).
[[assertions]]
kind = "stdout_json"
step = "remote-push-skip-context-tree"
path = "remote.skipped_substrates.0"
equals = "context_tree"

[[assertions]]
kind = "stdout_json_length_equals"
step = "remote-push-skip-context-tree"
path = "remote.skipped_substrates"
equals = 1

[[assertions]]
kind = "stdout_json_greater_equal"
step = "remote-push-skip-context-tree"
path = "remote.files_copied"
min = 1

# ---------------------------------------------------------------------
# Step 2 — the remote tree carries the spine but not the gated
# contexts/v1 projection class.
# ---------------------------------------------------------------------
[[assertions]]
kind = "file_count_min"
path = "{fake_remote}/bucket-spine/traces/v1"
glob = "**/trace.json"
min = 1

[[assertions]]
kind = "file_count_min"
path = "{fake_remote}/bucket-spine/traces/v1"
glob = "**/trail.jsonl.gz"
min = 1

[[assertions]]
kind = "path_not_exists"
path = "{fake_remote}/bucket-spine/contexts/v1"

# ---------------------------------------------------------------------
# Step 3 — post-push diff settles to current.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "remote-diff-post-push"
argv = ["bucket", "remote", "diff", "--root", "{fake_remote}/bucket-spine", "--json"]

[[assertions]]
kind = "returncode"
step = "remote-diff-post-push"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "remote-diff-post-push"
path = "remote.remote_digest"

[[assertions]]
kind = "stdout_json"
step = "remote-diff-post-push"
path = "remote.different"
equals = false

# ---------------------------------------------------------------------
# Step 4 — local verify is unchanged after push (no clobber).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "verify-post-push-no-dangling"
argv = ["bucket", "verify", "--sample", "10", "--json"]

[[assertions]]
kind = "returncode"
step = "verify-post-push-no-dangling"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "verify-post-push-no-dangling"
path = "verify.dangling_count"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "verify-post-push-no-dangling"
path = "verify.ok"
equals = true
