name = "web-viewer-smoke"
description = """
Headless web-viewer journey. Starts the Flask review backend
(opentraces.clients.web.server.create_app) against the seeded project
as a background service, then probes its API: /api/context and
/api/traces must answer 200. Proves the web product surface boots and
serves a seeded world without a browser.

Tier 0 / local-driver oriented — the service step needs the driver's
background-process support.
"""
lane = "extended"
tier = 0
seed = "smoke"
requires = ["cli"]

[[steps]]
type = "service"
id = "web"
kind = "shell"
argv = [
    "{repo_root}/.venv/bin/python",
    "-c",
    "import sys; from opentraces.clients.web.server import create_app; create_app(staging_dir=sys.argv[1], state_path=sys.argv[2]).run(host='127.0.0.1', port=int(sys.argv[3]))",
    "{state_dir}/traces",
    "{state_dir}/state.json",
    "{port}",
]
ready_url = "http://127.0.0.1:{port}/api/context"
ready_timeout = 25

[[steps]]
type = "http_get"
id = "context"
url = "http://127.0.0.1:{port}/api/context"
expect_status = 200

[[steps]]
type = "http_get"
id = "traces"
url = "http://127.0.0.1:{port}/api/traces"
expect_status = 200

[[assertions]]
kind = "returncode"
step = "context"
equals = 200

[[assertions]]
kind = "returncode"
step = "traces"
equals = 200
