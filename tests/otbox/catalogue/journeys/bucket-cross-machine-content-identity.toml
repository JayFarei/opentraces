name = "bucket-cross-machine-content-identity"
description = """
Plan 080 Phase D LOAD-BEARING cross-cutting journey (GOLD) — push to a
remote, destroy the local bucket, pull it back, and assert
byte-identical bucket state (per Plan 080 §6 cross-machine consistency,
§17 R-080-5, §20 Resolution H).

The load-bearing claim is the deterministic-projection identity chain:
content-addressed blobs + deterministic per-trace projections (gzip
mtime=0, sort_keys=True JSON, volatile fields excluded from digest)
imply push-then-pull reproduces the exact same bucket_digest and
traces[].digest set on the receiving side.

This journey (single box; the wipe is the machine boundary):
  1. Pushes the bucket (the push-time security refresh settles the
     digest; the pushed digest is the chain's anchor).
  2. Captures `bucket status` + `trace get` on "machine A".
  3. Destroys the local bucket entirely (machine B starts empty).
  4. Pulls from the same fake remote.
  5. Asserts: pull digest == push digest == status digest on both
     sides; traces[] byte-identical; `trace get` spine byte-identical;
     post-pull remote state "current".

Re-specced for issue #42 (un-quarantine): the authored per-step
`persona = "machine_a"/"machine_b"` dual-HOME mechanism does not exist
in the journey runner — the wipe-and-pull boundary carries the same
claim (the true different-HOME relocation invariants are pinned by
tests/test_bucket_remote_symmetric.py::test_cross_machine_bucket_digest_*).
The identity chain anchors on the PUSH digest rather than the pre-push
status digest because `bucket remote push` legitimately refreshes
security envelopes before computing its manifest (first push after a
restore re-scans records). Out-of-vocab `bucket_spine_v2_layout` /
`deterministic_projection` / `cross_machine_personas_available`
precondition keys dropped.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-cross-machine"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — machine A: push (settles + records the anchor digest).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "machine-a-push"
argv = ["bucket", "remote", "push", "--root", "{fake_remote}/bucket-spine", "--json"]

[[assertions]]
kind = "returncode"
step = "machine-a-push"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "machine-a-push"
path = "remote.state"
equals = "pushed"

[[assertions]]
kind = "stdout_json"
step = "machine-a-push"
path = "remote.digest"

# ---------------------------------------------------------------------
# Step 2 — machine A: status agrees with the pushed digest.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "machine-a-status"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "machine-a-status"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "machine-a-status"
path = "bucket.schema_version"
equals = "opentraces.bucket.manifest.v2"

[[assertions]]
kind = "stdout_json_equals_var"
step = "machine-a-status"
path = "bucket.bucket_digest"
equals_var = "machine-a-push:remote.digest"

# Issue #97 — status is summary-only (traces[] dropped); the full per-trace
# listing (incl. per-trace digests) lives on `bucket manifest --json`. The
# cross-machine traces[] byte-identity proof runs against the manifest.
[[steps]]
type = "cli"
id = "machine-a-manifest"
argv = ["bucket", "manifest", "--json"]

[[assertions]]
kind = "returncode"
step = "machine-a-manifest"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "machine-a-manifest"
path = "manifest.traces.0.trace_id"
equals = "{trace_id}"

[[steps]]
type = "cli"
id = "machine-a-trace-get"
argv = ["trace", "get", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "machine-a-trace-get"
equals = 0

# ---------------------------------------------------------------------
# Step 3 — machine B: start from nothing; pull from the same remote.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "machine-boundary-wipe"
argv = ["bash", "-c", "rm -rf {opentraces_dir}/bucket"]

[[assertions]]
kind = "returncode"
step = "machine-boundary-wipe"
equals = 0

[[steps]]
type = "cli"
id = "machine-b-pull"
argv = ["bucket", "remote", "pull", "--root", "{fake_remote}/bucket-spine", "--force", "--json"]

[[assertions]]
kind = "returncode"
step = "machine-b-pull"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "machine-b-pull"
path = "remote.state"
equals = "pulled"

# Digest from the remote = digest machine A pushed (byte-identical
# content fetched AND byte-identically re-projected locally).
[[assertions]]
kind = "stdout_json_equals_var"
step = "machine-b-pull"
path = "remote.digest"
equals_var = "machine-a-push:remote.digest"

# ---------------------------------------------------------------------
# Step 4 — machine B: bucket_digest + traces[] match machine A's.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "machine-b-status-post-pull"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "machine-b-status-post-pull"
equals = 0

# Resolution H: bucket_digest is byte-identical for the same content.
[[assertions]]
kind = "stdout_json_equals_var"
step = "machine-b-status-post-pull"
path = "bucket.bucket_digest"
equals_var = "machine-a-push:remote.digest"

# Issue #97 — the traces[] byte-identity proof moves to `bucket manifest`
# (status no longer carries traces[]). Resolution H: traces[] rows (incl.
# per-trace digests) byte-identical across the wipe-and-pull boundary.
[[steps]]
type = "cli"
id = "machine-b-manifest-post-pull"
argv = ["bucket", "manifest", "--json"]

[[assertions]]
kind = "returncode"
step = "machine-b-manifest-post-pull"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "machine-b-manifest-post-pull"
path = "manifest.traces"
equals_var = "machine-a-manifest:manifest.traces"

# Sync state settled to current on the receiving side.
[[steps]]
type = "cli"
id = "machine-b-remote-status"
argv = ["bucket", "remote", "status", "--root", "{fake_remote}/bucket-spine", "--json"]

[[assertions]]
kind = "returncode"
step = "machine-b-remote-status"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "machine-b-remote-status"
path = "remote.state"
equals = "current"

# ---------------------------------------------------------------------
# Step 5 — machine B: trace get returns the same TraceRecord spine.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "machine-b-trace-get"
argv = ["trace", "get", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "machine-b-trace-get"
equals = 0

# The patches[] array (the spine; Plan 080 §3) is byte-identical.
[[assertions]]
kind = "stdout_json_equals_var"
step = "machine-b-trace-get"
path = "trace.patches"
equals_var = "machine-a-trace-get:trace.patches"

[[assertions]]
kind = "stdout_json_equals_var"
step = "machine-b-trace-get"
path = "trace.trace_id"
equals_var = "machine-a-trace-get:trace.trace_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "machine-b-trace-get"
path = "trace.session_id"
equals_var = "machine-a-trace-get:trace.session_id"
