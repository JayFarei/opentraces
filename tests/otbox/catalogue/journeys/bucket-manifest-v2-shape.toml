name = "bucket-manifest-v2-shape"
description = """
Plan 080 mechanism journey (GOLD) — `bucket manifest --json` returns
the v2 shape per Plan 080 §4.

Asserts:
  (a) manifest.schema_version is exactly "opentraces.bucket.manifest.v2".
  (b) `traces[]` carries the seed checkpoint trace with the load-bearing
      per-trace keys (project_slug, trace_id, trace_path, lifecycle,
      summary counters, files flags, remote_sync_eligible, digest).
  (c) `events_v1` block is present with schema_version/batch_count/
      last_batch_id/latest_event_sequence.
  (d) Top-level `bucket_digest` is present and STABLE across a re-run
      (deterministic projection contract per §10.5 Resolution H,
      enforced via cross-step equals_var).

Re-specced for issue #42 (un-quarantine): pinned to the now-built
c-bucket-spine-v2-one-trace-provisional checkpoint; the digest-stability
claim was upgraded from presence-only to a strict equals_var; the
`summary.capture_methods.0` assertion was relaxed to key presence (the
JSONL capture path leaves capture_methods empty on this surface); the
out-of-vocab `bucket_spine_v2_layout` precondition key was dropped
(PRECONDITION_VOCAB has no such key; the layout is what the checkpoint
builds and the schema_version assertion pins).
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-one-trace-provisional"]

[preconditions]
min_captured_traces = 1

# ---------------------------------------------------------------------
# Step 1 — bucket manifest --json returns the v2 shape.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "manifest-v2-shape"
argv = ["bucket", "manifest", "--json"]

[[assertions]]
kind = "returncode"
step = "manifest-v2-shape"
equals = 0

# Schema version exact match — v2, NOT v1.
[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.schema_version"
equals = "opentraces.bucket.manifest.v2"

# Required top-level keys.
[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.bucket_root"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.generated_at"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.bucket_digest"

# traces[] array shape — exactly one trace in the provisional world.
[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.project_slug"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.trace_path"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.lifecycle"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.summary.step_count"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.summary.patch_count"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.summary.anchored_count"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.summary.node_count"

# Key presence (the JSONL path leaves the list empty on this surface).
[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.summary.capture_methods"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.files.has_trail"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.files.has_context"
equals = true

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.files.has_sources"

# Privacy default: context-tree-bearing traces stay bucket-private.
[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.remote_sync_eligible"
equals = false

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.digest"

# events_v1 block.
[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.events_v1.schema_version"
equals = "opentraces.bucket.events.v2"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.events_v1.batch_count"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.events_v1.last_batch_id"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.events_v1.latest_event_sequence"

# ---------------------------------------------------------------------
# Step 2 — re-running manifest produces the SAME digest
# (deterministic projection contract per §10.5 Resolution H).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "manifest-v2-stable-digest"
argv = ["bucket", "manifest", "--json"]

[[assertions]]
kind = "returncode"
step = "manifest-v2-stable-digest"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-stable-digest"
path = "manifest.schema_version"
equals = "opentraces.bucket.manifest.v2"

# Byte-identical digest across re-projection.
[[assertions]]
kind = "stdout_json_equals_var"
step = "manifest-v2-stable-digest"
path = "manifest.bucket_digest"
equals_var = "manifest-v2-shape:manifest.bucket_digest"

[[assertions]]
kind = "stdout_json_equals_var"
step = "manifest-v2-stable-digest"
path = "manifest.traces.0.digest"
equals_var = "manifest-v2-shape:manifest.traces.0.digest"
