name = "bucket-manifest-v2-shape"
description = """
Plan 080 mechanism journey (GOLD) — `bucket manifest --json` returns
the v2 shape per Plan 080 §4 lines 219-255.

The new shape is significantly different from Plan 079's v1 — the
top-level manifest gains:
  - schema_version: "opentraces.bucket.manifest.v2"
  - bucket_root: <project-slug>
  - generated_at: ISO8601
  - traces: [<per-trace summary objects>]
  - events_v1: {batch_count, last_batch_id, latest_event_sequence}
  - bucket_digest: sha256

Per-trace summary entries carry:
  - project_slug, trace_id, title, trace_path, lifecycle
  - summary: {step_count, patch_count, anchored_count, node_count,
    capture_methods[]}
  - files: {has_trail, has_context, has_sources}
  - remote_sync_eligible
  - digest

The schema_version bump is load-bearing: Plan 080 §20 Resolution E
requires every manifest reader to refuse v1 manifests with a
`BucketLayoutError` upgrade hint.

Asserts:
  (a) manifest.json schema_version is exactly
      "opentraces.bucket.manifest.v2" (NOT v1).
  (b) `traces[]` is an array with at least the seed checkpoint trace.
  (c) Each `traces[i]` has the load-bearing keys above.
  (d) `events_v1` block is present with batch_count, last_batch_id,
      latest_event_sequence.
  (e) Top-level `bucket_digest` is a sha256 string.
  (f) `traces[].digest` is stable across re-projection (deterministic
      projection contract per §10.5 Resolution H).

Fails today because:
  - manifest v2 writer is Phase B Track B1 (bucket_store.bucket_manifest).
  - Schema version bump is Phase B Track B1.

Cross-track dependencies:
  - B1: bucket_manifest() returns v2 shape; BUCKET_MANIFEST_SCHEMA
    constant updated to v2.
  - B3: `bucket manifest --json` envelope wiring.
"""
lane = "core"
tier = 1  # PHASE-B: opt-in pending checkpoint c-bucket-spine-v2-one-trace-provisional
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-one-trace-provisional"]

[preconditions]
min_captured_traces = 1
bucket_spine_v2_layout = true

# ---------------------------------------------------------------------
# Step 1 — bucket manifest --json returns the v2 shape.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "manifest-v2-shape"
argv = ["bucket", "manifest", "--json"]

[[assertions]]
kind = "returncode"
step = "manifest-v2-shape"
equals = 0

# Schema version exact match — v2, NOT v1.
[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.schema_version"
equals = "opentraces.bucket.manifest.v2"

# Required top-level keys.
[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.bucket_root"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.generated_at"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.bucket_digest"

# traces[] array shape.
[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.project_slug"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.trace_id"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.trace_path"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.lifecycle"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.summary.step_count"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.summary.patch_count"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.summary.anchored_count"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.summary.node_count"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.summary.capture_methods.0"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.files.has_trail"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.files.has_context"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.files.has_sources"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.remote_sync_eligible"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.traces.0.digest"

# events_v1 block.
[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.events_v1.batch_count"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.events_v1.last_batch_id"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-shape"
path = "manifest.events_v1.latest_event_sequence"

# ---------------------------------------------------------------------
# Step 2 — re-running manifest produces the same digest
# (deterministic projection contract per §10.5 Resolution H).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "manifest-v2-stable-digest"
argv = ["bucket", "manifest", "--json"]

[[assertions]]
kind = "returncode"
step = "manifest-v2-stable-digest"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-stable-digest"
path = "manifest.schema_version"
equals = "opentraces.bucket.manifest.v2"

[[assertions]]
kind = "stdout_json"
step = "manifest-v2-stable-digest"
path = "manifest.bucket_digest"
