name = "build-dataset-lineage-explain"
description = """
Strategic ★ trajectory (plan 063 §9): `trail explain` is a first-class
consumer API — datasets and downstream apps call it to fetch the
structured evidence chain for a trace step.

The empty-state-contract sibling at
`build-dataset-lineage-explain-empty-state-contract.toml` asserts the
documented `no_trace_patch_event` limitation. This journey asserts the
happy path against `c-captured-real-session` via the same surface, so
the consumer-API contract is verified on both sides of the
limitations vocabulary.

The dedicated slice journey
`agent-session-trail-explain-happy.toml` covers an overlapping subset
at finer granularity; both run from the same checkpoint and stay
green together.
"""
lane = "core"
tier = 0
trajectories = ["build-dataset-from-lineage"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-captured-real-session"]

[[steps]]
type = "cli"
id = "explain-step"
argv = ["trail", "explain", "--trace", "{trace_id}", "--step", "{step_index}", "--json"]

[[assertions]]
kind = "returncode"
step = "explain-step"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "explain-step"
path = "trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "explain-step"
path = "step_index"

[[assertions]]
kind = "stdout_json"
step = "explain-step"
path = "event_log_ref"
equals = "refs/opentraces/local/events/v1"

# Happy-path differentiator: a real anchored relation rather than the
# empty-state `no_trace_patch_event` limitation.
[[assertions]]
kind = "stdout_json"
step = "explain-step"
path = "relation"
equals = "anchored_in_git"

[[assertions]]
kind = "stdout_json"
step = "explain-step"
path = "trace_patch_id"
