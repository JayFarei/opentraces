name = "bucket-events-mirror-replay-equals-git"
description = """
Plan 080 LOAD-BEARING cross-cutting journey (GOLD) — replaying
`bucket/events/v1/batches/*.jsonl.gz` into a fresh Git ref produces
byte-identical content to the original Git ref
(`refs/opentraces/local/events/v1`).

Per Plan 080 §11 (cross-cutting journeys, row 8) +
§20 Resolution B (single event log mirror at
`bucket/events/v1/batches/`, the `bucket/events/trail/v1/` path
retired).

Also folds in the contract previously asserted by Plan 079's
`context-tree-bucket-dual-write-fidelity.toml`: context_* events MUST
land in the unified event-log mirror (no separate trail-piggyback
path under Plan 080).

The load-bearing claim: the event log mirror in the bucket is
exhaustive for downstream consumers — a cloud worker can reconstruct
the canonical Git ref byte-identically without access to the writer
machine's `.git/`.

Asserts:
  (a) `bucket replay --repo <fresh-target> --json` exits 0 and
      reports `replay.bytes_identical: true`.
  (b) The reconstructed ref's tree-hash matches the original Git
      ref's tree-hash.
  (c) `bucket/events/v1/index.json` carries
      `schema_version: "opentraces.bucket.events.v2"` (per
      §20 Resolution B + Soft Q).
  (d) The batch files under `bucket/events/v1/batches/` are
      ordered by `<batch-seq>-<batch-id>.jsonl.gz` prefix.
  (e) Replay restores ALL event types observed in the source ref:
      trail events AND context_* events. Specifically, the replayed
      ref MUST contain `context_layer_captured` events (proves the
      Plan 080 unified mirror covers context_* — Plan 079's dual-write
      contract is preserved by the single mirror).
  (f) Replaying twice produces the same target tree-hash
      (idempotent).

Fails today because:
  - `sync_events_mirror` (renamed from sync_trail_events_from_repo)
    is Phase B Track B1.
  - `bucket/events/v1/batches/` layout writer is Phase B Track B1.
  - `bucket replay --repo` over the events/v1/ mirror is Phase B
    Track B1.

Cross-track dependencies:
  - B1: sync_events_mirror, read_events_mirror_batches, replay verb
    plumbing, bucket/events/v1/index.json writer.
"""
lane = "core"
tier = 1  # PHASE-B: opt-in pending checkpoint c-bucket-spine-v2-one-trace-anchored
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-bucket-spine-v2-one-trace-anchored"]

[preconditions]
min_captured_traces = 1
bucket_spine_v2_layout = true
context_tree_built = true
events_mirror_v1_populated = true

# ---------------------------------------------------------------------
# Step 1 — confirm the events/v1 mirror exists with v2 schema.
# `bucket status --json` exposes the events_v1 block.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "events-mirror-index-shape"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "events-mirror-index-shape"
equals = 0

# events_v1 index schema_version is v2.
[[assertions]]
kind = "stdout_json"
step = "events-mirror-index-shape"
path = "bucket.events_v1.schema_version"
equals = "opentraces.bucket.events.v2"

[[assertions]]
kind = "stdout_json"
step = "events-mirror-index-shape"
path = "bucket.events_v1.batch_count"

[[assertions]]
kind = "stdout_json"
step = "events-mirror-index-shape"
path = "bucket.events_v1.last_batch_id"

[[assertions]]
kind = "stdout_json"
step = "events-mirror-index-shape"
path = "bucket.events_v1.latest_event_sequence"

# ---------------------------------------------------------------------
# Step 2 — `bucket replay --repo <fresh-target>` reconstructs the
# canonical event ref from the bucket mirror.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "replay-from-events-mirror"
argv = ["bucket", "replay", "--repo", "/tmp/otbox-replay-events-{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "replay-from-events-mirror"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "replay-from-events-mirror"
path = "replay.status"
equals = "ok"

# Byte-identity proof: ref tree hash matches.
[[assertions]]
kind = "stdout_json"
step = "replay-from-events-mirror"
path = "replay.bytes_identical"
equals = true

# The mirror enumerates batches in deterministic order.
[[assertions]]
kind = "stdout_json"
step = "replay-from-events-mirror"
path = "replay.batches_replayed"

# All event types restored — including context_* (Plan 080 single
# mirror covers context_*, replacing Plan 079's trail-piggyback).
[[assertions]]
kind = "stdout_json"
step = "replay-from-events-mirror"
path = "replay.event_types_observed.context_layer_captured"

[[assertions]]
kind = "stdout_json"
step = "replay-from-events-mirror"
path = "replay.event_types_observed.context_node_observed"

# ---------------------------------------------------------------------
# Step 3 — idempotency: replaying again into the same target produces
# the same tree hash.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "replay-idempotent"
argv = ["bucket", "replay", "--repo", "/tmp/otbox-replay-events-{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "replay-idempotent"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "replay-idempotent"
path = "replay.bytes_identical"
equals = true

[[assertions]]
kind = "stdout_json"
step = "replay-idempotent"
path = "replay.idempotent_noop"
equals = true
