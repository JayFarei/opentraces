name = "context-tree-determinism"
description = """
Plan 077 substrate-fidelity journey #6 (silver) — running capture
twice on the same source JSONL must produce identical
content-addressed layer ids and structurally identical nodes.
Catches non-determinism in layer canonicalization, dict ordering,
and timestamp leakage into content hashes.

The Context Tree substrate is content-addressed:
`layer_id = sha256(canonical_layer_material)`. If two captures of
the same JSONL produce different layer ids, something
timing-dependent or sort-dependent leaked into the canonicalization
— silently poisoning dedup downstream.

Issue #42 re-spec deltas from the plan-077 draft: the drafted
`ctx capture-from-jsonl` verb and the `--event-type` / `--sort-by`
tree flags do not exist. The shipped re-capture path is the real
ingest chain: two fresh git-init project dirs, two `_ingest-session`
runs of the SAME multi-turn transcript ({transcript_path}, re-derived
box-relative at expansion time), then `ctx tree --json` per run via
the box-installed CLI (a shell step derives each run's minted
trace_id from its own event log).

Identity-contract note (source truth, models.py::build_node): the
random per-ingest `trace_id` is PART of node identity by design
("every field except node_id is part of identity"), so the draft's
byte-identical node-id comparison across two ingests is
unrepresentable under the shipped contract. The equal-strength
realizable properties asserted instead:

  (a) sorted `context_layer_captured` layer_id lists are
      byte-identical across the two runs (layers carry no trace_id —
      this IS the content-addressed canonicalization surface), and
  (b) the node sequences are element-wise identical across every
      identity field EXCEPT the trace-scoped ones (branch_type,
      step_index, transcript_uuid/parent/offset, all four layer
      references, capture_completeness).
"""
lane = "core"
tier = 0
tier_label = "silver"
trajectories = ["context-tree-determinism"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-context-tree-substrate"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — two fresh project dirs. `_ingest-session --project`
# auto-enrolls them (capture is global-default opt-out).
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "det-prepare-dirs"
argv = ["bash", "-c", "mkdir -p {home}/det-a {home}/det-b && git -C {home}/det-a init -q && git -C {home}/det-b init -q"]

[[assertions]]
kind = "returncode"
step = "det-prepare-dirs"
equals = 0

# ---------------------------------------------------------------------
# Step 2 + 3 — ingest the SAME transcript into both runs through the
# real capture chain.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "capture-run-a"
argv = ["_ingest-session", "{transcript_path}", "--project", "{home}/det-a"]

[[assertions]]
kind = "returncode"
step = "capture-run-a"
equals = 0

[[steps]]
type = "cli"
id = "capture-run-b"
argv = ["_ingest-session", "{transcript_path}", "--project", "{home}/det-b"]

[[assertions]]
kind = "returncode"
step = "capture-run-b"
equals = 0

# ---------------------------------------------------------------------
# Step 4 + 5 — `ctx tree --json` per run through the box-installed
# CLI. The minted trace id is per-ingest random (by contract), so a
# shell step derives it from the run's own event log first.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "tree-run-a"
argv = ["bash", "-c", '''tid=$(.testvenv/bin/python -c "import sys; from pathlib import Path; from opentraces.core.trails.event_log import read_events; print(next(e.trace_id for e in read_events(Path(sys.argv[1]), verify=False) if e.event_type=='context_node_observed'))" {home}/det-a) && .testvenv/bin/opentraces ctx tree "$tid" --project {home}/det-a --json''']

[[assertions]]
kind = "returncode"
step = "tree-run-a"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "tree-run-a"
path = "schema_version"
equals = "opentraces.context_tree.v1"

# Run A's node count matches the substrate's pinned multi-turn count
# (the transcript fully re-projects, nothing silently dropped).
[[assertions]]
kind = "stdout_json_length_equals"
step = "tree-run-a"
path = "nodes"
equals_var = "expected_node_count"

[[steps]]
type = "shell"
id = "tree-run-b"
argv = ["bash", "-c", '''tid=$(.testvenv/bin/python -c "import sys; from pathlib import Path; from opentraces.core.trails.event_log import read_events; print(next(e.trace_id for e in read_events(Path(sys.argv[1]), verify=False) if e.event_type=='context_node_observed'))" {home}/det-b) && .testvenv/bin/opentraces ctx tree "$tid" --project {home}/det-b --json''']

[[assertions]]
kind = "returncode"
step = "tree-run-b"
equals = 0

[[assertions]]
kind = "stdout_json_length_equals"
step = "tree-run-b"
path = "nodes"
equals_var = "expected_node_count"

# ---------------------------------------------------------------------
# Step 6 + 7 — the canonical determinism comparison: sorted layer ids
# plus trace-id-independent structural node rows per run, read off
# each run's event log.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "canonical-run-a"
argv = [".testvenv/bin/python", "-c", "import json, sys; from pathlib import Path; from opentraces.core.trails.event_log import read_events; evs = list(read_events(Path(sys.argv[1]), verify=False)); fields = ('branch_type','step_index','transcript_uuid','transcript_parent_uuid','transcript_offset','system_layer_id','messages_layer_id','tool_registry_layer_id','runtime_state_layer_id','capture_completeness','subagent_session_id'); print(json.dumps({'layer_ids': sorted({e.payload['layer_id'] for e in evs if e.event_type=='context_layer_captured'}), 'structural_nodes': [{k: e.payload.get(k) for k in fields} for e in evs if e.event_type=='context_node_observed']}))", "{home}/det-a"]

[[assertions]]
kind = "returncode"
step = "canonical-run-a"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "canonical-run-a"
path = "layer_ids.0"

[[steps]]
type = "shell"
id = "canonical-run-b"
argv = [".testvenv/bin/python", "-c", "import json, sys; from pathlib import Path; from opentraces.core.trails.event_log import read_events; evs = list(read_events(Path(sys.argv[1]), verify=False)); fields = ('branch_type','step_index','transcript_uuid','transcript_parent_uuid','transcript_offset','system_layer_id','messages_layer_id','tool_registry_layer_id','runtime_state_layer_id','capture_completeness','subagent_session_id'); print(json.dumps({'layer_ids': sorted({e.payload['layer_id'] for e in evs if e.event_type=='context_layer_captured'}), 'structural_nodes': [{k: e.payload.get(k) for k in fields} for e in evs if e.event_type=='context_node_observed']}))", "{home}/det-b"]

[[assertions]]
kind = "returncode"
step = "canonical-run-b"
equals = 0

# Property (a) — byte-identical content-addressed layer ids.
[[assertions]]
kind = "stdout_json_array_equals"
step = "canonical-run-b"
path = "layer_ids"
equals_var = "canonical-run-a:layer_ids"

# Property (b) — element-wise identical structural node rows.
[[assertions]]
kind = "stdout_json_array_equals"
step = "canonical-run-b"
path = "structural_nodes"
equals_var = "canonical-run-a:structural_nodes"
