name = "context-tree-determinism"
description = """
Plan 077 substrate-fidelity journey #6 (silver) — running capture
twice on the same source JSONL must produce byte-identical event
ids. Catches non-determinism in layer canonicalization, dict
ordering, and timestamp leakage into content hashes.

The Context Tree substrate is content-addressed end to end:
`layer_id = sha256(canonical_layer_material)`,
`node_id = sha256(canonical_node_material)`,
`event_id = sha256(canonical_event_material)`. If two captures of the
same JSONL produce different ids, something timing-dependent or
sort-dependent leaked into the canonicalization — silently
poisoning the dedup and survival projections downstream.

This journey runs capture twice into two fresh repos (sub-projects
under the same box) and asserts that the sorted event_id lists for
both `context_layer_captured` and `context_node_observed` events
are equal between the two runs.

The journey drives both the CLI (the user-visible capture path) and
a helper that walks the canonical event log; the assertion uses
`stdout_json_array_equals` for strict order-sensitive equality after
both lists are sorted alphabetically by the helper. The library-only
nature of this journey (`tests/otbox/journeys/.../determinism` per
plan 077 §"Which journeys drive the CLI vs the library") means the
helper is `ctx tree --json` invoked twice across two captures
rather than a Python script.

Fails today because the underlying capture chain (Phase 2) doesn't
exist; once it does, any non-determinism (dict iteration order,
implicit time.time() in a canonicalizer) fails this journey loudly.
"""
lane = "core"
tier = 1  # PHASE-4: bump back to 0 once substrate ships
tier_label = "silver"
trajectories = ["context-tree-determinism"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-context-tree-substrate"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — re-capture the same JSONL into a sub-project. The
# `ctx capture-from-jsonl <path>` verb (Phase 3 helper, mirrors
# `_ingest-session`) ingests an explicit JSONL into a fresh
# project root and returns the resulting trace_id + event count.
# Using --project to isolate the second capture from the first.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "capture-run-a"
argv = [
    "ctx", "capture-from-jsonl", "{captured_jsonl_path}",
    "--project", "{project}/.opentraces-det-a",
    "--json",
]

[[assertions]]
kind = "returncode"
step = "capture-run-a"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "capture-run-a"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "capture-run-a"
path = "trace_id"

# ---------------------------------------------------------------------
# Step 2 — second run into a sibling project root.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "capture-run-b"
argv = [
    "ctx", "capture-from-jsonl", "{captured_jsonl_path}",
    "--project", "{project}/.opentraces-det-b",
    "--json",
]

[[assertions]]
kind = "returncode"
step = "capture-run-b"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "capture-run-b"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "capture-run-b"
path = "trace_id"

# ---------------------------------------------------------------------
# Step 3 — sorted event_id list for run A, filtered to
# context_layer_captured events. Exposed via
# `ctx tree --event-type <t> --sort-by event_id --json`.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "events-run-a-layers"
argv = [
    "ctx", "tree", "{trace_id}",
    "--project", "{project}/.opentraces-det-a",
    "--event-type", "context_layer_captured",
    "--sort-by", "event_id",
    "--json",
]

[[assertions]]
kind = "returncode"
step = "events-run-a-layers"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "events-run-a-layers"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "events-run-a-layers"
path = "event_ids"

# ---------------------------------------------------------------------
# Step 4 — same query for run B. Must produce the same sorted
# event_id list.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "events-run-b-layers"
argv = [
    "ctx", "tree", "{trace_id}",
    "--project", "{project}/.opentraces-det-b",
    "--event-type", "context_layer_captured",
    "--sort-by", "event_id",
    "--json",
]

[[assertions]]
kind = "returncode"
step = "events-run-b-layers"
equals = 0

# The core property: sorted event_id lists for context_layer_captured
# events are equal between the two repos. The runner expands
# {events_run_a_layer_ids} from the previous step's stdout (templating
# engine captures step outputs into variables for later reference).
[[assertions]]
kind = "stdout_json_array_equals"
step = "events-run-b-layers"
path = "event_ids"
equals_var = "events_run_a_layer_ids"

# ---------------------------------------------------------------------
# Step 5 — same property for context_node_observed events.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "events-run-a-nodes"
argv = [
    "ctx", "tree", "{trace_id}",
    "--project", "{project}/.opentraces-det-a",
    "--event-type", "context_node_observed",
    "--sort-by", "event_id",
    "--json",
]

[[assertions]]
kind = "returncode"
step = "events-run-a-nodes"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "events-run-a-nodes"
path = "event_ids"

[[steps]]
type = "cli"
id = "events-run-b-nodes"
argv = [
    "ctx", "tree", "{trace_id}",
    "--project", "{project}/.opentraces-det-b",
    "--event-type", "context_node_observed",
    "--sort-by", "event_id",
    "--json",
]

[[assertions]]
kind = "returncode"
step = "events-run-b-nodes"
equals = 0

[[assertions]]
kind = "stdout_json_array_equals"
step = "events-run-b-nodes"
path = "event_ids"
equals_var = "events_run_a_node_ids"
