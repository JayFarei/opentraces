name = "recreate-trace-environment"
description = """
Strategic ★ trajectory (plan 063 §9): `trace teleport export → open` in
a consumer-flow shape, asserted on a REAL captured agent session
(plan 064 M64-4).

Downstream consumers (perturbation analysis, RL training, evaluation
rigs, OSS-repo rewind features) call this exact pair to reconstitute
the environment that produced a trace. The empty-state-contract
sibling at `recreate-trace-environment-empty-state-contract.toml`
asserts the same surface refuses cleanly when no TrailEvents exist;
this journey asserts the happy path against
`c-captured-real-session`.

The export must succeed, write a non-empty trace-workspace bundle, and
the open command must accept it back into a fresh project dir.
"""
lane = "core"
tier = 0
trajectories = ["recreate-trace-environment"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-captured-real-session"]

# 1. Export the captured trace as a portable trace workspace bundle.
[[steps]]
type = "cli"
id = "export"
argv = [
    "trace", "teleport", "export", "{trace_id}",
    "--output", "{box_root}/exported-workspace",
    "--json",
]

[[assertions]]
kind = "returncode"
step = "export"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "export"
path = "trace_id"
equals = "{trace_id}"

# The bundle must contain real TrailEvents (event_count >= 1), proving
# the export is not silently producing an empty workspace.
[[assertions]]
kind = "stdout_json"
step = "export"
path = "status"
equals = "ok"

[[assertions]]
kind = "path_exists"
path = "{box_root}/exported-workspace"

# 2. Open the exported bundle into a fresh project directory. The
#    consumer-side use case: pick up a teammate's exported bundle,
#    rehydrate it locally, run perturbations against the replica.
[[steps]]
type = "cli"
id = "open"
argv = [
    "trace", "teleport", "open",
    "{box_root}/exported-workspace",
    "--project", "{box_root}/opened-workspace",
    "--json",
]

[[assertions]]
kind = "returncode"
step = "open"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "open"
path = "status"
equals = "ok"

[[assertions]]
kind = "path_exists"
path = "{box_root}/opened-workspace"
