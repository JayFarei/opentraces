name = "bucket-self-sufficient-context-tree-outcome-roundtrip"
description = """
Plan 080 OUTCOME journey (GOLD) — context-tree roundtrip evidence
folded into the §13 self-sufficiency suite: a captured context tree
must survive `bucket remote push --unsafe-push` -> local wipe ->
`bucket remote pull` byte-identically.

Asserts:
  (a) `ctx info <trace>` confirms a context-bearing trace before the
      push (has_context true, digest captured).
  (b) `bucket remote push --unsafe-push` lands the context substrate on
      the fake remote: skipped_substrates is EMPTY,
      context_tree_files_uploaded >= 1, and the remote tree carries
      `contexts/v1/**/head.json`.
  (c) After wiping the local bucket, `bucket remote pull --force`
      restores it (state pulled, digest equals the push digest).
  (d) Post-pull `bucket verify` is clean (no dangling layer refs).
  (e) `ctx info <trace>` after the pull returns the IDENTICAL info
      block (digest equality across the roundtrip).
  (f) The per-trace context companions are back on disk
      (traces/v1/**/context.jsonl.gz).

Re-specced for issue #42 (un-quarantine): the real_repl/real_claude
gate was dropped — the runner has never provided a `real_claude`
capability and the description itself called the checkpoint-seeded
fixture validation out as the deterministic arm (the live-claude
variant belongs to the local-agents ritual). `remote.upload_order[]`
was never implemented (the HF wire path reports pass_counts; the fake
provider reports files_copied) so the ordered-pass claim is carried by
the live-hf lane; `--clear-projection` does not exist so the wipe is a
shell rm of the bucket. The push uses a dedicated remote root so the
unsafe (context-bearing) mirror never pollutes the family's gated
remote. Out-of-vocab `bucket_spine_v2_layout` precondition dropped.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-bucket-spine-v2-pushed-fake-remote"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — box A state: a populated context tree on disk.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "outcome-box-a-info-before-push"
argv = ["ctx", "info", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "outcome-box-a-info-before-push"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "outcome-box-a-info-before-push"
path = "info.trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "outcome-box-a-info-before-push"
path = "info.files.has_context"
equals = true

[[assertions]]
kind = "stdout_json"
step = "outcome-box-a-info-before-push"
path = "info.digest"

# ---------------------------------------------------------------------
# Step 2 — unsafe push: the context substrate is NOT skipped.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "outcome-push-with-unsafe"
argv = ["bucket", "remote", "push", "--unsafe-push", "--root",
        "{fake_remote}/bucket-spine-unsafe", "--json"]

[[assertions]]
kind = "returncode"
step = "outcome-push-with-unsafe"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "outcome-push-with-unsafe"
path = "remote.state"
equals = "pushed"

# Under --unsafe-push the substrate is NOT skipped.
[[assertions]]
kind = "stdout_json_length_equals"
step = "outcome-push-with-unsafe"
path = "remote.skipped_substrates"
equals = 0

[[assertions]]
kind = "stdout_json_greater_equal"
step = "outcome-push-with-unsafe"
path = "remote.context_tree_files_uploaded"
min = 1

[[assertions]]
kind = "stdout_json_greater_equal"
step = "outcome-push-with-unsafe"
path = "remote.files_copied"
min = 1

# The context projection class landed on the remote.
[[assertions]]
kind = "file_count_min"
path = "{fake_remote}/bucket-spine-unsafe/contexts/v1"
glob = "**/head.json"
min = 1

# ---------------------------------------------------------------------
# Step 3 — simulate box B: destroy the local bucket + pull.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "outcome-clear-local-bucket"
argv = ["bash", "-c", "rm -rf {opentraces_dir}/bucket"]

[[assertions]]
kind = "returncode"
step = "outcome-clear-local-bucket"
equals = 0

[[steps]]
type = "cli"
id = "outcome-pull-from-remote"
argv = ["bucket", "remote", "pull", "--root",
        "{fake_remote}/bucket-spine-unsafe", "--force", "--json"]

[[assertions]]
kind = "returncode"
step = "outcome-pull-from-remote"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "outcome-pull-from-remote"
path = "remote.state"
equals = "pulled"

[[assertions]]
kind = "stdout_json_equals_var"
step = "outcome-pull-from-remote"
path = "remote.digest"
equals_var = "outcome-push-with-unsafe:remote.digest"

# Post-pull verify finds no dangling layer refs on the restored state.
[[steps]]
type = "cli"
id = "outcome-verify-post-pull"
argv = ["bucket", "verify", "--sample", "10", "--json"]

[[assertions]]
kind = "returncode"
step = "outcome-verify-post-pull"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "outcome-verify-post-pull"
path = "verify.dangling_count"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "outcome-verify-post-pull"
path = "verify.ok"
equals = true

# ---------------------------------------------------------------------
# Step 4 — ctx info on "box B": IDENTICAL info block. Byte-identity
# proof of the roundtrip.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "outcome-box-b-info-after-pull"
argv = ["ctx", "info", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "outcome-box-b-info-after-pull"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "outcome-box-b-info-after-pull"
path = "info.trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json_equals_var"
step = "outcome-box-b-info-after-pull"
path = "info.digest"
equals_var = "outcome-box-a-info-before-push:info.digest"

[[assertions]]
kind = "stdout_json_equals_var"
step = "outcome-box-b-info-after-pull"
path = "info"
equals_var = "outcome-box-a-info-before-push:info"

# The per-trace context companions re-materialized as a unit.
[[assertions]]
kind = "file_count_min"
path = "{opentraces_dir}/bucket/traces/v1"
glob = "**/context.jsonl.gz"
min = 2
