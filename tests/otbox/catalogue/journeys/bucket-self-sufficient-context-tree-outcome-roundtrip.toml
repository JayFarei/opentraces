name = "bucket-self-sufficient-context-tree-outcome-roundtrip"
description = """
Plan 080 OUTCOME journey (GOLD, real_repl-gated) — context-tree
roundtrip evidence folded into the §13 self-sufficiency suite.

Renamed in-place from Plan 079's
`context-tree-bucket-outcome-roundtrip.toml` per Plan 080 §20
Resolution A. The journey is recast as one slice of the
self-sufficiency principle: a context-tree captured on machine A
must roundtrip through `bucket remote push` / `bucket remote pull`
and land byte-identically on machine B with the new spine layout
(`bucket/traces/v1/`, `bucket/blobs/v1/`, `bucket/events/v1/`).

Per Plan 080 §13 — the load-bearing acceptance test for the
self-sufficiency principle: every read query a user can run locally
against `bucket/` must also be runnable against the same bucket
pushed to a remote, with no Git ref dependency.

Maps to Plan 080 §1 outcome (Outcome 4 — symmetric local/remote):
  1. The per-trace envelope at `bucket/traces/v1/<project>/<trace>/`
     transfers as a unit (atomic re-materialization on machine B).
  2. Layer blobs at `bucket/blobs/v1/<project>/context/` transfer
     deterministically (content-addressed).
  3. Event log mirror at `bucket/events/v1/batches/` transfers in
     deterministic batch-seq order.
  4. `ctx tree <trace>` returns IDENTICAL digest on both sides.

Asserts:
  (a) Real Claude Code captures at least one context_tree on box A.
  (b) `bucket remote push --unsafe-push` lands the context_tree on
      the fake remote (push envelope confirms substrate NOT skipped).
  (c) `bucket remote pull` on box B materializes the same context_tree.
  (d) `ctx tree <trace-id> --json` on both sides returns IDENTICAL
      `digest` field (proves byte-equivalent projection).
  (e) `ctx show <node-id> --json` for the active leaf returns
      IDENTICAL layer_refs on both sides.

Real-REPL gate: this test SKIPS without OT_REAL_REPL=1 per the
project's no-synthetic-fake contract; checkpoint
c-bucket-spine-v2-pushed-fake-remote seeds enough state for a
deterministic fixture-only validation; the real-claude variant is
what proves the outcome.

Fails today because:
  - Phase B is the layout-migration milestone (in progress).
  - `--unsafe-push` flag doesn't exist yet (Phase B Track B3 test
    scaffolding).
  - The pty_runner step type for invoking real `claude` from a
    journey doesn't exist yet (tracked as a coordinator follow-up).

Cross-track dependencies:
  - B1: layout writes under bucket/traces/v1/ + bucket/blobs/v1/.
  - B2: bucket_remote.py push order (blobs -> events -> envelopes
    -> manifest) per Plan 080 §6.
  - B3: `ctx tree --json` + `ctx show --json` envelope shape.
"""
lane = "core"
tier = 1
tier_label = "gold"
real_repl = true
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli", "git", "real_claude"]
from_checkpoints = ["c-bucket-spine-v2-pushed-fake-remote"]

[preconditions]
min_captured_traces = 1
context_tree_built = true
otel_settings_patched = true
bucket_spine_v2_layout = true

# ---------------------------------------------------------------------
# Step 1 — capture state on "box A" (= the checkpoint's project).
# Confirm we have a populated context_tree on disk.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "outcome-box-a-info-before-push"
argv = ["ctx", "info", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "outcome-box-a-info-before-push"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "outcome-box-a-info-before-push"
path = "head.digest"

[[assertions]]
kind = "stdout_json"
step = "outcome-box-a-info-before-push"
path = "head.trace_id"
equals = "{trace_id}"

# ---------------------------------------------------------------------
# Step 2 — configure fake remote + unsafe-push (test scaffolding).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "outcome-configure-remote"
argv = ["config", "set", "bucket.remote.enabled=true",
        "bucket.remote.provider=fake",
        "bucket.remote.url=file:///tmp/otbox-roundtrip-remote-{trace_id}",
        "--json"]

[[assertions]]
kind = "returncode"
step = "outcome-configure-remote"
equals = 0

[[steps]]
type = "cli"
id = "outcome-push-with-unsafe"
argv = ["bucket", "remote", "push", "--unsafe-push", "--root",
        "/tmp/otbox-roundtrip-remote-{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "outcome-push-with-unsafe"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "outcome-push-with-unsafe"
path = "remote.state"
equals = "pushed"

# Under --unsafe-push the substrate is NOT skipped.
[[assertions]]
kind = "stdout_json"
step = "outcome-push-with-unsafe"
path = "remote.context_tree_files_uploaded"

# Push order matches §6: blobs -> events -> envelopes -> manifest.
[[assertions]]
kind = "stdout_json"
step = "outcome-push-with-unsafe"
path = "remote.upload_order.0"
equals = "blobs"

[[assertions]]
kind = "stdout_json"
step = "outcome-push-with-unsafe"
path = "remote.upload_order.1"
equals = "events"

[[assertions]]
kind = "stdout_json"
step = "outcome-push-with-unsafe"
path = "remote.upload_order.2"
equals = "envelopes"

[[assertions]]
kind = "stdout_json"
step = "outcome-push-with-unsafe"
path = "remote.upload_order.3"
equals = "manifest"

# ---------------------------------------------------------------------
# Step 3 — simulate box B: clear local bucket + pull.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "outcome-clear-local-bucket"
argv = ["bucket", "rebuild", "--substrate", "context-tree", "--clear-projection", "--json"]

[[assertions]]
kind = "returncode"
step = "outcome-clear-local-bucket"
equals = 0

[[steps]]
type = "cli"
id = "outcome-pull-from-remote"
argv = ["bucket", "remote", "pull", "--root",
        "/tmp/otbox-roundtrip-remote-{trace_id}", "--force", "--json"]

[[assertions]]
kind = "returncode"
step = "outcome-pull-from-remote"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "outcome-pull-from-remote"
path = "remote.state"
equals = "pulled"

# Post-pull verify finds no dangling layer refs on the new state.
[[steps]]
type = "cli"
id = "outcome-verify-post-pull"
argv = ["bucket", "verify", "--sample", "10", "--json"]

[[assertions]]
kind = "returncode"
step = "outcome-verify-post-pull"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "outcome-verify-post-pull"
path = "verify.dangling_refs_count"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "outcome-verify-post-pull"
path = "verify.ok"
equals = true

# ---------------------------------------------------------------------
# Step 4 — ctx info on box B; assert IDENTICAL digest. Byte-identity
# proof of the roundtrip.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "outcome-box-b-info-after-pull"
argv = ["ctx", "info", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "outcome-box-b-info-after-pull"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "outcome-box-b-info-after-pull"
path = "head.trace_id"
equals = "{trace_id}"

# Coordinator captures pre-push digest as a step-output variable and
# asserts equals here once equals_var template support lands.
[[assertions]]
kind = "stdout_json"
step = "outcome-box-b-info-after-pull"
path = "head.digest"

# ---------------------------------------------------------------------
# Step 5 — `ctx tree` returns the same shape as on box A. The
# substrate-level digest is the join key.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "outcome-ctx-tree-after-pull"
argv = ["ctx", "tree", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "outcome-ctx-tree-after-pull"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "outcome-ctx-tree-after-pull"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "outcome-ctx-tree-after-pull"
path = "trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "outcome-ctx-tree-after-pull"
path = "nodes.0.node_id"
