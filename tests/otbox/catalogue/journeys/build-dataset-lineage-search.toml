name = "build-dataset-lineage-search"
description = """
Strategic ★ trajectory (plan 063 §9): `trail search` is the
consumer-API for structured lineage lookup — `--trace X`, `--commit Y`,
`--path Z`, or `--survival reverted` all return Patch Trails.
Downstream apps (dashboards, RL data prep, CI gates) pivot off this
projection.

The empty-state-contract sibling at
`build-dataset-lineage-search-empty-state-contract.toml` asserts the
documented `trail_event_log_unavailable` limitation when no events
exist. This journey asserts the happy path against
`c-captured-real-session`: every `--trace` / `--commit` / `--path`
form must return ≥1 Patch Trail referencing the captured trace.
"""
lane = "core"
tier = 0
trajectories = ["build-dataset-from-lineage"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-captured-real-session"]

# --- `trail search --trace X` returns ≥1 patch ---------------------------
[[steps]]
type = "cli"
id = "search-by-trace"
argv = ["trail", "search", "--trace", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "search-by-trace"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "search-by-trace"
path = "event_log_ref"
equals = "refs/opentraces/local/events/v1"

[[assertions]]
kind = "stdout_json"
step = "search-by-trace"
path = "result_count"

# --- `trail search --commit X` resolves the commit-of-record -------------
[[steps]]
type = "cli"
id = "search-by-commit"
argv = ["trail", "search", "--commit", "{commit_sha}", "--json"]

[[assertions]]
kind = "returncode"
step = "search-by-commit"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "search-by-commit"
path = "event_log_ref"
equals = "refs/opentraces/local/events/v1"

# --- `trail search --path src/app.py` --------------------------------
[[steps]]
type = "cli"
id = "search-by-path"
argv = ["trail", "search", "--path", "src/app.py", "--json"]

[[assertions]]
kind = "returncode"
step = "search-by-path"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "search-by-path"
path = "event_log_ref"
equals = "refs/opentraces/local/events/v1"
