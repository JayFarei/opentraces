name = "bucket-symmetric-local-remote"
description = """
Plan 080 Phase D LOAD-BEARING cross-cutting journey (GOLD) — the bucket
read surface returns byte-identical envelopes before a push and after a
full local wipe + pull from the remote.

Per Plan 080 §6 (Sync story), §13 (Bucket self-sufficiency proof),
§17 R-080-5 (cross-machine identity). The journey runs each read verb
against the local bucket, pushes to the fake remote, destroys the local
bucket, pulls it back, and asserts strict equals_var byte-identity on
every envelope — the BKT-3 payoff.

Asserts (all strict cross-step equals_var):
  - `trace get <trace> --json`: identical trace_id, session_id, and
    patches[] array across the wipe/pull boundary.
  - `ctx list --json`: identical traces[] rows.
  - `ctx info <trace> --json`: identical info block (digest included).
  - `bucket remote pull` returns the exact digest the push recorded.
  - Post-pull `bucket remote status` is "current".
  - The same three read verbs run with `--remote file://<fake_remote>/
    bucket-spine` (the directory-backed fake dispatch, issue #57) return
    byte-identical envelopes to their local counterparts — proving the
    RemoteHubBackend read path is symmetric with the local backend from
    default CI (offline, tokenless), not only in the live-HF lane.

Issue #57: the `--remote` read-verb arms are restored against the
directory-backed fake dispatch (`get_backend('file:///abs/dir')` returns
a tokenless, offline DirectoryHubBackend that reads the byte-exact HF
in-repo tree `fake_remote_push` writes at the root). The existing
push/wipe/pull identity chain (the BKT-3 payoff) is kept intact; the
`--remote` arms are additive symmetry coverage on top of it. Residual
live-lane-only surface (documented, NOT restored here because the flags
were never implemented): `ctx tree --remote`, `trail blame commit
--remote` — covered only by `live-hf-read-remote`.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-pushed-fake-remote"]

[preconditions]
min_captured_traces = 1
context_tree_built = true
bucket_spine_v2_layout = true
pushed_to_fake_remote = true

# ---------------------------------------------------------------------
# Step 1 — local reads BEFORE the roundtrip.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "trace-get-local"
argv = ["trace", "get", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "trace-get-local"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "trace-get-local"
path = "trace.trace_id"
equals = "{trace_id}"

[[steps]]
type = "cli"
id = "ctx-list-local"
argv = ["ctx", "list", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-list-local"
equals = 0

[[steps]]
type = "cli"
id = "ctx-info-local"
argv = ["ctx", "info", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-info-local"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-info-local"
path = "info.trace_id"
equals = "{trace_id}"

# ---------------------------------------------------------------------
# Step 2 — push (settles the security-refresh digest and records the
# sync state the identity chain anchors on).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "symmetric-push"
argv = ["bucket", "remote", "push", "--root", "{fake_remote}/bucket-spine", "--json"]

[[assertions]]
kind = "returncode"
step = "symmetric-push"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "symmetric-push"
path = "remote.state"
equals = "pushed"

# ---------------------------------------------------------------------
# Step 3 — destroy the local bucket; pull it back from the remote.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "wipe-local-bucket"
argv = ["bash", "-c", "rm -rf {opentraces_dir}/bucket"]

[[assertions]]
kind = "returncode"
step = "wipe-local-bucket"
equals = 0

[[steps]]
type = "cli"
id = "symmetric-pull"
argv = ["bucket", "remote", "pull", "--root", "{fake_remote}/bucket-spine", "--force", "--json"]

[[assertions]]
kind = "returncode"
step = "symmetric-pull"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "symmetric-pull"
path = "remote.state"
equals = "pulled"

# Pull digest == push digest (byte-identical content fetched).
[[assertions]]
kind = "stdout_json_equals_var"
step = "symmetric-pull"
path = "remote.digest"
equals_var = "symmetric-push:remote.digest"

# ---------------------------------------------------------------------
# Step 4 — the same reads return byte-identical envelopes.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "trace-get-roundtrip"
argv = ["trace", "get", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "trace-get-roundtrip"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "trace-get-roundtrip"
path = "trace.trace_id"
equals_var = "trace-get-local:trace.trace_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "trace-get-roundtrip"
path = "trace.session_id"
equals_var = "trace-get-local:trace.session_id"

# The patches[] array (the spine; Plan 080 §3) is byte-identical.
[[assertions]]
kind = "stdout_json_equals_var"
step = "trace-get-roundtrip"
path = "trace.patches"
equals_var = "trace-get-local:trace.patches"

[[steps]]
type = "cli"
id = "ctx-list-roundtrip"
argv = ["ctx", "list", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-list-roundtrip"
equals = 0

# Identical traces[] enumeration on both sides.
[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-list-roundtrip"
path = "traces"
equals_var = "ctx-list-local:traces"

[[steps]]
type = "cli"
id = "ctx-info-roundtrip"
argv = ["ctx", "info", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-info-roundtrip"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-info-roundtrip"
path = "info"
equals_var = "ctx-info-local:info"

# ---------------------------------------------------------------------
# Step 5 — sync state settled to current.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "remote-status-final"
argv = ["bucket", "remote", "status", "--root", "{fake_remote}/bucket-spine", "--json"]

[[assertions]]
kind = "returncode"
step = "remote-status-final"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "remote-status-final"
path = "remote.state"
equals = "current"

# ---------------------------------------------------------------------
# Step 6 — issue #57: the directory-backed fake dispatch. The same three
# read verbs against `--remote file://<fake_remote>/bucket-spine` return
# byte-identical envelopes to their local counterparts (offline,
# tokenless). This is the restored `--remote` read-verb symmetry arm.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "trace-get-remote"
argv = ["trace", "get", "{trace_id}", "--remote", "file://{fake_remote}/bucket-spine", "--json"]

[[assertions]]
kind = "returncode"
step = "trace-get-remote"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "trace-get-remote"
path = "trace.trace_id"
equals_var = "trace-get-local:trace.trace_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "trace-get-remote"
path = "trace.session_id"
equals_var = "trace-get-local:trace.session_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "trace-get-remote"
path = "trace.patches"
equals_var = "trace-get-local:trace.patches"

[[steps]]
type = "cli"
id = "ctx-list-remote"
argv = ["ctx", "list", "--remote", "file://{fake_remote}/bucket-spine", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-list-remote"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-list-remote"
path = "traces"
equals_var = "ctx-list-local:traces"

[[steps]]
type = "cli"
id = "ctx-info-remote"
argv = ["ctx", "info", "{trace_id}", "--remote", "file://{fake_remote}/bucket-spine", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-info-remote"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-info-remote"
path = "info"
equals_var = "ctx-info-local:info"
