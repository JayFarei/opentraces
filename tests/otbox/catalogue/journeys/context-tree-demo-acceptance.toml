name = "context-tree-demo-acceptance"
description = """
Plan 077 keystone journey — the v1 acceptance test, mechanized.

Plan 077 §"The demo" pins eight copy-pasteable commands that prove
the Context Tree substrate is navigable end-to-end on a real
captured session. This journey runs those eight commands in
sequence, asserts the SHIPPED contract at each step, and (run with
--save-transcript) regenerates the committed markdown artifact at
`tests/otbox/captures/context-tree-demo/transcript.md` — the
conviction event: a human reads the committed transcript and
verifies the substrate works without running anything.

Silver tier per plan 077 §"Two tiers": step 6 (`claude --resume`)
is structural verification of the pruned JSONL (parse + uuid-set
equality against the prune packet), not a live agent invocation.
Deterministic in CI. Gold variant (PTY runner) deferred to v1.1.

Issue #42 re-spec deltas from the plan-077 draft (shipped-envelope
truth): `ctx step` emits `opentraces.context_tree.v1` with layer ids
under `layers.<type>.layer_id`; read rows are
{step_index, node_id, uuid, role, content_hash} (no
result_uuid/result_bytes/tool_name); write rows are
{step_index, node_id, uuid, role, content_hash, transcript_offset}
(no tool_name/target_path/mutation_kind) and `--with-trail-anchor`
joins the per-node hint which the claude_code JSONL path leaves
null (asserted verbatim as `"trail_anchor_hint": null` — the
documented honest gap; the populated-anchor half lives on the codex
world, see context-tree-temporal-anchor-precision); `ctx prune`
requires `--source-jsonl` and uses the verbatim stem; the drafted
`ctx verify-session` verb does not exist — step 6 is a python
parse-check shell step cross-checked against the prune packet via
equals_var; `trace query` is read-only and requires a filter
(--lex); `ctx diff` nests under `diff.*`.

Forks from `c-context-tree-substrate` (the multi-turn fixture — its
3-Edits-in-3-commits shape is what makes the --from-step 5
--to-step 9 range meaningful).
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["context-tree-demo"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-context-tree-substrate"]

# Plan 077 §"Demo acceptance journey" — the transcript artifact is
# the v1 acceptance proof, regenerated via
# `otbox journey context-tree-demo-acceptance --save-transcript <path>`.
[artifacts]
transcript = "tests/otbox/captures/context-tree-demo/transcript.md"

[preconditions]
min_captured_traces = 1
context_tree_built = true
# The demo's --from-step 5 --to-step 9 range needs the multi-turn
# fixture, which produces >= 3 Edit steps across the session.
requires_edit_commits_min = 3

# =====================================================================
# 1. show the tree (`opentraces ctx tree $TRACE`)
# =====================================================================
[[steps]]
type = "cli"
id = "demo-1-tree"
argv = ["ctx", "tree", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "demo-1-tree"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "demo-1-tree"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "demo-1-tree"
path = "trace_id"
equals = "{trace_id}"

# Multi-turn fixture pins the node count; the runner expands
# {expected_node_count} from the live event log.
[[assertions]]
kind = "stdout_json_length_equals"
step = "demo-1-tree"
path = "nodes"
equals_var = "expected_node_count"

[[assertions]]
kind = "stdout_json"
step = "demo-1-tree"
path = "active_leaf_id"

# =====================================================================
# 2. drill into step 7 (`opentraces ctx step $TRACE 7`)
# =====================================================================
[[steps]]
type = "cli"
id = "demo-2-step"
argv = ["ctx", "step", "{trace_id}", "7", "--json"]

[[assertions]]
kind = "returncode"
step = "demo-2-step"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "demo-2-step"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "demo-2-step"
path = "node.step_index"
equals = 7

[[assertions]]
kind = "stdout_json"
step = "demo-2-step"
path = "node.node_id"
equals = "{step_7_node_id}"

# All four layer references present (the cross-substrate join
# contract; shipped location: layers.<type>.layer_id).
[[assertions]]
kind = "stdout_json"
step = "demo-2-step"
path = "layers.system.layer_id"

[[assertions]]
kind = "stdout_json"
step = "demo-2-step"
path = "layers.messages.layer_id"

[[assertions]]
kind = "stdout_json"
step = "demo-2-step"
path = "layers.tool_registry.layer_id"

[[assertions]]
kind = "stdout_json"
step = "demo-2-step"
path = "layers.runtime_state.layer_id"

# =====================================================================
# 3. what did the agent SEE between steps 5 and 9?
#    (`opentraces ctx reads $TRACE --from-step 5 --to-step 9 --json`)
# =====================================================================
[[steps]]
type = "cli"
id = "demo-3-reads"
argv = ["ctx", "reads", "{trace_id}", "--from-step", "5", "--to-step", "9", "--json"]

[[assertions]]
kind = "returncode"
step = "demo-3-reads"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "demo-3-reads"
path = "schema_version"
equals = "opentraces.context_reads.v1"

# At least one read row in the 5..9 window, with the shipped
# {step_index, node_id, uuid, role, content_hash} row shape.
[[assertions]]
kind = "stdout_json"
step = "demo-3-reads"
path = "reads.0.step_index"

[[assertions]]
kind = "stdout_json"
step = "demo-3-reads"
path = "reads.0.node_id"

[[assertions]]
kind = "stdout_json"
step = "demo-3-reads"
path = "reads.0.uuid"

[[assertions]]
kind = "stdout_json"
step = "demo-3-reads"
path = "reads.0.content_hash"

# =====================================================================
# 4. what did the agent WRITE in the same range?
#    (`opentraces ctx writes $TRACE --from-step 5 --to-step 9 --with-trail-anchor`)
# =====================================================================
[[steps]]
type = "cli"
id = "demo-4-writes"
argv = [
    "ctx", "writes", "{trace_id}",
    "--from-step", "5", "--to-step", "9",
    "--with-trail-anchor", "--json",
]

[[assertions]]
kind = "returncode"
step = "demo-4-writes"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "demo-4-writes"
path = "schema_version"
equals = "opentraces.context_writes.v1"

# Shipped write-row shape: uuid / role / transcript_offset.
[[assertions]]
kind = "stdout_json"
step = "demo-4-writes"
path = "writes.0.uuid"

[[assertions]]
kind = "stdout_json"
step = "demo-4-writes"
path = "writes.0.role"
equals = "assistant"

[[assertions]]
kind = "stdout_json"
step = "demo-4-writes"
path = "writes.0.transcript_offset"

# --with-trail-anchor joins the per-node hint; on the claude_code
# JSONL path the hint is the documented null (the key is PRESENT,
# its value honestly null — asserted verbatim on the rendered JSON).
[[assertions]]
kind = "stdout_contains"
step = "demo-4-writes"
value = "\"trail_anchor_hint\": null"

# =====================================================================
# 5a. prune to step 7 dry-run
#     (`opentraces ctx prune $NODE --source-jsonl ... --to-session rewind-step7`)
# =====================================================================
[[steps]]
type = "cli"
id = "demo-5a-prune-dryrun"
argv = [
    "ctx", "prune", "{step_7_node_id}",
    "--source-jsonl", "{transcript_path}",
    "--to-session", "rewind-step7",
    "--json",
]

[[assertions]]
kind = "returncode"
step = "demo-5a-prune-dryrun"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "demo-5a-prune-dryrun"
path = "schema_version"
equals = "opentraces.context_resume.v1"

[[assertions]]
kind = "stdout_json"
step = "demo-5a-prune-dryrun"
path = "wrote"
equals = false

[[assertions]]
kind = "stdout_json"
step = "demo-5a-prune-dryrun"
path = "record_count"

# =====================================================================
# 5b. prune to step 7 with --write
# =====================================================================
[[steps]]
type = "cli"
id = "demo-5b-prune-write"
argv = [
    "ctx", "prune", "{step_7_node_id}",
    "--source-jsonl", "{transcript_path}",
    "--to-session", "rewind-step7",
    "--write", "--json",
]

[[assertions]]
kind = "returncode"
step = "demo-5b-prune-write"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "demo-5b-prune-write"
path = "schema_version"
equals = "opentraces.context_resume.v1"

[[assertions]]
kind = "stdout_json"
step = "demo-5b-prune-write"
path = "new_session_id"
equals = "rewind-step7"

[[assertions]]
kind = "stdout_json"
step = "demo-5b-prune-write"
path = "wrote"
equals = true

[[assertions]]
kind = "stdout_json_contains"
step = "demo-5b-prune-write"
path = "jsonl_path"
value = "rewind-step7.jsonl"

# The write reports the same record count the dry-run promised.
[[assertions]]
kind = "stdout_json_equals_var"
step = "demo-5b-prune-write"
path = "record_count"
equals_var = "demo-5a-prune-dryrun:record_count"

# =====================================================================
# 6. (SILVER variant per plan 077) — structural verification of the
#    pruned JSONL in lieu of `claude --resume`: every line parses as
#    a Claude Code JSONL record and the uuid sequence equals the
#    prune packet's uuid_set. (The drafted `ctx verify-session` verb
#    does not exist; this is the equivalent check through the
#    box-installed python, cross-checked via equals_var.)
# =====================================================================
[[steps]]
type = "shell"
id = "demo-6-verify-pruned"
argv = [".testvenv/bin/python", "-c", "import json, os, sys; p = os.path.join(os.path.dirname(sys.argv[1]), 'rewind-step7.jsonl'); recs = [json.loads(l) for l in open(p, encoding='utf-8') if l.strip()]; print(json.dumps({'parse_ok': all(isinstance(r, dict) for r in recs), 'record_count': len(recs), 'uuids': [r.get('uuid') for r in recs]}))", "{transcript_path}"]

[[assertions]]
kind = "returncode"
step = "demo-6-verify-pruned"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "demo-6-verify-pruned"
path = "parse_ok"
equals = true

# The on-disk record count equals what the prune packet reported.
[[assertions]]
kind = "stdout_json_equals_var"
step = "demo-6-verify-pruned"
path = "record_count"
equals_var = "demo-5b-prune-write:record_count"

# uuid_set_matches, mechanized: the on-disk uuid sequence equals the
# packet's uuid_set (active-path order), element-wise.
[[assertions]]
kind = "stdout_json_array_equals"
step = "demo-6-verify-pruned"
path = "uuids"
equals_var = "demo-5b-prune-write:uuid_set"

# =====================================================================
# 7. (SILVER variant) — the trace surface round-trips: the read-only
#    Trace Index answers a lexical query over the captured session.
#    (`trace query` requires a filter; --lex hits the fixture's
#    "helper" prompts.)
# =====================================================================
[[steps]]
type = "cli"
id = "demo-7-trace-query"
argv = ["trace", "query", "--lex", "helper", "--limit", "1", "--json"]

[[assertions]]
kind = "returncode"
step = "demo-7-trace-query"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "demo-7-trace-query"
path = "candidates.0.trace_id"

# =====================================================================
# 8. confirm the pre-fork node is byte-identical
#    (`opentraces ctx diff <step-7-node> <step-7-node> --layer messages`)
#    Identity property: the canonical "no changes" envelope when
#    comparing a node to itself. Shipped shape nests under `diff`.
# =====================================================================
[[steps]]
type = "cli"
id = "demo-8-diff"
argv = [
    "ctx", "diff", "{step_7_node_id}", "{step_7_node_id}",
    "--layer", "messages", "--json",
]

[[assertions]]
kind = "returncode"
step = "demo-8-diff"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "demo-8-diff"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json_length_equals"
step = "demo-8-diff"
path = "diff.added"
equals = 0

[[assertions]]
kind = "stdout_json_length_equals"
step = "demo-8-diff"
path = "diff.removed"
equals = 0

[[assertions]]
kind = "stdout_json_length_equals"
step = "demo-8-diff"
path = "diff.changed"
equals = 0
