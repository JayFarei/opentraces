name = "trail-mature-updates-patch-anchor"
description = """
Plan 080 Phase A mechanism journey — `trail mature --commit <sha>`
(or, equivalently, the post-commit hook firing on `git commit`) sets
`Patch.anchor` on each matched Patch in the trace, populates the
derived legacy fields, and persists the result.

Asserts (per plan 080 §12 Phase A + §20 Resolution L):
  (a) Initial state: trace has `patches[]` populated by capture; for
      every patch, `anchor is None` (never searched).
  (b) After a Git commit lands AND the post-commit hook runs, the
      matched patches have `anchor.found == true` with
      `last_searched_at` set, `commit_sha` set, `evidence_tier` set
      (one of the 10 Trails vocab values), `evidence_firmness` set.
  (c) Derived `outcome.committed == true`.
  (d) Derived `outcome.commit_sha` equals the latest patch's
      `anchor.commit_sha`.
  (e) Derived `git_links` includes at least one entry whose `tier`
      maps from the patch's `evidence_tier` per the projection
      table in plan 080 Resolution C.
  (f) `lifecycle == "final"`.
  (g) On `git commit --amend`, the previous commit_sha is pushed
      onto `Patch.superseded_by` (newest-first), `anchor.commit_sha`
      is overwritten with the new sha, and derived `git_links`
      reflects ALL of `[anchor.commit_sha] + superseded_by`.

Fails today because:
  - Phase A Wave 2 Track 2 (post-commit hook) just landed; checkpoint
    has not yet been promoted to gold-tier.
  - tier=1 (opt-in) until Phase A checkpoint
    `c-trace-spine-v060-anchored` + `c-trace-spine-v060-amended`
    land.
"""
lane = "core"
tier = 1
tier_label = "gold"
trajectories = ["trace-spine"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-captured-real-session"]

[preconditions]
min_captured_traces = 1
git_repo_present = true
post_commit_hook_installed = true

# ---------------------------------------------------------------------
# Step 1 — baseline trace get. patches[] present, anchors null.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "baseline-trace-get"
argv = ["trace", "get", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "baseline-trace-get"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "baseline-trace-get"
path = "trace.patches"

# ---------------------------------------------------------------------
# Step 2 — write a small change in the workspace and commit. The
# checkpoint already arranges the Edit tool calls to seed the
# trace's patches[]; this step just lands them in Git so the
# post-commit hook fires.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "land-commit"
argv = ["bash", "-lc", "git add -A && git commit -m 'plan 080 phase A: anchor commit' --no-verify || true"]

[[assertions]]
kind = "returncode"
step = "land-commit"
equals = 0

# ---------------------------------------------------------------------
# Step 3 — `trail mature` explicitly (idempotent with post-commit
# hook; running both gives the same result).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "trail-mature"
argv = ["trail", "mature", "--commit", "HEAD", "--json"]

[[assertions]]
kind = "returncode"
step = "trail-mature"
equals = 0

# ---------------------------------------------------------------------
# Step 4 — post-anchor trace get; assert anchor + derived fields.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "post-anchor-trace-get"
argv = ["trace", "get", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "post-anchor-trace-get"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "post-anchor-trace-get"
path = "trace.outcome.committed"

[[assertions]]
kind = "stdout_json"
step = "post-anchor-trace-get"
path = "trace.outcome.commit_sha"

[[assertions]]
kind = "stdout_json"
step = "post-anchor-trace-get"
path = "trace.lifecycle"

[[assertions]]
kind = "stdout_json"
step = "post-anchor-trace-get"
path = "trace.git_links"

# ---------------------------------------------------------------------
# Step 5 — amend the commit. anchor.commit_sha should overwrite;
# superseded_by should grow newest-first.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "amend-commit"
argv = ["bash", "-lc", "git commit --amend --no-edit --no-verify"]

[[assertions]]
kind = "returncode"
step = "amend-commit"
equals = 0

[[steps]]
type = "cli"
id = "post-amend-mature"
argv = ["trail", "mature", "--commit", "HEAD", "--json"]

[[assertions]]
kind = "returncode"
step = "post-amend-mature"
equals = 0

[[steps]]
type = "cli"
id = "post-amend-trace-get"
argv = ["trace", "get", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "post-amend-trace-get"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "post-amend-trace-get"
path = "trace.patches.0.superseded_by"
