name = "enable-security-tools"
description = """
Security tool opt-in (plan 063 §1: `configure-security-detectors` +
`configure-security-reviewer`): `setup trufflehog` configures the
optional TruffleHog detector; `setup privacy-filter` configures the
optional `openai/privacy-filter` PII detector; `setup llm-review`
configures the optional LLM dataset-row reviewer. Journey asserts the
help surfaces.
"""
lane = "core"
tier = 0
seed = "smoke"
trajectories = ["configure-security-detectors", "configure-security-reviewer"]
persona = "both"
requires = ["cli"]

[[steps]]
type = "cli"
id = "trufflehog-help"
argv = ["setup", "trufflehog", "--help"]

[[steps]]
type = "cli"
id = "privacy-filter-help"
argv = ["setup", "privacy-filter", "--help"]

[[steps]]
type = "cli"
id = "llm-review-help"
argv = ["setup", "llm-review", "--help"]

[[assertions]]
kind = "stdout_contains"
step = "trufflehog-help"
value = "TruffleHog"

[[assertions]]
kind = "stdout_contains"
step = "privacy-filter-help"
value = "privacy-filter"

[[assertions]]
kind = "stdout_contains"
step = "llm-review-help"
value = "LLM"
