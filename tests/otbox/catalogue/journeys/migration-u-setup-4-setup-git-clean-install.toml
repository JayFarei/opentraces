name = "migration-u-setup-4-setup-git-clean-install"
description = """
Upgrade-UAT U-setup-4/U-setup-6 (P0). `setup git` installs the post-commit
correlator cleanly on an upgraded legacy repo that has NO prior opentraces
event log or notes ref: rc=0, the owned hook is present, the hook chain is
present, and a second run is idempotent (no duplicate hook).

Forks from `c-legacy-v033`.
"""
lane = "core"
tier = 0
tier_label = "silver"
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-legacy-v033"]

[preconditions]
legacy_world_restored = true
pre_migration_schema = "0.3.0"

[[steps]]
type = "cli"
id = "setup-git-1"
argv = ["--json", "setup", "git"]

[[steps]]
type = "cli"
id = "setup-git-2"
argv = ["--json", "setup", "git"]

[[assertions]]
kind = "returncode"
step = "setup-git-1"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "setup-git-1"
path = "status"
equals = "ok"

[[assertions]]
kind = "stdout_json"
step = "setup-git-1"
path = "state.installed"
equals = true

[[assertions]]
kind = "stdout_json"
step = "setup-git-1"
path = "state.owned_hook_present"
equals = true

[[assertions]]
kind = "stdout_json"
step = "setup-git-1"
path = "state.chain_present"
equals = true

# Idempotent re-install: still installed, no error.
[[assertions]]
kind = "returncode"
step = "setup-git-2"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "setup-git-2"
path = "state.installed"
equals = true
