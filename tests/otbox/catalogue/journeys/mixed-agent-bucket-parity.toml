name = "mixed-agent-bucket-parity"
description = """
Plan 083 C8: mixed Claude/Codex bucket parity. The checkpoint composes
the frozen Claude add-helper-function capture with a Codex capture and
proves the bucket manifest, verify, and replay surfaces remain usable.
"""
lane = "core"
tier = 0
tier_label = "gold"
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-mixed-agent-parity-bucket"]
plan_083_matrix_ids = ["C8"]
status = "artifact-backed-composite"

[preconditions]
min_captured_traces = 2
context_tree_built = true

[[steps]]
type = "cli"
id = "bucket-status"
argv = ["bucket", "status", "--json"]

[[steps]]
type = "cli"
id = "bucket-manifest"
argv = ["bucket", "manifest", "--json"]

[[steps]]
type = "cli"
id = "bucket-verify"
argv = ["bucket", "verify", "--sample", "2", "--json"]

[[steps]]
type = "cli"
id = "bucket-replay"
argv = ["bucket", "replay", "--repo", "{project}", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-status"
equals = 0

[[assertions]]
kind = "returncode"
step = "bucket-manifest"
equals = 0

[[assertions]]
kind = "stdout_json_length_equals"
step = "bucket-manifest"
path = "manifest.traces"
equals = 2

[[assertions]]
kind = "stdout_contains"
step = "bucket-manifest"
value = "claude-code"

[[assertions]]
kind = "stdout_contains"
step = "bucket-manifest"
value = "codex-cli"

[[assertions]]
kind = "returncode"
step = "bucket-verify"
equals = 0

[[assertions]]
kind = "returncode"
step = "bucket-replay"
equals = 0
