name = "migration-u-ds-4-live-hf-publish"
description = """
Upgrade-UAT U-ds-4 (P0, LIVE leg). The real-HuggingFace counterpart to
migration-u-ds-4-spine-to-published-shard: the full dataset publish spine runs
from a migrated 0.3.3 project all the way to a REAL private HF dataset repo
({live_dataset_repo}, provisioned per box), proving a 0.3.3 upgrader can publish
0.6.0 dataset rows to huggingface.co after the jump.

Forks from `c-legacy-v033` (the restored 0.3.3 world). Requires the opt-in
`live_hf` capability, so it SKIPs in default CI and only runs under
`OT_OTBOX_LIVE_HF=1` with a resolvable token. The sharded JSONL + dataset_infos.json
landing on huggingface.co is verified repo-side by the live runner
(private=True, dataset_infos.json + data/ shards present), the ephemeral repo is
deleted on pass.
"""
lane = "core"
tier = 1
persona = "agent"
requires = ["cli", "git", "live_hf"]
from_checkpoints = ["c-legacy-v033"]

[preconditions]
legacy_world_restored = true
pre_migration_schema = "0.3.0"

# 0.4 first-touch so the legacy trace resolves in the index.
[[steps]]
type = "cli"
id = "index-rebuild"
argv = ["trace", "index", "rebuild"]

[[steps]]
type = "cli"
id = "query"
argv = ["trace", "query", "farewell"]

[[steps]]
type = "write_file"
id = "write-rows"
path = "live_migrated_rows.jsonl"
content = """
{"source_trace_id": "{legacy_trace_id}", "summary": "live: migrated 0.3.3 trace published to real HF"}
"""

[[steps]]
type = "write_file"
id = "write-schema"
path = "live_migrated_schema.json"
content = """
{"type": "object", "properties": {"source_trace_id": {"type": "string"}, "summary": {"type": "string"}}, "required": ["source_trace_id", "summary"]}
"""

[[steps]]
type = "cli"
id = "dataset-new"
argv = ["dataset", "new", "live-migrated", "--rows-file", "live_migrated_rows.jsonl", "--schema", "live_migrated_schema.json"]

# Bind the REAL private HF dataset remote.
[[steps]]
type = "cli"
id = "remote-create"
argv = ["dataset", "remote", "create", "live-migrated", "{live_dataset_repo}", "--private"]

[[steps]]
type = "cli"
id = "review-approve"
argv = ["dataset", "review", "approve", "live-migrated", "--all"]

# Publish to the REAL HF remote.
[[steps]]
type = "cli"
id = "publish"
argv = ["dataset", "publish", "live-migrated"]

[[assertions]]
kind = "returncode"
step = "index-rebuild"
equals = 0

[[assertions]]
kind = "returncode"
step = "query"
equals = 0

[[assertions]]
kind = "returncode"
step = "dataset-new"
equals = 0

[[assertions]]
kind = "returncode"
step = "remote-create"
equals = 0

[[assertions]]
kind = "returncode"
step = "review-approve"
equals = 0

[[assertions]]
kind = "returncode"
step = "publish"
equals = 0

[[assertions]]
kind = "stdout_contains"
step = "publish"
value = "published: rows=1"
