name = "pi-context-tree-provider-fidelity"
description = "Plan 091 Pi provider/context sidecars surface live Context Tree fidelity."
lane = "core"
tier = 0
tier_label = "gold"
persona = "agent"
requires = ["cli", "git"]
status = "synthetic-or-artifact-backed"
from_checkpoints = ["c-captured-pi-provider-context"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

[[steps]]
type = "cli"
id = "ctx-tree"
argv = ["ctx", "tree", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "ctx-step"
argv = ["ctx", "step", "{trace_id}", "2", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-tree"
equals = 0

[[assertions]]
kind = "returncode"
step = "ctx-step"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-step"
path = "node.trace_id"
equals = "{trace_id}"
