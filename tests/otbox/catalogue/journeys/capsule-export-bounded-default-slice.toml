name = "capsule-export-bounded-default-slice"
description = """
Issue #98 (Part A, SILVER) — `capsule export --product` is BOUNDED by
default, and `--product-full-span` is the explicit opt-in to the unbounded
episode.

There is no otbox assertion kind that subtracts two JSON paths, so the bound
is asserted via the deterministic limitation + metadata that A2 ALWAYS emits
on a matched product slice:

  Step 1 (default radius): `capsule export {trace_id} --product opentraces
    --json` → rc=0; `slice.limitations` CONTAINS `product_episode_bounded`
    (the cap was in effect); and `slice.metadata.product_match_span >= 9`
    (the RAW episode matched steps > 2*radius=8 apart, so the bound is
    load-bearing, not vacuous on a tiny episode).
  Step 2 (--product-full-span): the unbounded span is restored — no
    `product_episode_bounded`, and `slice.metadata.bounded_to` EQUALS
    `slice.metadata.product_match_span` (no clamp happened), proven via the
    cross-path `equals_var` within the step.

PRE-FLIGHT: the journey seeds an additive deterministic trace in the
initialized `c-captured-real-session` world. The seeded trace mentions
"opentraces" at steps 1 and 40, so the default radius=4 cap is load-bearing:
the raw span is > 8 and the bounded export must clamp it.

Tier 1 (opt-in).
"""
lane = "core"
tier = 1
tier_label = "silver"
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-captured-real-session"]

[preconditions]
min_captured_traces = 1

[[steps]]
type = "shell"
id = "seed-wide-product-trace"
argv = [
  "{py_bin}",
  "-c",
  """
from pathlib import Path
import sys

from opentraces_schema import Agent, Step, TraceRecord

from opentraces.core.bucket_store import write_trace_record
from opentraces.core.config import get_project_dir

project = Path(sys.argv[1])
trace_id = "issue-98-wide-product-trace"
steps = []
for i in range(1, 43):
    text = "routine capsule product-bound step " + str(i)
    role = "agent"
    if i == 1:
        text = "Please evaluate the opentraces capsule export path."
        role = "user"
    elif i == 40:
        text = "Return to opentraces and verify the export behavior."
        role = "user"
    steps.append(Step(step_index=i, role=role, content=text))

record = TraceRecord(
    trace_id=trace_id,
    session_id="issue-98-wide-product-session",
    agent=Agent(name="otbox-seeded-agent", model="otbox/model"),
    task=dict(description="Seed a wide product episode for capsule export."),
    dependencies=["opentraces"],
    steps=steps,
    outcome=dict(success=True, committed=False),
)
slug = get_project_dir(project).name
write_trace_record(record, project_slug=slug, source_layer="capture")
print(trace_id)
  """,
  "{project}",
]

[[assertions]]
kind = "returncode"
step = "seed-wide-product-trace"
equals = 0

# ---------------------------------------------------------------------
# Step 1 — default radius bounds the product episode (deterministic limitation
# + a raw span that proves the bound is load-bearing).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "export-bounded"
argv = ["capsule", "export", "issue-98-wide-product-trace", "--product", "opentraces", "--json"]

[[assertions]]
kind = "returncode"
step = "export-bounded"
equals = 0

[[assertions]]
kind = "stdout_json_set_contains"
step = "export-bounded"
path = "slice.limitations"
equals = ["product_episode_bounded"]

[[assertions]]
kind = "stdout_json_greater_equal"
step = "export-bounded"
path = "slice.metadata.product_match_span"
min = 9

# ---------------------------------------------------------------------
# Step 2 — --product-full-span restores the unbounded span (no clamp:
# bounded_to == product_match_span via cross-path equals_var).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "export-full-span"
argv = ["capsule", "export", "issue-98-wide-product-trace", "--product", "opentraces", "--product-full-span", "--json"]

[[assertions]]
kind = "returncode"
step = "export-full-span"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "export-full-span"
path = "slice.metadata.bounded_to"
equals_var = "export-full-span:slice.metadata.product_match_span"
