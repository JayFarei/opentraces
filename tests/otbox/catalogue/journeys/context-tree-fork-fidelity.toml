name = "context-tree-fork-fidelity"
description = """
Plan 077 substrate-fidelity journey #2 (gold) — `ctx prune --write`
produces a JSONL whose active-path shape matches the requested
mid-session resume point byte-for-byte.

The JSONL pruner (`prune_session_to_node`, R8) is the bridge that
turns "resume from step N" from a missing feature into a one-shell-
command `claude --resume <new-session-id>` operation. This journey
asserts the bridge holds three structural invariants:

  (a) `ctx prune --write --json` returns a fresh `new_session_id`
      whose source-JSONL trail is materialized at the reported
      `jsonl_path`.
  (b) The new JSONL's record count equals the active-path length
      from root to the chosen node, asserted via
      `stdout_json_length_equals` so an off-by-one in the pruner
      (drop the leaf, drop the root) fails loudly.
  (c) The new JSONL's record uuid set equals the active-path uuid
      slice, asserted two-way via `stdout_json_set_contains` so
      either direction (missing record OR extra record) fails.

Forks from `c-context-tree-substrate` (fixture: linear and multi-turn,
both stable). Fails today because neither the `opentraces ctx prune`
verb nor the underlying `prune_session_to_node` Phase 3 module exists
yet.
"""
lane = "core"
tier = 1  # PHASE-4: bump back to 0 once substrate ships
# Plan 077 §"Coverage gate updates" — gold coverage of R8 (JSONL
# pruner) and R7 (resume packet shape mirrored in pruner output).
tier_label = "gold"
trajectories = ["context-tree-fork"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-context-tree-substrate"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — resolve the target node (the step we want to resume at).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "step-target"
argv = ["ctx", "step", "{trace_id}", "{step_index}", "--json"]

[[assertions]]
kind = "returncode"
step = "step-target"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "step-target"
path = "schema_version"
equals = "opentraces.context_node.v1"

[[assertions]]
kind = "stdout_json"
step = "step-target"
path = "node.node_id"

[[assertions]]
kind = "stdout_json"
step = "step-target"
path = "node.trace_id"
equals = "{trace_id}"

# ---------------------------------------------------------------------
# Step 2 — compute the active-path length to that node. The
# `--leaf` flag walks root→leaf for the named branch tip; we pass
# the target node id and assert the returned path's length is
# strictly ≥1 (root + ≥0 descendants).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "active-path-to-node"
argv = ["ctx", "tree", "{trace_id}", "--leaf", "{target_node_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "active-path-to-node"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "active-path-to-node"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "active-path-to-node"
path = "active_leaf_id"
equals = "{target_node_id}"

# The fixture's `linear` shape pins exactly N=step_index+1 nodes from
# root to the Edit step; the runner expands `active_path_length` from
# the checkpoint audit.
[[assertions]]
kind = "stdout_json_length_equals"
step = "active-path-to-node"
path = "active_path"
equals_var = "active_path_length"

# ---------------------------------------------------------------------
# Step 3 — dry-run prune. Default output advertises the new session
# id + the count of records that would be written. Dry run NEVER
# touches disk; subsequent `--write` is the single source of truth.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "prune-dry-run"
argv = ["ctx", "prune", "{target_node_id}", "--to-session", "fork-fidelity", "--json"]

[[assertions]]
kind = "returncode"
step = "prune-dry-run"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "prune-dry-run"
path = "schema_version"
equals = "opentraces.context_resume.v1"

[[assertions]]
kind = "stdout_json"
step = "prune-dry-run"
path = "dry_run"
equals = true

# Length contract (b) — the dry-run reports the same record count
# the eventual write would produce.
[[assertions]]
kind = "stdout_json"
step = "prune-dry-run"
path = "record_count"
equals_var = "active_path_length"

# ---------------------------------------------------------------------
# Step 4 — write the new pruned JSONL. The CLI returns the new
# session id + on-disk jsonl_path; both must be present and
# coherent.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "prune-write"
argv = [
    "ctx", "prune", "{target_node_id}",
    "--to-session", "fork-fidelity",
    "--write", "--json",
]

[[assertions]]
kind = "returncode"
step = "prune-write"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "prune-write"
path = "schema_version"
equals = "opentraces.context_resume.v1"

[[assertions]]
kind = "stdout_json"
step = "prune-write"
path = "new_session_id"

[[assertions]]
kind = "stdout_json"
step = "prune-write"
path = "jsonl_path"

# Contract (b) — new JSONL record count equals active-path length to
# the requested node.
[[assertions]]
kind = "stdout_json"
step = "prune-write"
path = "record_count"
equals_var = "active_path_length"

# Contract (c) one direction — the new JSONL's uuid set contains
# every uuid on the active-path slice.
[[assertions]]
kind = "stdout_json_set_contains"
step = "prune-write"
path = "uuid_set"
equals_var = "active_path_uuid_set"

# Contract (c) reverse direction — the active-path slice contains
# every uuid in the new JSONL (no extras leaked in from orphan
# branches or post-node records).
[[assertions]]
kind = "stdout_json_array_equals"
step = "prune-write"
path = "uuid_set_sorted"
equals_var = "active_path_uuid_set_sorted"

# The pruned JSONL's runtime_state layer carries cwd + model probed
# from the source node; downstream `claude --resume` lands at the
# correct cwd because of this.
[[assertions]]
kind = "stdout_json"
step = "prune-write"
path = "runtime_state.cwd"
equals_var = "captured_cwd"

[[assertions]]
kind = "stdout_json"
step = "prune-write"
path = "runtime_state.model"
equals_var = "captured_model"

# ---------------------------------------------------------------------
# Step 5 — the on-disk JSONL exists where the CLI reported.
# ---------------------------------------------------------------------
[[assertions]]
kind = "path_exists"
path = "{home}/.claude/projects"
