name = "context-tree-fork-fidelity"
description = """
Plan 077 substrate-fidelity journey #2 (gold) — `ctx prune --write`
produces a JSONL whose active-path shape matches the requested
mid-session resume point exactly.

The JSONL pruner (`prune_session_to_node`, R8) is the bridge that
turns "resume from step N" from a missing feature into a one-shell-
command `claude --resume <new-session-id>` operation. This journey
asserts the bridge holds three structural invariants:

  (a) `ctx prune --write --json` returns the verbatim session stem
      whose JSONL is materialized at the reported `jsonl_path`.
  (b) The new JSONL's record count equals the active-path length
      from root to the chosen node (off-by-one in the pruner —
      drop the leaf, drop the root — fails loudly).
  (c) The new JSONL's record uuid set equals the active-path uuid
      slice two-way (`uuid_set` subset + `uuid_set_sorted` exact),
      so either direction (missing record OR extra record) fails.

Issue #42 re-spec deltas from the plan-077 draft: `ctx prune`
REQUIRES `--source-jsonl` (the shipped contract; {transcript_path}
is re-derived box-relative at expansion time); the dry-run flag in
the packet is `wrote: false` (not `dry_run: true`); `ctx step` emits
`opentraces.context_tree.v1`; the active-path payload key is
`nodes`; the uuid-set checks ride the additive `uuid_set` /
`uuid_set_sorted` packet keys; the draft's `runtime_state.cwd/model`
asserts are dropped (not part of the shipped prune packet — the
resume-side equivalent lives in `ctx resume`).

Forks from `c-context-tree-substrate` (multi-turn primary trace;
{target_node_id} = the step-3 first-Edit node, active path length 4).
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["context-tree-fork"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-context-tree-substrate"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

# ---------------------------------------------------------------------
# Step 1 — resolve the target node (the step we want to resume at).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "step-target"
argv = ["ctx", "step", "{trace_id}", "{step_index}", "--json"]

[[assertions]]
kind = "returncode"
step = "step-target"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "step-target"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "step-target"
path = "node.node_id"
equals = "{target_node_id}"

[[assertions]]
kind = "stdout_json"
step = "step-target"
path = "node.trace_id"
equals = "{trace_id}"

# ---------------------------------------------------------------------
# Step 2 — the active-path length to that node. `--leaf` walks
# root -> leaf for the named branch tip; the shipped payload key is
# `nodes`.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "active-path-to-node"
argv = ["ctx", "tree", "{trace_id}", "--leaf", "{target_node_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "active-path-to-node"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "active-path-to-node"
path = "schema_version"
equals = "opentraces.context_tree.v1"

[[assertions]]
kind = "stdout_json"
step = "active-path-to-node"
path = "active_leaf_id"
equals = "{target_node_id}"

# The multi-turn fixture pins the active path root -> first Edit; the
# runner expands {active_path_length} from the live event log.
[[assertions]]
kind = "stdout_json_length_equals"
step = "active-path-to-node"
path = "nodes"
equals_var = "active_path_length"

# ---------------------------------------------------------------------
# Step 3 — dry-run prune (`wrote: false`). Reports the same record
# count the eventual write produces; never touches disk.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "prune-dry-run"
argv = [
    "ctx", "prune", "{target_node_id}",
    "--source-jsonl", "{transcript_path}",
    "--to-session", "fork-fidelity",
    "--json",
]

[[assertions]]
kind = "returncode"
step = "prune-dry-run"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "prune-dry-run"
path = "schema_version"
equals = "opentraces.context_resume.v1"

[[assertions]]
kind = "stdout_json"
step = "prune-dry-run"
path = "wrote"
equals = false

# Length contract (b) — the dry-run reports the same record count
# the eventual write would produce.
[[assertions]]
kind = "stdout_json"
step = "prune-dry-run"
path = "record_count"
equals_var = "active_path_length"

# ---------------------------------------------------------------------
# Step 4 — write the new pruned JSONL.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "prune-write"
argv = [
    "ctx", "prune", "{target_node_id}",
    "--source-jsonl", "{transcript_path}",
    "--to-session", "fork-fidelity",
    "--write", "--json",
]

[[assertions]]
kind = "returncode"
step = "prune-write"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "prune-write"
path = "schema_version"
equals = "opentraces.context_resume.v1"

# Verbatim stem contract (issue #42 product fix).
[[assertions]]
kind = "stdout_json"
step = "prune-write"
path = "new_session_id"
equals = "fork-fidelity"

[[assertions]]
kind = "stdout_json"
step = "prune-write"
path = "wrote"
equals = true

[[assertions]]
kind = "stdout_json_contains"
step = "prune-write"
path = "jsonl_path"
value = "fork-fidelity.jsonl"

# Contract (b) — new JSONL record count equals active-path length to
# the requested node.
[[assertions]]
kind = "stdout_json"
step = "prune-write"
path = "record_count"
equals_var = "active_path_length"

# Contract (c) one direction — the new JSONL's uuid set contains
# every uuid on the active-path slice.
[[assertions]]
kind = "stdout_json_set_contains"
step = "prune-write"
path = "uuid_set"
equals_var = "active_path_uuid_set"

# Contract (c) reverse direction — sorted exact equality (no extras
# leaked in from orphan branches or post-node records).
[[assertions]]
kind = "stdout_json_array_equals"
step = "prune-write"
path = "uuid_set_sorted"
equals_var = "active_path_uuid_set_sorted"

# ---------------------------------------------------------------------
# Step 5 — the on-disk JSONL exists where the CLI reported (next to
# the source transcript).
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "pruned-jsonl-on-disk"
argv = ["bash", "-c", "test -f \"$(dirname {transcript_path})/fork-fidelity.jsonl\""]

[[assertions]]
kind = "returncode"
step = "pruned-jsonl-on-disk"
equals = 0
