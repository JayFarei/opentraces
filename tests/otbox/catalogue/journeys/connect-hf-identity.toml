name = "connect-hf-identity"
description = """
HuggingFace identity lifecycle (plan 063 §1: `connect-hf-identity`):
`auth login` / `auth whoami` / `auth logout`. Against a fresh
unauthenticated smoke seed, `auth whoami --json` MUST return rc=0 with
a documented logged-out envelope; `login --help` and `logout --help`
MUST surface the documented option contract.
"""
lane = "core"
tier = 0
seed = "smoke"
trajectories = ["connect-hf-identity"]
persona = "agent"
requires = ["cli"]

[[steps]]
type = "cli"
id = "whoami"
argv = ["auth", "whoami"]

[[steps]]
type = "cli"
id = "login-help"
argv = ["auth", "login", "--help"]

[[steps]]
type = "cli"
id = "logout-help"
argv = ["auth", "logout", "--help"]

[[assertions]]
kind = "returncode"
step = "whoami"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "whoami"
path = "authenticated"
equals = false

[[assertions]]
kind = "stdout_contains"
step = "login-help"
value = "HuggingFace"

[[assertions]]
kind = "stdout_contains"
step = "login-help"
value = "--device-timeout"

[[assertions]]
kind = "stdout_contains"
step = "logout-help"
value = "Log out"
