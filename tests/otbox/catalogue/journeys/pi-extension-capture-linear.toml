name = "pi-extension-capture-linear"
description = "Plan 091 Pi linear capture produces TraceRecord, Trails, Context Tree, bucket v2, and search surfaces."
lane = "core"
tier = 0
tier_label = "gold"
persona = "agent"
requires = ["cli", "git"]
status = "synthetic-or-artifact-backed"
from_checkpoints = ["c-captured-pi-real-session"]

[preconditions]
min_captured_traces = 1
context_tree_built = true

[[steps]]
type = "cli"
id = "bucket-status"
argv = ["bucket", "status", "--json"]

[[steps]]
type = "cli"
id = "bucket-verify-full"
argv = ["bucket", "verify", "--full", "--json"]

[[steps]]
type = "cli"
id = "trace-query-pi"
argv = ["trace", "query", "--facet", "agent.name=pi", "--json"]

[[steps]]
type = "cli"
id = "trace-get"
argv = ["trace", "get", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "trace-map"
argv = ["trace", "map", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "trace-slice"
argv = ["trace", "slice", "--around-step", "2", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "trail-graph"
argv = ["trail", "graph", "--trace", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "ctx-tree"
argv = ["ctx", "tree", "{trace_id}", "--json"]

[[steps]]
type = "cli"
id = "ctx-step"
argv = ["ctx", "step", "{trace_id}", "2", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-status"
equals = 0

[[assertions]]
kind = "returncode"
step = "bucket-verify-full"
equals = 0

[[assertions]]
kind = "returncode"
step = "trace-query-pi"
equals = 0

[[assertions]]
kind = "returncode"
step = "trace-get"
equals = 0

[[assertions]]
kind = "returncode"
step = "trace-map"
equals = 0

[[assertions]]
kind = "returncode"
step = "trace-slice"
equals = 0

[[assertions]]
kind = "returncode"
step = "trail-graph"
equals = 0

[[assertions]]
kind = "returncode"
step = "ctx-tree"
equals = 0

[[assertions]]
kind = "returncode"
step = "ctx-step"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "trace-get"
path = "trace.agent.name"
equals = "pi"

[[assertions]]
kind = "stdout_json"
step = "trace-map"
path = "trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "trace-slice"
path = "slices.0.trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "trail-graph"
path = "pivot_trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "ctx-tree"
path = "root_node_id"

[[assertions]]
kind = "stdout_json"
step = "ctx-step"
path = "node.trace_id"
equals = "{trace_id}"
