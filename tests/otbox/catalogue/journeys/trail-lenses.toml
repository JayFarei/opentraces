name = "trail-lenses"
description = """
CLI v7 Trace Trails lenses over one real anchored trace: the same
VCS-anchored lineage rendered through commit blame, the commit+trace
graph, batch survival tracking, and the per-trace lineage card.

`trail blame <sha>` (the DIRECT commit-blame form, not `blame commit`)
renders per-commit attribution; `trail graph` renders the commit+trace
graph; `trail track --all` emits per-patch survival JSONL; and the bare
`trail <trace_id>` lineage card returns the frozen
`opentraces.trail.lineage.v1` envelope — the lineage view carries NO
`survival` key (that lives on the `track` lens, not lineage).

NOTE (authoring): `trail track --all` batch mode emits per-patch survival
JSONL where EACH record carries the same top-level `schema_version`
(`opentraces.trail.track.v1`) the single-patch/anchor track path stamps, so
JSONL consumers see one identified survival shape across both modes; the batch
lens is asserted via rc=0 + the `survival_state` field and that schema_version.
"""
lane = "core"
tier = 0
tier_label = "gold"
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-captured-real-session"]

[preconditions]
min_captured_traces = 1

# ---------------------------------------------------------------------
# backfill the attribution cache over the captured commit history.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "backfill"
argv = ["backfill"]

[[assertions]]
kind = "returncode"
step = "backfill"
equals = 0

# ---------------------------------------------------------------------
# `trail blame <sha>` — the DIRECT commit-blame form.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "blame-direct"
argv = ["trail", "blame", "{commit_sha}"]

[[assertions]]
kind = "returncode"
step = "blame-direct"
equals = 0

[[assertions]]
kind = "stdout_contains"
step = "blame-direct"
value = "src/app.py"

# ---------------------------------------------------------------------
# `trail graph` — the commit + trace graph.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "graph"
argv = ["trail", "graph"]

[[assertions]]
kind = "returncode"
step = "graph"
equals = 0

[[assertions]]
kind = "stdout_contains"
step = "graph"
value = "seed: initial project"

# ---------------------------------------------------------------------
# `trail track --all` — batch per-patch survival JSONL.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "track-all"
argv = ["trail", "track", "--all", "--json", "--limit", "5"]

[[assertions]]
kind = "returncode"
step = "track-all"
equals = 0

[[assertions]]
kind = "stdout_contains"
step = "track-all"
value = "survival_state"

# Parity: each batch survival record self-describes with the same
# schema_version the single-patch track path stamps.
[[assertions]]
kind = "stdout_contains"
step = "track-all"
value = "opentraces.trail.track.v1"

# ---------------------------------------------------------------------
# bare `trail <trace_id>` — the frozen lineage envelope, NO survival key.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "lineage"
argv = ["trail", "{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "lineage"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "lineage"
path = "schema_version"
equals = "opentraces.trail.lineage.v1"

[[assertions]]
kind = "stdout_not_contains"
step = "lineage"
value = "survival"

# ---------------------------------------------------------------------
# `trail blame commit t:<trace>` — FORWARD (trace-mode) attribution.
# The rc=124 hang on this path is cured: it is bounded via the
# trace-scoped read seam (predicates-before-projection), so it TERMINATES
# and resolves the trace's edits to their commits (v7 PR-review fix).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "blame-forward"
argv = ["trail", "blame", "commit", "t:{trace_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "blame-forward"
equals = 0
