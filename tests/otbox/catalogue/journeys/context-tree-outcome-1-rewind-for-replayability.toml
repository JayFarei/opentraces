[[assertions]]
kind = "stdout_json"
step = "step-0-node"
path = "node.messages_layer_id"

[[assertions]]
kind = "stdout_json"
step = "step-0-node"
path = "node.tool_registry_layer_id"

[[assertions]]
kind = "stdout_json"
step = "step-0-node"
path = "node.runtime_state_layer_id"

[[steps]]
type = "cli"
id = "step-0-show"
argv = ["ctx", "step", "{trace_id}", "0", "--full", "--json"]

[[assertions]]
kind = "stdout_json"
step = "step-0-show"
path = "layers.system.completeness"
equals = "full"

[[assertions]]
kind = "stdout_json"
step = "step-0-show"
path = "layers.system.capture_method"
equals = "otel"

[[assertions]]
kind = "stdout_json"
step = "step-0-show"
path = "layers.system.content.assembled_prompt_bytes"

[[assertions]]
kind = "stdout_json"
step = "step-0-show"
path = "layers.messages.completeness"
equals = "full"

[[assertions]]
kind = "stdout_json"
step = "step-0-show"
path = "layers.messages.capture_method"
equals = "otel"

[[assertions]]
kind = "stdout_json"
step = "step-0-show"
path = "layers.tool_registry.completeness"
equals = "full"

[[assertions]]
kind = "stdout_json"
step = "step-0-show"
path = "layers.tool_registry.capture_method"
equals = "otel"

[[assertions]]
kind = "stdout_json_set_contains"
step = "step-0-show"
path = "layers.tool_registry.content.tool_names"
equals = ["Read", "Write", "Bash", "Edit"]

[[assertions]]
kind = "stdout_json"
step = "step-0-show"
path = "layers.runtime_state.completeness"
equals = "full"

[[assertions]]
kind = "stdout_json"
step = "step-0-show"
path = "layers.runtime_state.capture_method"
equals = "otel"

[[assertions]]
kind = "stdout_json"
step = "step-0-show"
path = "layers.runtime_state.content.model"

[[assertions]]
kind = "stdout_json"
step = "step-0-show"
path = "layers.runtime_state.content.max_tokens"

[[assertions]]
kind = "stdout_json"
step = "step-0-show"
path = "layers.runtime_state.content.stream"

