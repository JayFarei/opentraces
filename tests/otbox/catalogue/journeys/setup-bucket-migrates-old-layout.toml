name = "setup-bucket-migrates-old-layout"
description = """
Plan 080 mechanism journey (GOLD) — `setup bucket --migrate --json`
converts a Plan 079 layout (`bucket/contexts/v1/...`) into the Plan 080
layout (`bucket/traces/v1/` + `bucket/blobs/v1/` + `bucket/events/v1/`
+ manifest v2) via write-new-and-swap.

Setup (c-bucket-spine-v1-legacy-fixture): an anchored world whose
bucket has been devolved to the plan-079 shape (contexts/v1 present;
traces/v1 + events/v1 + blobs/v1 + manifest removed).

Asserts:
  (a) Fixture starts with `bucket/contexts/v1/` present and
      `bucket/traces/v1/` ABSENT.
  (b) `setup bucket --migrate --json` exits 0 reporting
      from_layout == "v1_plan79", to_layout == "v2",
      traces_migrated >= 1, status == "ok", and the legacy tree
      renamed aside (legacy_aside populated).
  (c) Post-migration the v2 spine exists on disk (traces/v1 trace.json,
      events/v1 batches) and `bucket manifest --json` returns the v2
      shape with the migrated trace.
  (d) Re-running `setup bucket --migrate` is a no-op: it reports
      from_layout == "v2" with status "ok" and migrates nothing.

Re-specced for issue #42 (un-quarantine): the authored keys
`bucket.layout_state` / `bucket.migration_hint` /
`migration.layout_swap == "atomic"` / `migration.backup_path` /
`migration.idempotent_noop` never existed — the shipped envelope is
`{status, migrate: {from_layout, to_layout, traces_migrated,
blobs_migrated, status, legacy_aside, ...}}` and idempotency is
signalled by the second run's `from_layout == "v2"` short-circuit.
The v1-baseline probe is a filesystem assertion (path_exists/
path_not_exists) instead of the unimplemented status keys.
The journey declares only the in-vocab `min_captured_traces`
precondition: `context_tree_built`'s runtime probe looks for a context
companion in the bucket, which the v1-devolved bucket deliberately
lacks until the migration runs.
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-bucket-spine-v1-legacy-fixture"]

[preconditions]
min_captured_traces = 1

# ---------------------------------------------------------------------
# Step 1 — baseline: v1 layout present, v2 spine absent.
#
# NOTE: journey assertions evaluate AFTER every step, so the pre-state
# cannot be pinned with path_not_exists here (the migration re-creates
# traces/v1). The v1 baseline is proven by the migration envelope
# itself: `migrate.from_layout == "v1_plan79"` is only returned when
# the detector found contexts/v1 present AND the v2 spine absent.
# The contexts/v1 tree survives migration (copied verbatim), so its
# presence can still be asserted on the end state.
# ---------------------------------------------------------------------
[[assertions]]
kind = "path_exists"
path = "{opentraces_dir}/bucket/contexts/v1"

# ---------------------------------------------------------------------
# Step 2 — `setup bucket --migrate --json` runs the migration.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "migrate-execute"
argv = ["setup", "bucket", "--migrate", "--json"]

[[assertions]]
kind = "returncode"
step = "migrate-execute"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "migrate-execute"
path = "status"
equals = "ok"

[[assertions]]
kind = "stdout_json"
step = "migrate-execute"
path = "migrate.from_layout"
equals = "v1_plan79"

[[assertions]]
kind = "stdout_json"
step = "migrate-execute"
path = "migrate.to_layout"
equals = "v2"

[[assertions]]
kind = "stdout_json_greater_equal"
step = "migrate-execute"
path = "migrate.traces_migrated"
min = 1

[[assertions]]
kind = "stdout_json"
step = "migrate-execute"
path = "migrate.status"
equals = "ok"

# Write-new-and-swap: the legacy tree is renamed aside, not destroyed.
[[assertions]]
kind = "stdout_json"
step = "migrate-execute"
path = "migrate.legacy_aside"

# ---------------------------------------------------------------------
# Step 3 — post-migration: the v2 spine exists on disk.
# ---------------------------------------------------------------------
[[assertions]]
kind = "file_count_min"
path = "{opentraces_dir}/bucket/traces/v1"
glob = "**/trace.json"
min = 1

[[assertions]]
kind = "file_count_min"
path = "{opentraces_dir}/bucket/events/v1/batches"
glob = "*.jsonl.gz"
min = 1

# manifest is the v2 shape with the migrated trace.
[[steps]]
type = "cli"
id = "migrate-post-manifest-v2"
argv = ["bucket", "manifest", "--json"]

[[assertions]]
kind = "returncode"
step = "migrate-post-manifest-v2"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "migrate-post-manifest-v2"
path = "manifest.schema_version"
equals = "opentraces.bucket.manifest.v2"

[[assertions]]
kind = "stdout_json"
step = "migrate-post-manifest-v2"
path = "manifest.traces.0.trace_path"

[[assertions]]
kind = "stdout_json"
step = "migrate-post-manifest-v2"
path = "manifest.traces.0.trace_id"
equals = "{trace_id}"

[[assertions]]
kind = "stdout_json"
step = "migrate-post-manifest-v2"
path = "manifest.events_v1.batch_count"

# ---------------------------------------------------------------------
# Step 4 — re-running migration is a no-op (already v2).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "migrate-idempotent"
argv = ["setup", "bucket", "--migrate", "--json"]

[[assertions]]
kind = "returncode"
step = "migrate-idempotent"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "migrate-idempotent"
path = "migrate.from_layout"
equals = "v2"

[[assertions]]
kind = "stdout_json"
step = "migrate-idempotent"
path = "migrate.status"
equals = "ok"

[[assertions]]
kind = "stdout_json"
step = "migrate-idempotent"
path = "migrate.traces_migrated"
equals = 0
