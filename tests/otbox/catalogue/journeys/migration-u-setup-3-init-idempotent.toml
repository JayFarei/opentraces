name = "migration-u-setup-3-init-idempotent"
description = """
Upgrade-UAT U-setup-3 (P0). Re-enrolling an already-enrolled legacy project on
0.4 is idempotent: `init --agent claude-code` over an existing .opentraces.json
marker + state.json returns rc=0 with a clear "Already initialized" status,
does not duplicate the marker, and a second run is also a no-op.

Forks from `c-legacy-v033`.
"""
lane = "core"
tier = 0
tier_label = "silver"
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-legacy-v033"]

[preconditions]
legacy_world_restored = true
pre_migration_schema = "0.3.0"

[[steps]]
type = "cli"
id = "init-1"
argv = ["--json", "init", "--agent", "claude-code"]

[[steps]]
type = "cli"
id = "init-2"
argv = ["--json", "init", "--agent", "claude-code"]

[[assertions]]
kind = "returncode"
step = "init-1"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "init-1"
path = "status"
equals = "ok"

[[assertions]]
kind = "stdout_json"
step = "init-1"
path = "message"
equals = "Already initialized"

# Second re-enroll is also a clean no-op (idempotent).
[[assertions]]
kind = "returncode"
step = "init-2"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "init-2"
path = "message"
equals = "Already initialized"
