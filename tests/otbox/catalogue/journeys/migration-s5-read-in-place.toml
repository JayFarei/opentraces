name = "migration-s5-read-in-place"
description = """
Plan 085 S5 — legacy traces remain readable in-place (RESOLVED:
read-in-place). 0.3.3 had no bucket subsystem at all, so there is
nothing to migrate INTO a bucket — the bucket is a 0.4-only concept.

The contract is therefore: a 0.3.3 user's `traces/*.jsonl` stay fully
readable on 0.4, and the bucket holds only 0.4+ captures. This journey
asserts read-in-place is non-lossy and that the bucket / context-tree
surfaces honestly report an empty bucket on a freshly-restored legacy
world (no forced/auto adoption).

Forks from `c-legacy-v033`. There is deliberately NO `bucket adopt-legacy`
step — that opt-in is out of scope per the S5 product decision (run log
2026-05-28). See S12 for the post-capture world where the 0.4 pipeline
naturally materialises the bucket.
"""
lane = "core"
tier = 0
tier_label = "silver"
persona = "agent"
requires = ["cli", "git"]
from_checkpoints = ["c-legacy-v033"]

[preconditions]
legacy_world_restored = true

# --- the legacy trace is readable in-place via the index -----------------
[[steps]]
type = "cli"
id = "index-rebuild"
argv = ["trace", "index", "rebuild"]

[[steps]]
type = "cli"
id = "query"
argv = ["trace", "query", "farewell", "--json"]

# --- the bucket is empty: no legacy adoption happened --------------------
[[steps]]
type = "cli"
id = "ctx-list"
argv = ["ctx", "list", "--json"]

[[steps]]
type = "cli"
id = "bucket-status"
argv = ["bucket", "status", "--json"]

[[assertions]]
kind = "returncode"
step = "query"
equals = 0

# Legacy trace is fully readable in-place.
[[assertions]]
kind = "stdout_json"
step = "query"
path = "candidates.0.candidate_kind"
equals = "trace"

[[assertions]]
kind = "returncode"
step = "ctx-list"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-list"
path = "schema_version"
equals = "opentraces.ctx.list.v2"

# The bucket holds zero traces — read-in-place, no auto-adoption.
[[assertions]]
kind = "stdout_json_length_equals"
step = "ctx-list"
path = "traces"
equals = 0

[[assertions]]
kind = "returncode"
step = "bucket-status"
equals = 0

# The private bucket holds zero trace records — no legacy adoption.
# Issue #97 — status is summary-only; the count answers "zero records".
[[assertions]]
kind = "stdout_json"
step = "bucket-status"
path = "bucket.trace_count"
equals = 0
