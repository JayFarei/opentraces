name = "ctx-show-with-lazy-blob-fetch"
description = """
Plan 080 Phase D mechanism journey (GOLD) — `ctx show <node> --remote`
fetches layer blobs lazily on first access; subsequent reads of the
same node are cache hits.

Per Plan 080 §6 (Pull patterns -> Lazy blob resolution on `ctx show`),
§7 (`ctx show` does 4 blob fetches; cold cache against remote takes
~500ms-2s, local hit ~10ms), and §10 performance gate
`bench-ctx-show-remote-miss: <3s with progress`.

The load-bearing claim is twofold:
  (a) `ctx show <node> --remote` against a bucket whose blob is NOT
      present locally MUST fetch it from the remote (and write it
      into the local cache so the next call is fast).
  (b) `ctx show <node> --remote` re-run against the same node MUST
      NOT re-fetch (cache hit; no network call).

Setup (provided by the checkpoint c-bucket-spine-v2-pushed-fake-remote):
  1. Capture a session that produces N layer blobs.
  2. Push to a fake HF remote.
  3. Drop the local blob namespace (`bucket/blobs/v1/<project>/context/`)
     so the first `ctx show --remote` MUST fetch from the remote.

Asserts:
  (a) First `ctx show <node> --remote --json` exits 0 and reports
      `layers.<type>.fetched_from == "remote"` (the CLI stamps the
      provenance of each blob load).
  (b) The blob now exists at `bucket/blobs/v1/<project>/context/<hh>/
      <hash>.json.gz` (the lazy fetch wrote it into the cache).
  (c) Second `ctx show <node> --remote --json` exits 0 and reports
      `layers.<type>.fetched_from == "cache"` (no second wire fetch).
  (d) The two `ctx show` calls return byte-identical layer content
      (the cache write didn't corrupt the payload).

Fails today because:
  - The `--remote` flag on `ctx show` is Track D2 wiring.
  - The lazy-fetch provenance stamp (`fetched_from`) is the new
    Phase D CLI surface; not yet wired.
  - The blob-drop-then-restore checkpoint
    `c-bucket-spine-v2-pushed-fake-remote-blob-dropped` is a Phase D
    otbox fixture follow-up.

Cross-track dependencies:
  - D1: `RemoteHubBackend.get_layer_blob` (the lazy fetch primitive).
  - D2: `ctx show --remote` CLI wiring + cache-write side effect +
    `fetched_from` provenance stamp on the JSON envelope.
  - Phase D otbox: `c-bucket-spine-v2-pushed-fake-remote-blob-dropped`
    checkpoint factory (drops local blob namespace post-push).
"""
lane = "core"
tier = 1  # PHASE-D: opt-in pending checkpoint c-bucket-spine-v2-pushed-fake-remote-blob-dropped.
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-pushed-fake-remote-blob-dropped"]

[preconditions]
min_captured_traces = 1
bucket_spine_v2_layout = true
context_tree_built = true
pushed_to_fake_remote = true
local_blobs_dropped = true

# ---------------------------------------------------------------------
# Step 1 — first `ctx show --remote` fetches the blob from the remote.
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-show-remote-first-fetch"
argv = ["ctx", "show", "{first_context_node_id}", "--remote", "{fake_hf_repo_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-show-remote-first-fetch"
equals = 0

# All four canonical layer types resolved.
[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-first-fetch"
path = "layers.system.layer_id"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-first-fetch"
path = "layers.messages.layer_id"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-first-fetch"
path = "layers.tool_registry.layer_id"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-first-fetch"
path = "layers.runtime_state.layer_id"

# Provenance: at least one layer was fetched from the remote (cold miss).
[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-first-fetch"
path = "layers.system.fetched_from"
equals = "remote"

# ---------------------------------------------------------------------
# Step 2 — the blob is now cached locally (the lazy fetch wrote it).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "bucket-verify-blob-cached-locally"
argv = ["bucket", "verify", "--sample", "10", "--json"]

[[assertions]]
kind = "returncode"
step = "bucket-verify-blob-cached-locally"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "bucket-verify-blob-cached-locally"
path = "verify.ok"
equals = true

# At least one blob is on disk (the one we just lazily fetched).
[[assertions]]
kind = "stdout_json"
step = "bucket-verify-blob-cached-locally"
path = "verify.compression_check.blobs_checked"

# ---------------------------------------------------------------------
# Step 3 — second `ctx show --remote` is a cache hit (no fetch).
# ---------------------------------------------------------------------
[[steps]]
type = "cli"
id = "ctx-show-remote-second-cached"
argv = ["ctx", "show", "{first_context_node_id}", "--remote", "{fake_hf_repo_id}", "--json"]

[[assertions]]
kind = "returncode"
step = "ctx-show-remote-second-cached"
equals = 0

# Provenance: layers were cache hits, NOT re-fetched.
[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-second-cached"
path = "layers.system.fetched_from"
equals = "cache"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-second-cached"
path = "layers.messages.fetched_from"
equals = "cache"

# ---------------------------------------------------------------------
# Step 4 — second call returns byte-identical content to the first.
# ---------------------------------------------------------------------
[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-show-remote-second-cached"
path = "layers.system.layer_id"
equals_var = "ctx-show-remote-first-fetch:layers.system.layer_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-show-remote-second-cached"
path = "layers.messages.layer_id"
equals_var = "ctx-show-remote-first-fetch:layers.messages.layer_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-show-remote-second-cached"
path = "layers.tool_registry.layer_id"
equals_var = "ctx-show-remote-first-fetch:layers.tool_registry.layer_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-show-remote-second-cached"
path = "layers.runtime_state.layer_id"
equals_var = "ctx-show-remote-first-fetch:layers.runtime_state.layer_id"
