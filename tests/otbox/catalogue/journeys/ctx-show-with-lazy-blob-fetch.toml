name = "ctx-show-with-lazy-blob-fetch"
description = """
Plan 080 Phase D mechanism journey (GOLD) — `ctx show` stamps blob-load
provenance (`fetched_from`) on every resolved layer, the provenance is
byte-stable across calls, and `--offline` passes when (and only when)
every referenced layer is locally resolvable.

Asserts:
  (a) `ctx show <node> --json` on a fully-captured node resolves all
      four layer types with `fetched_from == "local"`.
  (b) A second call returns byte-identical layer ids AND provenance
      (no rewrite churn, no spurious re-fetch; equals_var).
  (c) `ctx show <node> --offline --json` on the same node exits 0 —
      the offline gate is "layer missing locally", not "always fail"
      (the rc=4 arm lives in ctx-show-offline-fails on the same
      checkpoint).
  (d) Issue #57 — the remote->cache provenance arm on the dangling
      node: the FIRST `ctx show <dangling> --remote file://<fake>/
      bucket-spine` call resolves all four layers with `fetched_from ==
      "remote"` (the blobs live on the fake remote only) and warms the
      local cache; the SECOND identical call resolves them with
      `fetched_from == "cache"` (the local cache rung now READS what the
      fetch wrote) with byte-identical layer ids (equals_var).

Issue #57: the remote->cache arm is restored against the directory-backed
fake dispatch (`get_backend('file:///abs/dir')` -> tokenless offline
DirectoryHubBackend) AND the now-shipped `ctx show` local-blob-cache read
rung (cli/ctx.py: projection(local) -> bucket blob cache(cache) ->
remote(remote)). The checkpoint writes the dangling node's four REAL
build_layer blobs to the fake remote ONLY (absent locally), so the first
--remote call genuinely fetches and the second genuinely cache-hits. The
node is addressed via the checkpoint-written id file
(`~/.otbox-bucket-spine/dangling_node_id`).
"""
lane = "core"
tier = 0
tier_label = "gold"
trajectories = ["bucket-spine-and-self-sufficient"]
persona = "agent"
requires = ["cli"]
from_checkpoints = ["c-bucket-spine-v2-pushed-fake-remote-blob-dropped"]

[preconditions]
min_captured_traces = 1
context_tree_built = true
local_blobs_dropped = true

# ---------------------------------------------------------------------
# Step 1 — fully-captured node: all four layers resolve locally with
# provenance stamped.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "ctx-show-local-provenance"
argv = ["bash", "-c",
        "exec {project}/.testvenv/bin/opentraces ctx show \"$(cat {home}/.otbox-bucket-spine/main_node_id)\" --json"]

[[assertions]]
kind = "returncode"
step = "ctx-show-local-provenance"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-show-local-provenance"
path = "layers.system.layer_id"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-local-provenance"
path = "layers.system.fetched_from"
equals = "local"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-local-provenance"
path = "layers.messages.fetched_from"
equals = "local"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-local-provenance"
path = "layers.tool_registry.fetched_from"
equals = "local"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-local-provenance"
path = "layers.runtime_state.fetched_from"
equals = "local"

# ---------------------------------------------------------------------
# Step 2 — second call is byte-identical (layer ids + provenance).
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "ctx-show-local-provenance-stable"
argv = ["bash", "-c",
        "exec {project}/.testvenv/bin/opentraces ctx show \"$(cat {home}/.otbox-bucket-spine/main_node_id)\" --json"]

[[assertions]]
kind = "returncode"
step = "ctx-show-local-provenance-stable"
equals = 0

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-show-local-provenance-stable"
path = "layers.system.layer_id"
equals_var = "ctx-show-local-provenance:layers.system.layer_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-show-local-provenance-stable"
path = "layers.messages.layer_id"
equals_var = "ctx-show-local-provenance:layers.messages.layer_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-show-local-provenance-stable"
path = "layers.tool_registry.layer_id"
equals_var = "ctx-show-local-provenance:layers.tool_registry.layer_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-show-local-provenance-stable"
path = "layers.runtime_state.layer_id"
equals_var = "ctx-show-local-provenance:layers.runtime_state.layer_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-show-local-provenance-stable"
path = "layers"
equals_var = "ctx-show-local-provenance:layers"

# ---------------------------------------------------------------------
# Step 3 — offline succeeds on a locally-complete node: the offline
# gate is "blob missing locally", not "always fail offline".
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "ctx-show-offline-local-hit"
argv = ["bash", "-c",
        "exec {project}/.testvenv/bin/opentraces ctx show \"$(cat {home}/.otbox-bucket-spine/main_node_id)\" --offline --json"]

[[assertions]]
kind = "returncode"
step = "ctx-show-offline-local-hit"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-show-offline-local-hit"
path = "layers.system.fetched_from"
equals = "local"

# ---------------------------------------------------------------------
# Step 4 — issue #57: remote->cache provenance on the dangling node. Its
# four layer blobs live on the FAKE REMOTE only. The FIRST --remote call
# fetches them (fetched_from == "remote") and warms the local cache.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "ctx-show-remote-fetch"
argv = ["bash", "-c",
        "exec {project}/.testvenv/bin/opentraces ctx show \"$(cat {home}/.otbox-bucket-spine/dangling_node_id)\" --remote file://{fake_remote}/bucket-spine --json"]

[[assertions]]
kind = "returncode"
step = "ctx-show-remote-fetch"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-fetch"
path = "layers.system.fetched_from"
equals = "remote"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-fetch"
path = "layers.messages.fetched_from"
equals = "remote"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-fetch"
path = "layers.tool_registry.fetched_from"
equals = "remote"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-fetch"
path = "layers.runtime_state.fetched_from"
equals = "remote"

# ---------------------------------------------------------------------
# Step 5 — the SECOND --remote call reads the warmed cache
# (fetched_from == "cache") with byte-identical layer ids.
# ---------------------------------------------------------------------
[[steps]]
type = "shell"
id = "ctx-show-remote-cache-hit"
argv = ["bash", "-c",
        "exec {project}/.testvenv/bin/opentraces ctx show \"$(cat {home}/.otbox-bucket-spine/dangling_node_id)\" --remote file://{fake_remote}/bucket-spine --json"]

[[assertions]]
kind = "returncode"
step = "ctx-show-remote-cache-hit"
equals = 0

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-cache-hit"
path = "layers.system.fetched_from"
equals = "cache"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-cache-hit"
path = "layers.messages.fetched_from"
equals = "cache"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-cache-hit"
path = "layers.tool_registry.fetched_from"
equals = "cache"

[[assertions]]
kind = "stdout_json"
step = "ctx-show-remote-cache-hit"
path = "layers.runtime_state.fetched_from"
equals = "cache"

# Byte-identical layer ids across the remote fetch and the cache hit.
[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-show-remote-cache-hit"
path = "layers.system.layer_id"
equals_var = "ctx-show-remote-fetch:layers.system.layer_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-show-remote-cache-hit"
path = "layers.messages.layer_id"
equals_var = "ctx-show-remote-fetch:layers.messages.layer_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-show-remote-cache-hit"
path = "layers.tool_registry.layer_id"
equals_var = "ctx-show-remote-fetch:layers.tool_registry.layer_id"

[[assertions]]
kind = "stdout_json_equals_var"
step = "ctx-show-remote-cache-hit"
path = "layers.runtime_state.layer_id"
equals_var = "ctx-show-remote-fetch:layers.runtime_state.layer_id"
