# otbox catalogue quarantine — tracked, expiring debt (otbox 2.0 phase 2).
#
# Each entry is ONE decision: a family of journeys sharing one reason, one
# issue, one expiry. Max 15 entries (lint-enforced). Expired entries hard-fail
# the lint on every PR; entries naming unknown journeys hard-fail; widening
# requires a reviewed diff to this file. NEVER quarantine to make a gate
# green — quarantine records debt, it does not erase it.

