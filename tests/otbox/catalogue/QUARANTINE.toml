# otbox catalogue quarantine — tracked, expiring debt (otbox 2.0 phase 2).
#
# Each entry is ONE decision: a family of journeys sharing one reason, one
# issue, one expiry. Max 15 entries (lint-enforced). Expired entries hard-fail
# the lint on every PR; entries naming unknown journeys hard-fail; widening
# requires a reviewed diff to this file. NEVER quarantine to make a gate
# green — quarantine records debt, it does not erase it.

[[entries]]
journeys = [
  "context-tree-branching-fidelity",
  "context-tree-capture-fidelity",
  "context-tree-compaction-fidelity",
  "context-tree-ctx-output-parity",
  "context-tree-ctx-prune-no-clobber",
  "context-tree-ctx-resolve-empty-state",
  "context-tree-ctx-show-bounded-default",
  "context-tree-demo-acceptance",
  "context-tree-determinism",
  "context-tree-fork-fidelity",
  "context-tree-temporal-anchor-precision",
]
rules = ["unregistered-checkpoint", "unknown-precondition"]
reason = "c-context-tree-substrate / c-rewound-session / c-compacted-session checkpoints deferred from plan 077 phase 4; build or delete by expiry"
issue = "https://github.com/JayFarei/opentraces/issues/25"
added = 2026-06-10
expires = 2026-09-08

