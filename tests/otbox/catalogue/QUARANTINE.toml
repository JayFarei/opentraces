# otbox catalogue quarantine — tracked, expiring debt (otbox 2.0 phase 2).
#
# Each entry is ONE decision: a family of journeys sharing one reason, one
# issue, one expiry. Max 15 entries (lint-enforced). Expired entries hard-fail
# the lint on every PR; entries naming unknown journeys hard-fail; widening
# requires a reviewed diff to this file. NEVER quarantine to make a gate
# green — quarantine records debt, it does not erase it.

[[entries]]
journeys = [
  "bucket-compression-integrity-roundtrip",
  "bucket-events-mirror-replay-equals-git",
  "bucket-manifest-v2-shape",
  "bucket-prune-orphan-only",
  "bucket-rebuild-context-tree-substrate",
  "bucket-remote-sync-scope-per-trace",
  "bucket-self-sufficient-everything",
  "bucket-symmetric-local-remote",
]
rules = ["unregistered-checkpoint", "unknown-precondition", "lane-unreachable"]
reason = "bucket-spine-v2 checkpoint family (plan 080 phases B/C/D) never built; precondition keys await PRECONDITION_VOCAB widening + runtime probes (otbox 2.0 phase 4). The otbox-42-worlds-envelopes package builds the c-bucket-spine-v2-* checkpoints + probes and lists per-journey un-quarantine in its handoff; remove each journey here as that package proves it green."
issue = "https://github.com/JayFarei/opentraces/issues/42"
added = 2026-06-10
expires = 2026-09-08

