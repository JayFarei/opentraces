name = "pi-linear-edit"
description = "basic edit + commit for Pi live-capture lane."
agent = "pi"
binary_name = "pi"

[initial_state]
template = "single-file-python-project"

[[turns]]
prompt = "In this repo, add a farewell(name: str) helper to src/app.py, keep greet working, run a focused check, then commit the change with a concise message."
expect_regex = "(?is)(committed|created commit|commit [0-9a-f]{7,})"
timeout_s = 240

[capture]
artifact_dir = "pi-linear-edit"
expected_paths = ["src/app.py"]
