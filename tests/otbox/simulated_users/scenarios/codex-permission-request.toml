name = "codex-permission-request"
description = "C9: drive Codex toward an approval boundary while keeping opentraces observational."
agent = "codex"
binary_name = "codex"

[initial_state]
template = "single-file-python-project"

[[turns]]
prompt = "Make a small safe edit to src/app.py, but before any potentially destructive shell command explain the command you would need approval for instead of running it. Commit only the safe edit."
expect_regex = "(?is)(committed|created commit|commit [0-9a-f]{7,})"
timeout_s = 240

[capture]
artifact_dir = "codex-permission-request"
expected_paths = ["src/app.py"]
