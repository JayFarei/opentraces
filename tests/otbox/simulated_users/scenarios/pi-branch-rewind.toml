name = "pi-branch-rewind"
description = "branch/tree navigation smoke for Pi."
agent = "pi"
binary_name = "pi"

[initial_state]
template = "single-file-python-project"

[[turns]]
prompt = "Create a small helper in src/app.py, avoid extra branches unless needed, and commit the change."
expect_regex = "(?is)(committed|created commit|commit [0-9a-f]{7,})"
timeout_s = 240

[capture]
artifact_dir = "pi-branch-rewind"
expected_paths = ["src/app.py"]
