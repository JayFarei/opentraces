name = "codex-readonly-search"
description = "C11: drive Codex through read/search-heavy work that should not emit patches."
agent = "codex"
binary_name = "codex"

[initial_state]
template = "single-file-python-project"

[[turns]]
prompt = "Inspect the project without editing files. Report the code location for the greeting helper and the docs location for the greeting behavior. Do not commit."
expect_regex = "(?is)(src/app\\.py.*README\\.md|README\\.md.*src/app\\.py)"
timeout_s = 180

[capture]
artifact_dir = "codex-readonly-search"
expected_paths = ["README.md", "src/app.py"]
