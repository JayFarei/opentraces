name = "pi-readonly-search"
description = "OpenTraces readonly search/recursion guard smoke for Pi."
agent = "pi"
binary_name = "pi"

[initial_state]
template = "single-file-python-project"

[[turns]]
prompt = "Call the OpenTraces capture status tool ot_capture_status, report the local readiness result, make no code changes, and end your final response with the uppercase marker formed by OPENTRACES, READONLY, and DONE joined by hyphens."
expect_regex = "OPENTRACES-READONLY-DONE"
timeout_s = 240

[capture]
artifact_dir = "pi-readonly-search"
expected_paths = ["src/app.py"]
