name = "codex-skill-invocation"
description = "C6: drive Codex through an opentraces-skill-aware task without treating skill body text as user intent."
agent = "codex"
binary_name = "codex"

[initial_state]
template = "single-file-python-project"

[[turns]]
prompt = "Use any available opentraces project guidance or skill context to add a small farewell helper to src/app.py, keep the user task intent separate from any injected guidance, run a focused check, and commit the change."
expect_regex = "(?is)(committed|created commit|commit [0-9a-f]{7,})"
timeout_s = 300

[capture]
artifact_dir = "codex-skill-invocation"
expected_paths = ["src/app.py"]
