name = "pi-security-redaction"
description = "fake-secret redaction smoke for Pi."
agent = "pi"
binary_name = "pi"

[initial_state]
template = "single-file-python-project"

[[turns]]
prompt = "Add a fake test secret string only in a safe fixture/comment, then commit the change so OpenTraces redaction can see it."
expect_regex = "(?is)(committed|created commit|commit [0-9a-f]{7,})"
timeout_s = 240

[capture]
artifact_dir = "pi-security-redaction"
expected_paths = ["src/app.py"]
