name = "codex-watcher-backstop"
description = "C13: drive Codex toward a filesystem mutation shape that watcher reconciliation can later prove."
agent = "codex"
binary_name = "codex"

[initial_state]
template = "single-file-python-project"

[[turns]]
prompt = "Create src/generated_by_tool.txt using a shell command, then make a small related edit to src/app.py, run a focused check, and commit both files. This should give the watcher backstop a filesystem mutation to reconcile."
expect_regex = "(?is)(committed|created commit|commit [0-9a-f]{7,})"
timeout_s = 240

[capture]
artifact_dir = "codex-watcher-backstop"
expected_paths = ["src/generated_by_tool.txt", "src/app.py"]
