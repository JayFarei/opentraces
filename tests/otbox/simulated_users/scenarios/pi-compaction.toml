name = "pi-compaction"
description = "compaction/session tree smoke for Pi."
agent = "pi"
binary_name = "pi"

[initial_state]
template = "single-file-python-project"

[[turns]]
prompt = "Make a small documented change to src/app.py and commit it after summarizing the context."
expect_regex = "(?is)(committed|created commit|commit [0-9a-f]{7,})"
timeout_s = 240

[capture]
artifact_dir = "pi-compaction"
expected_paths = ["src/app.py"]
