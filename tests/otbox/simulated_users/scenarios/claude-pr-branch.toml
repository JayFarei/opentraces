# Plan B0 — claude credible-state batch. See claude-linear-edit.toml header.

name = "claude-pr-branch"
description = "CL5: drive real Claude Code through feature-branch work (branch + commits off main) — the pr-branch world shape that trail blame pr consumes."
agent = "claude"
binary_name = "claude"

[initial_state]
template = "single-file-python-project"

[[turns]]
prompt = "Create a feature branch named feat/farewell-helper off the current branch, add a farewell(name: str) helper to src/app.py on that branch, run a quick check, and commit with message 'feat: add farewell helper'."
expect_regex = "(?is)(committed|created commit|commit [0-9a-f]{7,})"
timeout_s = 300

[[turns]]
prompt = "On the same branch, update README.md with a one-line description of the new helper and commit with message 'docs: mention farewell helper'. Then show me 'git log --oneline main..HEAD'."
expect_regex = "(?is)(farewell|docs:|[0-9a-f]{7,})"
timeout_s = 300

[capture]
artifact_dir = "claude-pr-branch"
expected_paths = ["src/app.py", "README.md"]
