# Plan B0 — claude credible-state batch. See claude-linear-edit.toml header.

name = "claude-with-secrets"
description = "CL3: drive real Claude Code through secret-shaped content so the harness-neutral security pipeline can be asserted on a real session."
agent = "claude"
binary_name = "claude"

[initial_state]
template = "single-file-python-project"

[[turns]]
prompt = "Create src/config.py with a clearly fake secret canary named API_TOKEN set to sk-test-abc123def456, wire nothing to production code, run a focused syntax check, and commit it. This is a security-redaction fixture."
expect_regex = "(?is)(committed|created commit|commit [0-9a-f]{7,})"
timeout_s = 300

[capture]
artifact_dir = "claude-with-secrets"
expected_paths = ["src/config.py"]
