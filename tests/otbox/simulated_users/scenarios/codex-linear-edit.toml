name = "codex-linear-edit"
description = "C1: drive Codex through a small edit plus git commit for the minimum live-capture lane."
agent = "codex"
binary_name = "codex"

[initial_state]
template = "single-file-python-project"

[[turns]]
prompt = "In this repo, add a farewell(name: str) helper to src/app.py, keep the existing greet helper working, run a focused check, then commit the change with a concise message."
expect_regex = "(?is)(committed|created commit|commit [0-9a-f]{7,})"
timeout_s = 240

[capture]
artifact_dir = "codex-linear-edit"
expected_paths = ["src/app.py"]
