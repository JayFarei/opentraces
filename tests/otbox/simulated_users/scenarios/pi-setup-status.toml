name = "pi-setup-status"
description = "/ot-setup and /ot-capture-status smoke for Pi."
agent = "pi"
binary_name = "pi"

[initial_state]
template = "single-file-python-project"

[[turns]]
prompt = "Check OpenTraces setup and capture readiness, explain any local follow-ups without making network changes, and end with the uppercase marker formed by OPENTRACES, SETUP, and DONE joined by hyphens."
expect_regex = "OPENTRACES-SETUP-DONE"
timeout_s = 240

[capture]
artifact_dir = "pi-setup-status"
expected_paths = ["src/app.py"]
