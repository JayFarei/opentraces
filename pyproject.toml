[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentraces"
version = "0.1.0"
description = "Crowdsource agent traces to HuggingFace Hub"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "opentraces-schema>=0.1.0",
    "click>=8.0",
    "huggingface_hub>=0.20.0",
    "pyclack-cli>=0.4.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
tui = ["textual>=0.50.0"]
dev = ["pytest>=8.0", "pytest-cov", "ruff"]

[project.scripts]
opentraces = "opentraces.cli:main"
ot = "opentraces.cli:main"
lazytraces = "opentraces.review.tui_review:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opentraces"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
