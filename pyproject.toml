[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentraces"
dynamic = ["version"]
description = "Crowdsource agent traces to HuggingFace Hub"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "opentraces-schema>=0.7.0,<1.0.0",
    "click>=8.0",
    "huggingface_hub>=0.20.0",
    "mmh3>=4.0",
    "pyclack-cli>=0.4.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "rich>=13.0",
]

[project.optional-dependencies]
import = ["datasets>=2.16.0"]
# LLM polish via the Anthropic API. Most users won't need this — the
# `claude` and `codex` CLIs (with subscription auth) are preferred and
# have no extra install. Opt in with `pip install opentraces[llm-api]`.
llm-api = ["anthropic>=0.40.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-xdist>=3.6",
    "ruff",
    "datasets>=2.16.0",
    "anthropic>=0.40.0",
    "huggingface-hub==1.10.2",
    "hf-xet==1.4.3",
]
release = ["build", "twine"]

[project.scripts]
opentraces = "opentraces.cli:main"
ot = "opentraces.cli:main"

[project.urls]
Homepage = "https://opentraces.ai"
Repository = "https://github.com/JayFarei/opentraces"

[tool.hatch.version]
path = "src/opentraces/__init__.py"
pattern = "__version__ = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/opentraces"]

[tool.hatch.build.targets.wheel.force-include]
"skill/SKILL.md" = "opentraces/skill/SKILL.md"
"skill/workflow-authoring" = "opentraces/skill/workflow-authoring"
"skill/verifier-creator" = "opentraces/skill/verifier-creator"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_repl: scenario drives a real claude REPL via tmux (opt-in via OT_REAL_REPL=1)",
    "trail_real_repl: scenario drives real Claude/tmux and asserts Trace Trails CLI JSON (also opt-in via OT_TRAIL_REAL_REPL=1)",
    "regression_gate: cherry-picked spike-regression scenarios (plan 043 no-regression gate)",
    "integration: slower integration and UAT coverage outside the fast pre-merge lane",
    "e2e: slower end-to-end coverage outside the fast pre-merge lane",
    "otbox: snapshottable otbox environment coverage outside the pytest pre-merge lane",
    "perf: deterministic latency and memory performance harness",
    "timing_sensitive: wall-clock budget assertion; run serially to avoid xdist/CI contention",
    "user_smoke: opt-in tmux/browser user smoke coverage",
    "arena: disposable-box bench scenarios (run through opentraces bench run)",
]
