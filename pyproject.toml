[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opentraces"
dynamic = ["version"]
description = "Crowdsource agent traces to HuggingFace Hub"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "opentraces-schema>=0.3.0,<1.0.0",
    "click>=8.0",
    "flask>=3.0",
    "huggingface_hub>=0.20.0",
    "mmh3>=4.0",
    "pyclack-cli>=0.4.0",
    "requests>=2.31.0",
    "textual>=0.50.0",
]

[project.optional-dependencies]
web = ["flask>=3.0"]
tui = ["textual>=0.50.0"]
import = ["datasets>=2.16.0"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "datasets>=2.16.0"]
release = ["build", "twine"]

[project.scripts]
opentraces = "opentraces.cli:main"
ot = "opentraces.cli:main"
lazytraces = "opentraces.clients.tui:main"

[project.urls]
Homepage = "https://opentraces.ai"
Repository = "https://github.com/JayFarei/opentraces"

[tool.hatch.version]
path = "src/opentraces/__init__.py"
pattern = "__version__ = \"(?P<version>[^\"]+)\""

[tool.hatch.build.targets.wheel]
packages = ["src/opentraces"]

[tool.hatch.build.targets.wheel.force-include]
"skill/SKILL.md" = "opentraces/skill/SKILL.md"
"web/viewer/dist" = "opentraces/static/viewer"

# Hatch's sdist honours .gitignore by default, which excludes web/viewer/dist
# (the compiled viewer bundle is gitignored because it's a build output). The
# wheel build from an extracted sdist then fails because the force-include
# above cannot find web/viewer/dist. Explicitly re-including the bundle here
# keeps git history free of generated assets while letting the sdist carry
# everything the wheel needs.
[tool.hatch.build.targets.sdist.force-include]
"web/viewer/dist" = "web/viewer/dist"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_repl: scenario drives a real claude REPL via tmux (opt-in via OT_REAL_REPL=1)",
    "regression_gate: cherry-picked spike-regression scenarios (plan 043 no-regression gate)",
    "perf: deterministic latency and memory performance harness",
    "user_smoke: opt-in tmux/browser user smoke coverage",
]
