addressable_markers:
- rl.goal-forge.constraint_preservation
- rl.goal-forge.honest_stop
approval_state: manual_required_default_off
archetype_id: goal_contract_downstream_outcome_v1
archetype_spec:
  archetype_id: goal_contract_downstream_outcome_v1
  baseline_skill: '# goal-forge (baseline)


    Turn a messy request into a goal.

    '
  contract_elements:
  - detectors:
      text_any:
      - outcome
      - goal
      - done means
      - definition of done
      - finish line
    element_id: outcome
    label: Explicit outcome / definition of done
    marker: rl.goal-forge.outcome_contract
    weight: 1.0
  - detectors:
      command_families:
      - verification
      text_any:
      - verif
      - verified by
      - test
      - check
      - assert
      - pass
    element_id: verification
    label: Verification surface
    marker: rl.goal-forge.verification_surface
    weight: 1.0
  - detectors:
      text_any:
      - constraint
      - must not
      - preserve
      - do not
      - boundary
      - scope
    element_id: constraints
    label: Constraint / boundary preservation
    marker: rl.goal-forge.constraint_preservation
    weight: 1.0
  - detectors:
      text_any:
      - blocked
      - stop
      - halt
      - ask for
      - give up
      - escalat
    element_id: honest_stop
    label: Blocked / honest-stop condition
    marker: rl.goal-forge.honest_stop
    weight: 1.0
  - detectors:
      committed: true
      outcome_label_in:
      - success
      outcome_reward_min: 0.5
    element_id: downstream
    label: Downstream landed/verified outcome
    marker: rl.goal-forge.downstream_outcome
    weight: 1.5
  creator_questions:
  - inferred_default: Goal carries outcome+verification+constraints+honest-stop AND
      downstream work landed/verified.
    key: success_definition
    options:
    - downstream_landed
    - contract_complete
    - both
    question: What counts as a successful goal-forge outcome?
    rationale: Briefs br/66 (verifier gap) + br/51 (outcome factor vector + firmness).
  - inferred_default: Trace outcome_reward (committed + verified + Trail survival).
    key: downstream_signal
    options:
    - outcome_reward
    - tests_pass
    - human_label
    question: Which downstream signal is the ground-truth reward?
    rationale: 'br/56: git-survival reward sits outside the agent trust domain.'
  - inferred_default: "Yes \u2014 missing constraint_preservation is a deficient marker\
      \ regardless of landing."
    key: drift_policy
    options:
    - penalize
    - ignore
    question: Should constraint drift be penalized even if work landed?
    rationale: Goal-forge's value is constraint fidelity, not just completion.
  description: A goal-forge invocation is good when the goal it produces is a usable
    contract (outcome, verification surface, constraints, honest stop) AND the downstream
    agent that ran against that goal actually landed verified work.
  live_legs:
  - description: Re-roll a downstream agent against the generated goal and score whether
      it preserved constraints / verified / stopped honestly. Opt-in, real agent.
    kind: agent_rerollout
    leg_id: downstream_agent_rerollout
    requires:
    - real_agent
    - OT_REAL_REPL
  - description: LLM-graded rubric over the produced goal's contract completeness.
      Opt-in.
    kind: llm_rubric
    leg_id: goal_contract_llm_rubric
    requires:
    - llm_endpoint
  min_traces_for_split: 6
  schema_version: opentraces.skill_verifier_archetype.v1
  semantic_target: 'messy request -> generated goal -> downstream agent rollout: did
    the agent preserve constraints, verify correctly, avoid drift, and stop honestly?'
  skill: goal-forge
  title: Goal contract + downstream outcome
