approval_state: manual_required_default_off
archetype_id: generic_skill_outcome_v1
archetype_spec:
  archetype_id: generic_skill_outcome_v1
  baseline_skill: '# architecture-patterns (baseline)


    Follow the architecture-patterns skill.

    '
  contract_elements:
  - detectors:
      command_families:
      - search_read
      has_commands: true
      tool_any:
      - read
      - grep
      - glob
      - exec
    element_id: context_read
    label: Read / inspected context before acting
    marker: rl.architecture-patterns.generic.context_read
    weight: 1.0
  - detectors:
      command_families:
      - edit_write
      - git_commit
      has_files: true
    element_id: produced_changes
    label: Produced concrete changes (files / patches / commit)
    marker: rl.architecture-patterns.generic.produced_changes
    weight: 1.0
  - detectors:
      command_families:
      - verification
    element_id: verification_run
    label: Ran a verification command (tests / lint / build)
    marker: rl.architecture-patterns.generic.verification_run
    weight: 1.5
  - detectors:
      command_families:
      - git_commit
      committed: true
      outcome_label_in:
      - success
      outcome_reward_min: 0.5
    element_id: landed_outcome
    label: Landed / verified downstream outcome
    marker: rl.architecture-patterns.generic.landed_outcome
    weight: 1.5
  - detectors:
      outcome_label_in:
      - success
      - failure
    element_id: honest_completion
    label: Terminal, non-abandoned outcome
    marker: rl.architecture-patterns.generic.honest_completion
    weight: 1.0
  creator_questions:
  - inferred_default: Read context + produced changes that ran verification and landed.
    key: outcome_floor
    options:
    - changes_landed
    - verified_and_landed
    - context_only
    question: What is the minimum for a successful invocation of this skill?
    rationale: Universal trace signal families; refine per skill after human review.
  - inferred_default: "Yes \u2014 verification_run is high-weight; partial credit\
      \ without it."
    key: verification_required
    options:
    - required
    - bonus
    question: Is running a verification command required for full reward?
    rationale: 'br/51: executable verification is the strongest outcome signal.'
  - inferred_default: "Pending human review \u2014 generic drafts are advisory until\
      \ approved."
    key: promote_to_curated
    options:
    - specialize
    - keep_generic
    - discard
    question: Should this draft be hand-specialized into a curated archetype?
    rationale: 'br/56: generic, text-adjacent markers are the highest reward-hacking
      risk.'
  description: 'A trace-derived baseline verifier for the architecture-patterns skill:
    did the invocation read context, produce concrete changes, run verification, and
    land an honest outcome? Proposed from universal trace signal families; intended
    as a human-reviewed DRAFT, not a curated semantic verifier.'
  live_legs:
  - description: Re-roll the agent on the task and score whether it read context,
      ran verification, and landed. Opt-in, real agent.
    kind: agent_rerollout
    leg_id: generic_agent_rerollout
    requires:
    - real_agent
    - OT_REAL_REPL
  min_traces_for_split: 6
  schema_version: opentraces.skill_verifier_archetype.v1
  semantic_target: did the skill invocation read context, produce verified changes,
