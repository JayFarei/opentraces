addressable_markers:
- rl.review.cite_file_line
approval_state: manual_required_default_off
archetype_id: review_grounded_findings_v1
archetype_spec:
  archetype_id: review_grounded_findings_v1
  baseline_skill: '# review (baseline)


    Review the change.

    '
  contract_elements:
  - detectors:
      command_families:
      - search_read
      has_files: true
      text_any:
      - file
      - diff
      - line
      - hunk
    element_id: grounded
    label: Findings reference real touched files
    marker: rl.review.grounded_findings
    weight: 1.5
  - detectors:
      command_any:
      - '.py:'
      - '.ts:'
      - '.md:'
      - 'line '
      text_any:
      - line
      - evidence
      - cite
      - grounded
      - reference
    element_id: cite
    label: Findings cite file:line evidence
    marker: rl.review.cite_file_line
    weight: 1.0
  - detectors:
      committed: true
      outcome_label_in:
      - success
      outcome_reward_min: 0.5
    element_id: downstream
    label: Verdict consistent with landed outcome
    marker: rl.review.downstream_outcome
    weight: 1.0
  creator_questions:
  - inferred_default: Each finding must reference a file present in files_touched.
    key: grounding_floor
    options:
    - file_ref
    - file_line_ref
    - any
    question: What is the minimum grounding for a finding to count?
    rationale: 'br/56: reward must resist hallucination; ground in real artifacts.'
  - inferred_default: "Yes \u2014 a 'looks good' verdict on reverted work is a deficient\
      \ marker."
    key: verdict_consistency
    options:
    - check
    - ignore
    question: Should the verdict be checked against the landed outcome?
    rationale: Trail survival is the tamper-resistant downstream check.
  description: 'A review invocation is good when its findings are grounded in real
    artifacts: each finding cites a file (and ideally a line) present in the trace,
    rather than hallucinated, and the review''s verdict matches the landed outcome.'
  live_legs:
  - description: LLM-graded rubric scoring each finding's groundedness against the
      diff. Opt-in.
    kind: llm_rubric
    leg_id: review_groundedness_llm_rubric
    requires:
    - llm_endpoint
  min_traces_for_split: 6
  schema_version: opentraces.skill_verifier_archetype.v1
  semantic_target: findings grounded in the actual diff/code (file:line citations
    to real artifacts), not hallucinated, with a verdict consistent with the outcome.
  skill: review
  title: Review with grounded findings
