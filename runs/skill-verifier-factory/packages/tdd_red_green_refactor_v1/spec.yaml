addressable_markers:
- rl.tdd.refactor
approval_state: manual_required_default_off
archetype_id: tdd_red_green_refactor_v1
archetype_spec:
  archetype_id: tdd_red_green_refactor_v1
  baseline_skill: '# tdd (baseline)


    Write code with tests.

    '
  contract_elements:
  - detectors:
      command_any:
      - test_
      - _test
      - tests/
      file_globs:
      - test
      text_any:
      - failing test
      - write a test
      - red
      - test first
    element_id: red_first
    label: Failing test authored first
    marker: rl.tdd.red_first
    weight: 1.5
  - detectors:
      command_families:
      - verification
      text_any:
      - make it pass
      - green
      - passing
      - tests pass
    element_id: green_pass
    label: Implementation makes tests pass
    marker: rl.tdd.green_pass
    weight: 1.0
  - detectors:
      text_any:
      - refactor
      - clean up
      - tidy
      - simplif
      - extract
    element_id: refactor
    label: Refactor step
    marker: rl.tdd.refactor
    weight: 1.0
  - detectors:
      committed: true
      outcome_label_in:
      - success
      outcome_reward_min: 0.5
    element_id: downstream
    label: Landed / verified outcome
    marker: rl.tdd.downstream_outcome
    weight: 1.0
  creator_questions:
  - inferred_default: "Yes \u2014 red_first is the highest-weight element; test-before-impl\
      \ ordering is the signal."
    key: cycle_strictness
    options:
    - strict_order
    - presence_only
    question: Must red precede green for credit?
    rationale: 'br/51 intent hierarchy: tests are the strongest executable intent.'
  - inferred_default: Partial credit without it; full credit needs all three phases.
    key: refactor_required
    options:
    - required
    - bonus
    question: Is the refactor step required for full reward?
    rationale: Refactor is the lowest-weight element; presence is a bonus.
  description: 'A tdd invocation is good when the trace shows the red-green-refactor
    cycle: a failing test authored first, an implementation that makes it pass, and
    a refactor pass, with the change landing verified.'
  live_legs:
  - description: Re-roll an agent on the task and assert a test was added and fails
      before the fix, then passes after. Opt-in, real agent.
    kind: agent_rerollout
    leg_id: tdd_agent_rerollout
    requires:
    - real_agent
    - OT_REAL_REPL
  min_traces_for_split: 6
  schema_version: opentraces.skill_verifier_archetype.v1
  semantic_target: red (failing test first) -> green (make it pass) -> refactor, with
    the test as the executable intent and a landed verified outcome.
  skill: tdd
  title: TDD red-green-refactor trace
