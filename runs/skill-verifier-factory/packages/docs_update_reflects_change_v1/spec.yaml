addressable_markers:
- rl.docs-update.changelog
- rl.docs-update.no_stale
approval_state: manual_required_default_off
archetype_id: docs_update_reflects_change_v1
archetype_spec:
  archetype_id: docs_update_reflects_change_v1
  baseline_skill: '# docs-update (baseline)


    Update the docs.

    '
  contract_elements:
  - detectors:
      command_families:
      - search_read
      has_files: true
      text_any:
      - diff
      - code
      - file
      - function
    element_id: code_grounded
    label: Docs grounded in the changed code
    marker: rl.docs-update.code_grounded
    weight: 1.5
  - detectors:
      command_any:
      - .md
      - readme
      - changelog
      - docs/
      file_globs:
      - readme
      - changelog
      - .md
      - docs/
      - .rst
      - .mdx
      text_any:
      - readme
      - changelog
      - docs
      - documentation
    element_id: doc_artifact
    label: Touched the right doc artifact
    marker: rl.docs-update.doc_artifact
    weight: 1.0
  - detectors:
      text_any:
      - changelog
      - release note
      - version bump
      - what's new
      - whats new
    element_id: changelog
    label: Recorded the change (changelog / release notes)
    marker: rl.docs-update.changelog
    weight: 1.0
  - detectors:
      text_any:
      - stale
      - outdated
      - out of date
      - no longer
      - deprecat
      - remove
      - obsolete
    element_id: no_stale
    label: Removed stale / outdated references
    marker: rl.docs-update.no_stale
    weight: 1.5
  - detectors:
      committed: true
      outcome_label_in:
      - success
      outcome_reward_min: 0.5
    element_id: downstream
    label: Landed / verified outcome
    marker: rl.docs-update.downstream_outcome
    weight: 1.0
  creator_questions:
  - inferred_default: "Yes \u2014 code_grounded is high-weight; ungrounded docs edits\
      \ are a failure mode."
    key: grounding_floor
    options:
    - code_ref
    - any_doc_edit
    question: Must a docs edit cite the specific changed code to count?
    rationale: 'br/56: ground docs claims in the real diff to resist drift/hallucination.'
  - inferred_default: "Yes \u2014 no_stale is high-weight; leaving outdated docs is\
      \ the common failure."
    key: stale_policy
    options:
    - required
    - bonus
    question: Is removing stale references required for full reward?
    rationale: Stale docs are the dominant docs-update failure mode in practice.
  description: 'A docs-update invocation is good when the documentation it edits actually
    reflects the code change: it is grounded in the changed code, touches the right
    doc artifacts (README / CHANGELOG / docs), records the change, and removes stale
    references, with the edit landing.'
  live_legs:
  - description: LLM-graded rubric scoring whether the docs edit matches the diff
      and leaves no stale references. Opt-in.
    kind: llm_rubric
    leg_id: docs_freshness_llm_rubric
    requires:
    - llm_endpoint
  min_traces_for_split: 6
  schema_version: opentraces.skill_verifier_archetype.v1
  semantic_target: 'code change -> docs edit: do the docs reference the real changed
    code, update the changelog/readme, and remove stale references (not drift out
    of date)?'
  skill: docs-update
  title: Docs update reflects the change
